# F-Droid recipe for xyz.libravault.app
#
# This is a copy of what's submitted at gitlab.com/fdroid/fdroiddata as
# metadata/xyz.libravault.app.yml (MR !43520). Keep this in sync when the
# fdroiddata recipe changes.
#
# Maintainer notes for F-Droid reviewers:
# - The app ships a `fdroid` product flavor with a manifest overlay that
#   removes the INTERNET permission entirely. The play flavor carries the
#   Play Billing + Google transport libs and is not what F-Droid builds.
# - Gradle task to build: `assembleFdroidRelease` (referenced below as `fdroid`).
# - OkHttp/Retrofit are scoped to `playImplementation` only and are not present
#   in the compiled fdroid APK.
# - Donation flow: BTC/XMR addresses are shown statically. There is no network
#   call from the fdroid build, so the in-app "supporter badge" cannot
#   auto-activate in the F-Droid build. This is intentional for now.
# - UpdateCheckMode is restricted to the 0.3.x tag line (`^v0\.3\.[0-9]+-alpha$`)
#   because GitHub already has newer tags (v0.4.0-alpha, v0.4.1-alpha) that are
#   iOS/Play-Store-focused and not yet verified for the fdroid flavor. Broaden
#   this pattern when a newer version is ready for F-Droid.
# - No Binaries field: our GitHub Actions release build does not currently
#   reproduce byte-for-byte against F-Droid's build environment (classes.dex/
#   baseline.prof differ, likely a JDK/AGP/R8 toolchain mismatch). F-Droid
#   builds and signs with their own key instead. Revisit reproducible builds
#   as separate follow-up work.
# - No AllowedAPKSigningKeys field: it only has effect paired with a Binaries
#   field (verifying a downloaded release APK's signature before comparing it
#   to the from-source build), so it was dropped as dead config alongside
#   Binaries — a reviewer suggestion removed it upstream in MR !43520.

