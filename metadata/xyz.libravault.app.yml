# F-Droid recipe for xyz.libravault.app
#
# This is a copy of fastlane/metadata/fdroid.yml, placed at the path
# convention used by gitlab.com/fdroid/fdroiddata (metadata/<applicationId>.yml).
# The source of truth is fastlane/metadata/fdroid.yml — keep the two in sync.
# When submitting the MR to fdroiddata, copy this file's content into
# metadata/xyz.libravault.app.yml in your fork (no header comment needed there).
#
# Maintainer notes for F-Droid reviewers:
# - The app ships a `fdroid` product flavor with a manifest overlay that
#   removes the INTERNET permission entirely. The play flavor carries the
#   Play Billing + Google transport libs and is not what F-Droid builds.
# - Gradle task to build: `assembleFdroidRelease` (referenced below as `fdroid`).
# - OkHttp/Retrofit are scoped to `playImplementation` only and are not present
#   in the compiled fdroid APK.
# - Donation flow: BTC/XMR addresses are shown statically. There is no network
#   call from the fdroid build, so the in-app "supporter badge" cannot
#   auto-activate in the F-Droid build. This is intentional for now.

Categories:
  - Reading
  - Multimedia

License: GPL-3.0-only

WebSite: https://libravault.xyz
SourceCode: https://github.com/LibraVault/reader
IssueTracker: https://github.com/LibraVault/reader/issues

AutoName: LibraVault
Summary: Privacy-first EPUB, PDF, and audiobook reader — no internet, no account

Description: |-
  LibraVault is a modern media reader for EPUB books, PDF documents, and audiobooks
  (MP3, M4B, OGG, FLAC, Opus, AAC). It requires no account, holds no internet
  permission, and uses Scoped Storage so it only ever sees the folders you choose.

  Features:
  * EPUB rendering via Readium Kotlin Toolkit (full EPUB 3 support)
  * PDF viewer via native AndroidX PdfRenderer
  * Audiobook playback with chapter navigation, variable speed (0.5x-3.0x), and
    sleep timer with per-chapter option and 10-second fade-out
  * Built-in TTS using Android system voices — no proprietary engine
  * Background playback with lock-screen and notification controls
  * Dark, light, and sepia reader themes; adjustable font size and line spacing
  * Library search by title, author, narrator, or series
  * Progress saved continuously; last position restored silently on next open
  * Optional local-only crash logger — never transmitted

  Permissions: FOREGROUND_SERVICE (background audio), POST_NOTIFICATIONS
  (media controls on Android 13+), and SAF URI grants for folders you choose.
  READ_EXTERNAL_STORAGE, INTERNET, CAMERA, CONTACTS, and LOCATION are never
  requested in the F-Droid build. BTC/XMR donation addresses are shown
  statically; no network calls are made.

RepoType: git
Repo: https://github.com/LibraVault/reader

Builds:
