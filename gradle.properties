org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=2
org.gradle.daemon.idletimeout=600000
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official
ksp.incremental=true
ksp.incremental.intermodule=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35

# Roborazzi screenshot baselines (docs/TEST_COVERAGE_PRD.md Phase 5).
# WITHOUT this, `captureRoboImage()` is a NO-OP in a normal test run: it neither
# records nor compares, so `./gradlew testDebugUnitTest` — which is exactly what
# jvm-tests.yml runs — passes even when the UI has visibly changed. Verified by
# mutating a theme colour and watching the suite stay green.
# Setting verify here makes comparison the default everywhere, locally and in
# CI. `recordRoborazziDebug` overrides it when baselines are updated on purpose.
roborazzi.test.verify=true
