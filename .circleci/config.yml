version: 2.1

# Fallback CI: mirrors .github/workflows/jvm-tests.yml's test set. Exists so
# we can still get a JVM-tests signal (and, if needed, trigger it manually)
# when GitHub Actions minutes are exhausted or concurrency-capped — both have
# happened, see the pipeline health-check routine. Not a full replacement for
# the GitHub Actions suite (no Android instrumentation/iOS builds here) —
# just the fast unit-test/lint path kept alive on a second provider.
#
# Gated behind a pipeline parameter (default false) rather than a plain
# `workflows:` block, which CircleCI runs on *every* push by default — we
# don't want to silently start double-billing every commit/PR before we've
# decided to actually rely on this as a standing fallback rather than a
# break-glass option. Trigger it explicitly with:
#   POST /api/v2/project/<slug>/pipeline  body: {"parameters":{"run_jvm_tests":true}}
# or via the dashboard's "Trigger Pipeline" button, setting run_jvm_tests=true.

parameters:
  run_jvm_tests:
    type: boolean
    default: false

jobs:
  jvm-tests:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    environment:
      JVM_OPTS: -Xmx3200m
    steps:
      - checkout

      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-cache-

      - run:
          name: Grant execute permission for gradlew
          command: chmod +x gradlew

      # Same task list as jvm-tests.yml's "Run JVM tests" step — see that
      # file's comment for why the flavor-specific tasks are named explicitly.
      - run:
          name: Run JVM tests
          command: |
            ./gradlew testDebugUnitTest \
              :feature:settings:testFdroidDebugUnitTest \
              :feature:settings:testPlayDebugUnitTest \
              :app:testFdroidDebugUnitTest \
              :app:testPlayDebugUnitTest \
              --continue

      - run:
          name: Run Lint
          command: ./gradlew lint

      - save_cache:
          key: gradle-cache-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_test_results:
          path: build/test-results

      - store_artifacts:
          path: build/reports/tests
          destination: jvm-test-results

      - store_artifacts:
          path: build/reports/lint-results-debug.html
          destination: lint-results

workflows:
  version: 2
  manual-jvm-tests:
    when: << pipeline.parameters.run_jvm_tests >>
    jobs:
      - jvm-tests
