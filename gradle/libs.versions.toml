[versions]
agp                 = "8.9.1"
kotlin              = "2.2.10"
ksp                 = "2.2.10-2.0.2"
compose-bom         = "2024.09.03"
hilt                = "2.58"
room                = "2.8.4"
media3              = "1.11.0"
coroutines          = "1.8.1"
navigation          = "2.7.7"
coil                = "2.6.0"
lifecycle           = "2.8.2"
core-ktx            = "1.13.1"
activity-compose    = "1.9.0"
serialization       = "1.7.0"
readium             = "3.0.0-beta.2" # Pre-release, pinned deliberately (see issue #531) — this is
                                    # the component that parses/renders untrusted EPUBs in a
                                    # WebView, the largest third-party attack surface in the app,
                                    # so it isn't bumped to "whatever beta happens to be latest".
                                    # GA (3.0.0) has since shipped upstream, with 3.1.1 the latest
                                    # as of 2026-08-24 — see issue #534 for the
                                    # deliberate bump, which needs its own scoped verification pass
                                    # (readium's own migration notes call out breaking API changes
                                    # between beta and GA) rather than riding along with this one.
markdown-renderer   = "0.32.0"
documentfile        = "1.0.1"
splashscreen        = "1.0.1"
material            = "1.12.0"
fragment            = "1.8.1"
junit               = "4.13.2"
androidx-test       = "1.6.1"       # androidx.test:runner — instrumentation tests
androidx-test-junit = "1.2.1"       # androidx.test.ext:junit — AndroidJUnit4 runner
junit5              = "5.10.2"
junit5-android      = "1.10.0.0"     # mannodermaus android-junit5 bridge
mockk               = "1.13.11"
turbine             = "1.1.0"
compose-test        = "1.6.7"
bouncycastle        = "1.84"
billing             = "9.1.0"      # Play Billing (core:billing, play flavour only — see core/billing/build.gradle.kts)
kover               = "0.9.1"      # JVM/Android line coverage — docs/TEST_COVERAGE_PRD.md Phase 1
roborazzi           = "1.43.1"     # JVM screenshot baselines — docs/TEST_COVERAGE_PRD.md Phase 5
kxml2               = "2.3.0"
webkit              = "1.17.0"
zxing               = "3.5.3"
pdfbox-android      = "2.0.27.0"    # feature:reader PDF text extraction (#591 Phase 3) — Apache PDFBox
                                    # ported to Android (Apache 2.0), fully on-device, no network.
desugar-jdk-libs    = "2.0.4"      # coreLibraryDesugaring — required by any module depending on Readium
datastore           = "1.0.0"      # androidx.datastore:datastore-preferences (core:cloudtts; matches core:tts's existing, still-hardcoded usage)
okhttp              = "4.12.0"     # core:cloudtts, play flavour only — vendor TTS HTTP adapters.
                                    # Pinned to the 4.x line deliberately, not the latest 5.x:
                                    # okhttp 5.x's okhttp-android artifact requires compileSdk 37,
                                    # which this project isn't on (compileSdk 36, AGP 8.9.1's own
                                    # recommended max) — found via a real build failure
                                    # (:feature:settings:checkPlayDebugUnitTestAarMetadata) once
                                    # core:cloudtts was first wired into a module the app actually
                                    # depends on. 4.12.0 also matches the OkHttp version Coil
                                    # already pulls in transitively (see KNOWN_LIMITATIONS.md),
                                    # so this doesn't add a second OkHttp version to the graph.

[libraries]
# AndroidX core
androidx-core-ktx               = { group = "androidx.core",            name = "core-ktx",                    version.ref = "core-ktx" }
androidx-lifecycle-runtime      = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel    = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# ProcessLifecycleOwner — used to auto-lock all open Encrypted Vaults the moment
# the whole app (not just one Activity) leaves the foreground (PRD §7: "default:
# immediately on backgrounding the app").
androidx-lifecycle-process      = { group = "androidx.lifecycle",        name = "lifecycle-process",           version.ref = "lifecycle" }
androidx-activity-compose       = { group = "androidx.activity",         name = "activity-compose",            version.ref = "activity-compose" }

# Compose
compose-bom                     = { group = "androidx.compose",          name = "compose-bom",                 version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",       name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3",name = "material3" }
compose-icons-extended          = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling              = { group = "androidx.compose.ui",       name = "ui-tooling" }

# Navigation
navigation-compose              = { group = "androidx.navigation",       name = "navigation-compose",          version.ref = "navigation" }

# Hilt
hilt-android                    = { group = "com.google.dagger",         name = "hilt-android",                version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger",         name = "hilt-android-compiler",       version.ref = "hilt" }
hilt-android-testing            = { group = "com.google.dagger",         name = "hilt-android-testing",        version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",             name = "hilt-navigation-compose",     version = "1.2.0" }

# Room
room-runtime                    = { group = "androidx.room",             name = "room-runtime",                version.ref = "room" }
room-ktx                        = { group = "androidx.room",             name = "room-ktx",                    version.ref = "room" }
room-compiler                   = { group = "androidx.room",             name = "room-compiler",               version.ref = "room" }

# Media3
media3-exoplayer                = { group = "androidx.media3",           name = "media3-exoplayer",            version.ref = "media3" }
media3-session                  = { group = "androidx.media3",           name = "media3-session",              version.ref = "media3" }
media3-ui                       = { group = "androidx.media3",           name = "media3-ui",                   version.ref = "media3" }
media3-inspector                = { group = "androidx.media3",           name = "media3-inspector",            version.ref = "media3" }
# DataSource/BaseDataSource only — a transitive dep of media3-exoplayer already, but core:vaultcontent
# needs just this slice without pulling in the full playback engine.
media3-datasource               = { group = "androidx.media3",           name = "media3-datasource",           version.ref = "media3" }

# Coroutines
coroutines-core                 = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-core",     version.ref = "coroutines" }
coroutines-android              = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",  version.ref = "coroutines" }

# DataStore
androidx-datastore-preferences  = { group = "androidx.datastore",        name = "datastore-preferences",       version.ref = "datastore" }

# OkHttp — core:cloudtts, play flavour only (vendor TTS HTTP adapters)
okhttp                          = { group = "com.squareup.okhttp3",      name = "okhttp",                      version.ref = "okhttp" }
# The 4.x-line MockWebServer artifact (package okhttp3.mockwebserver) — the
# 5.x "mockwebserver3" rename/package split doesn't apply at this version.
okhttp-mockwebserver            = { group = "com.squareup.okhttp3",      name = "mockwebserver",                version.ref = "okhttp" }

# Coil
coil-compose                    = { group = "io.coil-kt",                name = "coil-compose",                version.ref = "coil" }

# Serialization
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json",  version.ref = "serialization" }

# Readium (M2)
readium-shared                  = { group = "org.readium.kotlin-toolkit", name = "readium-shared",             version.ref = "readium" }
readium-streamer                = { group = "org.readium.kotlin-toolkit", name = "readium-streamer",           version.ref = "readium" }
readium-navigator               = { group = "org.readium.kotlin-toolkit", name = "readium-navigator",          version.ref = "readium" }
# Readium requires core library desugaring in every module that depends on it
# (AGP's checkDebugAndroidTestAarMetadata enforces this on the androidTest
# variant too, not just the main one) — feature/reader already enables this
# inline; this catalog entry exists so other Readium-consuming modules don't
# each hardcode their own copy of the version.
desugar-jdk-libs                = { group = "com.android.tools",          name = "desugar_jdk_libs",           version.ref = "desugar-jdk-libs" }

# Markdown rendering (Markdown viewer)
markdown-renderer-m3            = { group = "com.mikepenz",               name = "multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
androidx-documentfile           = { group = "androidx.documentfile",      name = "documentfile",                version.ref = "documentfile" }
# WebViewAssetLoader — serves the bundled Mermaid renderer (#121) to its own WebView
# from a local https://appassets.androidplatform.net virtual origin, never a real
# network request, without relying on raw file:// URLs (blocked/deprecated for WebView
# content loading on modern Android).
androidx-webkit                  = { group = "androidx.webkit",            name = "webkit",                      version.ref = "webkit" }
# PDF text extraction (#591 Phase 3) — offline, on-device only; see version comment above.
pdfbox-android                   = { group = "com.tom-roush",             name = "pdfbox-android",              version.ref = "pdfbox-android" }

# Core
androidx-splashscreen           = { group = "androidx.core",              name = "core-splashscreen",          version.ref = "splashscreen" }
androidx-fragment-ktx           = { group = "androidx.fragment",          name = "fragment-ktx",               version.ref = "fragment" }
material                        = { group = "com.google.android.material", name = "material",                  version.ref = "material" }

# Cryptography
bouncycastle-bcprov             = { group = "org.bouncycastle",           name = "bcprov-jdk18on",              version.ref = "bouncycastle" }

# Billing (play flavour only)
billing-ktx                     = { group = "com.android.billingclient",  name = "billing-ktx",                 version.ref = "billing" }

# Testing — JVM
junit                           = { group = "junit",                     name = "junit",                       version.ref = "junit" }
junit5-api                      = { group = "org.junit.jupiter",         name = "junit-jupiter-api",           version.ref = "junit5" }
junit5-engine                   = { group = "org.junit.jupiter",         name = "junit-jupiter-engine",        version.ref = "junit5" }
junit5-params                   = { group = "org.junit.jupiter",         name = "junit-jupiter-params",        version.ref = "junit5" }
# Runs JUnit4 tests (Compose test rules are JUnit4-only) alongside JUnit5 in modules
# using the android-junit5 plugin — see :feature:library / :feature:settings.
junit5-vintage-engine           = { group = "org.junit.vintage",         name = "junit-vintage-engine",        version.ref = "junit5" }
mockk                           = { group = "io.mockk",                  name = "mockk",                       version.ref = "mockk" }
coroutines-test                 = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",     version.ref = "coroutines" }
turbine                         = { group = "app.cash.turbine",          name = "turbine",                     version.ref = "turbine" }
robolectric                     = { group = "org.robolectric",           name = "robolectric",                 version = "4.12.2" }
# JVM-side org.xmlpull.v1 implementation — lets XmlPullParserFactory.newInstance()
# resolve on plain JVM unit tests (Android's real impl isn't on the JVM classpath;
# AGP's mockable android.jar stubs the framework classes but not this pure-Java one).
kxml2                            = { group = "net.sf.kxml",              name = "kxml2",                       version.ref = "kxml2" }

# Testing — instrumentation (on-device; JUnit 4, the only runner AndroidJUnit4 supports)
androidx-test-runner            = { group = "androidx.test",             name = "runner",                      version.ref = "androidx-test" }
androidx-test-ext-junit         = { group = "androidx.test.ext",         name = "junit",                       version.ref = "androidx-test-junit" }

# Testing — Compose UI (requires JUnit 4 runner — Google limitation)
compose-ui-test-junit4          = { group = "androidx.compose.ui",       name = "ui-test-junit4",              version.ref = "compose-test" }
compose-ui-test-manifest        = { group = "androidx.compose.ui",       name = "ui-test-manifest",            version.ref = "compose-test" }

# Testing — screenshot baselines. JVM/Robolectric, no emulator, so these run in
# the same jvm-tests.yml gate as everything else. Baselines live in
# <module>/src/test/screenshots/ and are covered by agent-policy.yml
# sensitive_paths: re-recording one makes a failing test pass while recording
# the break, the same silent failure mode as testdata/vault-format.
roborazzi                       = { group = "io.github.takahirom.roborazzi", name = "roborazzi",                version.ref = "roborazzi" }
roborazzi-compose               = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",        version.ref = "roborazzi" }
roborazzi-junit-rule            = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule",     version.ref = "roborazzi" }

[plugins]
android-application             = { id = "com.android.application",      version.ref = "agp" }
android-library                 = { id = "com.android.library",          version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler                = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                             = { id = "com.google.devtools.ksp",       version.ref = "ksp" }
hilt                            = { id = "com.google.dagger.hilt.android",version.ref = "hilt" }
android-junit5                  = { id = "de.mannodermaus.android-junit5", version.ref = "junit5-android" }
kover                           = { id = "org.jetbrains.kotlinx.kover",   version.ref = "kover" }
roborazzi                       = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

[bundles]
compose                         = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3", "compose-icons-extended"]
lifecycle                       = ["androidx-lifecycle-runtime", "androidx-lifecycle-viewmodel"]
room                            = ["room-runtime", "room-ktx"]
media3                          = ["media3-exoplayer", "media3-session", "media3-ui"]
testing-jvm                     = ["junit5-api", "junit5-params", "mockk", "coroutines-test", "turbine"]
testing-android                 = ["robolectric", "compose-ui-test-junit4"]
testing-instrumentation         = ["junit", "androidx-test-runner", "androidx-test-ext-junit"]
