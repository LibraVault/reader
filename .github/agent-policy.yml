# Risk policy for the dev/qa/principal-review agent pipeline.
# See docs/agent-team-pipeline.md for the full state machine this feeds.
#
# A PR is classified risk:high (and therefore always lands on
# status:needs-human-merge, never auto-merged) if any changed file matches
# one of the globs below, regardless of what QA or the principal review
# agent otherwise conclude. Everything else defaults to risk:low, but a
# CONFIRMED finding from the principal review agent blocks auto-merge
# outright either way.

version: 1

# Above this many changed lines, force risk:high even with no sensitive
# path match — large diffs deserve a human read regardless of subject.
max_auto_mergeable_diff_lines: 400

sensitive_paths:
  # CI/CD and release plumbing
  - ".github/workflows/**"
  - "fastlane/**"
  - "**/*.keystore"
  - "**/keystore.properties"
  - "**/*signing*"
  - "**/ExportOptions*.plist"

  # Encrypted vaults / crypto
  - "core/vaultcrypto/**"
  - "core/vaultstore/**"

  # Licensing / billing / payments
  - "core/licensing/**"
  - "**/BtcPayClient*"
  - "**/*Billing*"

  # Dependency + toolchain pinning (see feedback: no hardcoded versions)
  - "gradle/libs.versions.toml"
  - "build-logic/**"

  # Agent pipeline's own configuration — changes to the rules the agents
  # follow always need a human, otherwise an agent could loosen its own
  # constraints unsupervised.
  - ".github/agent-policy.yml"
  - ".claude/agents/**"

# Issues/PRs the dev agent should never attempt fully autonomously, even at
# triage time — it should stop at status:needs-info and ask instead.
sensitive_issue_labels:
  - "security"
  - "release-blocker"
