# Risk policy for the dev/qa/principal-review agent pipeline.
# See docs/agent-team-pipeline.md for the full state machine this feeds.
#
# A PR is classified risk:high (and therefore always lands on
# status:needs-human-merge, never auto-merged) if any changed file matches
# one of the globs below, regardless of what QA or the principal review
# agent otherwise conclude. Everything else defaults to risk:low, but a
# CONFIRMED finding from the principal review agent blocks auto-merge
# outright either way.

version: 1

# The authoritative implementation of this policy is
# .github/scripts/classify_pr_risk.py, run as a workflow step (not an LLM
# judgment call) every time the dev agent pushes to a PR. docs and agent
# personas describe the *intent* of these rules but should not restate the
# exact logic — read it from here and the script, not from prose elsewhere,
# to avoid the description drifting from what actually runs.

# Above this many changed lines, force risk:high even with no sensitive
# path match — large diffs deserve a human read regardless of subject.
# Counted as additions + deletions from `git diff --numstat` against the
# PR's merge-base with its target branch (i.e. what classify_pr_risk.py
# computes) — not net line delta, not GitHub's own "files changed" UI.
max_auto_mergeable_diff_lines: 400

sensitive_paths:
  # CI/CD and release plumbing
  - ".github/workflows/**"
  - "fastlane/**"
  - "**/*.keystore"
  - "**/keystore.properties"
  - "**/*signing*"
  - "**/ExportOptions*.plist"

  # Encrypted vaults / crypto
  - "core/vaultcrypto/**"
  - "core/vaultstore/**"
  - "ios/LibraVaultApp/LibraVault/LibraVault/Sources/VaultCrypto/**"
  - "ios/LibraVaultApp/LibraVault/LibraVault/ThirdParty/Argon2/**"
  - "ios/LibraVaultApp/LibraVault/LibraVault/Sources/VaultStore/**"

  # Frozen on-disk vault-format fixtures. These are the only thing proving
  # Android and iOS still agree on the wire format, and the failure mode is
  # silent: regenerating a fixture makes a failing interop test pass while
  # actually recording the break. A changed byte here means either a
  # deliberate format version bump or every existing vault just became
  # unreadable — never something to auto-merge. See testdata/vault-format/README.md.
  - "testdata/vault-format/**"

  # Screenshot baselines (docs/TEST_COVERAGE_PRD.md Phase 5). Exactly the same
  # failure mode as the vault fixtures above, which is why they are gated the
  # same way: re-recording a baseline makes a failing test pass WHILE RECORDING
  # THE BREAK. The fix for a red screenshot test is almost always the UI, not
  # the baseline, but `recordRoborazziDebug` is the easier keystroke — so an
  # agent that hits a diff must never be able to bless it unattended. A human
  # looks at the diff image under build/outputs/roborazzi first.
  - "**/src/test/screenshots/**"

  # Billing / payments (no core/licensing module anymore — no Pro tier
  # for now, donation-only; these globs are for the still-live donation flow)
  - "**/BtcPayClient*"
  - "**/*Billing*"

  # Dependency + toolchain pinning (see feedback: no hardcoded versions)
  - "gradle/libs.versions.toml"
  - "build-logic/**"

  # Agent pipeline's own configuration — changes to the rules the agents
  # follow always need a human, otherwise an agent could loosen its own
  # constraints unsupervised.
  - ".github/agent-policy.yml"
  - ".claude/agents/**"

# Issues/PRs the dev agent should never attempt fully autonomously, even at
# triage time — it should stop at status:needs-info and ask instead. These
# labels are NOT applied by the issue templates (GitHub issue-form YAML
# can't conditionally label based on a dropdown answer) — the dev agent
# must self-apply them from the issue content during triage, before it
# decides whether to proceed. See dev-agent.md's triage section.
sensitive_issue_labels:
  - "security"
  - "release-blocker"

# Retroactive authorization format for the sensitive_issue_labels gate
# above. A dev-agent triage pass (or a QA pass re-checking scope on a PR)
# that would otherwise stop/re-stop at status:needs-info because of
# `security`/`release-blocker` can treat that gate as satisfied — for the
# scope actually stated, not automatically for the whole issue — if it
# finds a comment on the issue or PR that:
#
#   - contains a line starting with exactly `AGENT-AUTHORIZE:` followed by
#     a description of the scope being authorized, e.g.
#     `AGENT-AUTHORIZE: iOS scope for this issue, matching the fix already
#     shipped for Android in PR #670.`
#   - was posted by a comment author whose `author_association` is
#     `OWNER`, `MEMBER`, or `COLLABORATOR` (same bar as the trust gate in
#     docs/agent-team-pipeline.md).
#
# The agent still has to judge whether the stated scope actually covers
# what it's about to implement/review — an authorization scoped to
# "Android only" does not extend to iOS work on the same issue. This does
# not change risk:high classification or the human-merge decision for
# anything on sensitive_paths above; it only stops a real, already-given
# authorization from being invisible to the next automated pass. See
# issue #675 for the gap this closes and #526/#550/#668/PR #670 for the
# live example that surfaced it. A human still needs to move the label
# that triggers the next pass (re-applying status:ready-for-dev or
# status:needs-qa) — this only fixes the agent bouncing the item straight
# back to status:needs-info once that pass runs.
sensitive_issue_labels_authorization_marker: "AGENT-AUTHORIZE:"

# A human (or an agent acting on explicit human instruction) has applied
# this to a specific issue or PR to stop the pipeline from touching it,
# independent of the repo-wide kill switch (the `AGENTS_PAUSED` repository
# variable — a label can't express "stop everything," only "stop this item,"
# so the two mechanisms are deliberately different). Every agent must
# treat it as "do not act on this" and leave it alone.
blocked_label: "status:blocked"
