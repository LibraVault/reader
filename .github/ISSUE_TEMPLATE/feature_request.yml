name: Feature request
description: Propose new behaviour or an improvement.
title: "[Feature] "
labels:
  - enhancement
  - "status:triage"
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The dev agent uses this to judge scope and whether it's safe to implement autonomously.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should the QA agent verify this is actually done? Be concrete — this becomes the QA agent's checklist.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Module / component
      options:
        - Android app
        - iOS app
        - core:tts (Read Aloud)
        - core:vaultcrypto / vaultstore (Encrypted Vaults)
        - core:licensing / billing
        - EPUB reader
        - PDF reader
        - Markdown viewer
        - CI / build / release
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Does this touch a sensitive area?
      description: Encryption, licensing/billing, CI/release, or signing. If unsure, say so — the agent will double-check against .github/agent-policy.yml anyway.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
