name: iOS Test Lab Spike (Firebase, real device)

# Spike, not a permanent CI gate: proves out whether Firebase Test Lab can run
# LibraVault's existing XCUITest target on a real Apple device, reusing infra
# already paid for/wired up elsewhere in this repo instead of a new vendor
# (AWS Device Farm / BrowserStack were also considered - see the conversation
# this came out of - but neither has a recurring free tier the way Test Lab's
# Blaze-plan daily quota does).
#
# Reuses, with no new secrets:
#   - libravault-xyz Firebase project (FIREBASE_SERVICE_ACCOUNT_JSON), already
#     used for Android Test Lab (android-tts-audio-test.yml) and App
#     Distribution. If this 403s, that service account needs the same
#     roles/cloudtestservice.testAdmin + roles/viewer grants Android's run
#     needed, just confirmed to also cover iOS Test Lab's API.
#   - the Apple signing assets ios-testflight.yml already uses
#     (APPLE_DISTRIBUTION_CERT_BASE64/PASSWORD, PROVISIONING_PROFILE_BASE64,
#     APPLE_TEAM_ID, APP_STORE_CONNECT_*).
#
# Per Firebase's docs (firebase.google.com/docs/test-lab/ios/run-xctest),
# Test Lab re-signs the app with its own certificate on its own devices, so
# the exact profile/cert used to build here doesn't need to match Test Lab's
# hardware - it only needs to be *valid* enough for xcodebuild to produce a
# build. The LibraVault app target is CODE_SIGN_STYLE=Manual with an existing
# App Store profile (project.pbxproj) and needs nothing new, but
# LibraVaultUITests/-Runner are CODE_SIGN_STYLE=Automatic and have never been
# built for a real device before - CI only ever built them for Simulator with
# CODE_SIGNING_ALLOWED=NO. -allowProvisioningUpdates plus the App Store
# Connect API key lets xcodebuild provision xyz.libravault.LibraVaultUITests
# headlessly instead of needing a third manually-crafted profile secret. This
# is the step most likely to be the spike's actual blocker - if it fails,
# that's the finding, not a bug to chase further here.

on:
  # TEMPORARY: push trigger scoped to this exact branch, so the spike can
  # actually run before this file exists on dev - workflow_dispatch isn't
  # dispatchable from a non-default branch until the workflow file is on the
  # default branch at least once. Removed before merge; see PR #153.
  push:
    branches:
      - feature/ios-test-lab-spike
  workflow_dispatch:
    inputs:
      device_model:
        description: "Test Lab physical iOS device model id - see this run's 'List available Test Lab iOS devices' step if the default is stale"
        required: false
        default: "iphone15pro"
      device_version:
        description: "iOS version for that device"
        required: false
        default: "17.5"

concurrency:
  group: ios-test-lab-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-lab-spike:
    name: Run LibraVaultUITestsLaunchTests on a real device
    runs-on: macos-26
    timeout-minutes: 45

    env:
      XCODEPROJ: ios/LibraVaultApp/LibraVault/LibraVault.xcodeproj
      SCHEME: LibraVault
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # The scheme's test targets link against the LibraVault app target,
      # which needs these even though this run never exercises TTS itself.
      - name: Cache Pocket TTS iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            third-party/sherpa-onnx/ios
            ios/LibraVaultApp/LibraVault/LibraVault/PocketTTSModel
          key: pocket-tts-ios-${{ hashFiles('third-party/sherpa-onnx/setup-ios.sh') }}

      - name: Fetch Pocket TTS iOS dependencies
        run: ./third-party/sherpa-onnx/setup-ios.sh

      # Same recipe as ios-testflight.yml's equivalent steps - covers the
      # LibraVault app target's Manual/"LibraVault" App Store profile.
      - name: Import Code Signing Certificate
        env:
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          echo "${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}" | base64 --decode > cert.p12

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign,xcodebuild -k "" build.keychain >/dev/null

          rm -f cert.p12

      - name: Import Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          rm -f profile.mobileprovision

      - name: Write App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "APP_STORE_CONNECT_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

      # generic/platform=iOS (a real-device SDK) is required - Test Lab does
      # not accept Simulator builds. -only-testing scopes the .xctestrun this
      # produces to the single Xcode-generated launch smoke test, not the
      # full LibraVaultUITests suite: this is a pipeline spike, not a full run.
      - name: Build for Testing (real device)
        run: |
          xcodebuild build-for-testing \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/testbuild" \
            -only-testing:LibraVaultUITestsLaunchTests \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      # Firebase's required zip layout: the Debug-iphoneos product directory
      # plus the .xctestrun file, both at the top level of the archive.
      - name: Package test bundle
        id: package
        run: |
          cd "$RUNNER_TEMP/testbuild/Build/Products"
          XCTESTRUN=$(find . -maxdepth 1 -name '*.xctestrun' | head -1)
          if [ -z "$XCTESTRUN" ]; then
            echo "::error::No .xctestrun file produced - build-for-testing likely failed silently"
            exit 1
          fi
          zip -r "$RUNNER_TEMP/LibraVaultUITests.zip" Debug-iphoneos "$XCTESTRUN"
          echo "path=$RUNNER_TEMP/LibraVaultUITests.zip" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 --decode > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_CLOUD_PROJECT=$(jq -r .project_id "$RUNNER_TEMP/gcp-sa.json")" >> "$GITHUB_ENV"

      # Informational - Test Lab retires iOS device models over time (see
      # android-tts-audio-test.yml's equivalent caveat for Android), so print
      # the live catalog every run to make a stale device_model input a
      # 30-second fix on the next dispatch instead of a guessing game.
      - name: List available Test Lab iOS devices
        run: gcloud firebase test ios models list || true

      - name: Run on Firebase Test Lab
        run: |
          gcloud firebase test ios run \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --test "${{ steps.package.outputs.path }}" \
            --device "model=${{ inputs.device_model }},version=${{ inputs.device_version }},locale=en_US,orientation=portrait" \
            --timeout 15m \
            --results-dir "ios-test-lab-spike-${{ github.run_id }}" \
            --format json

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gcp-sa.json"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
          security delete-keychain build.keychain || true
