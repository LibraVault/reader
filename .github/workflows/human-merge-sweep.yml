# Periodic sweep of docs/agent-team-pipeline.md's terminal
# `status:needs-human-merge` state — the one step in that pipeline that
# still needed a human to notice the backlog and manually ask Claude Code
# to review + merge it. This automates the *noticing*, not the judgment:
# see .claude/agents/human-merge-sweep-agent.md for the actual review
# logic; this file only wires the trigger and guardrails around it.
#
# Deliberately its OWN workflow, not a change to principal-review.yml:
# that workflow's job is the FIRST review, triggered by a specific PR
# event (status:needs-review being applied) with a $PR_NUMBER from that
# event to work with. This one has no triggering PR — it wakes up on a
# timer and has to go find its own work (the whole needs-human-merge
# backlog, plus a general staleness sweep), which is a different shape of
# job even though the review technique it uses is deliberately the same.
#
# Auth: plain GITHUB_TOKEN, not the pipeline App token. Merging and
# closing PRs — unlike *opening* one (see dev-agent.yml's own comment) —
# isn't blocked by this repo's "Allow GitHub Actions to create and approve
# pull requests" setting being off. principal-review.yml's own "Auto-merge
# if approved" step already proves GITHUB_TOKEN can merge; the same is
# true here, so there's no need for the extra App-token minting step.

name: Human-Merge Sweep

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: human-merge-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run human-merge sweep agent
        id: agent
        # Mirrors principal-review.yml's identical continue-on-error: a
        # crash here (exhausted turns, tool error) must not silently
        # discard the run with zero signal — the step below always
        # records an outcome regardless of how this one ends.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Not triggered by any PR/issue event (schedule/workflow_dispatch
          # only), so claude-code-action's non-human-actor guard never
          # applies here — no allowed_bots needed, unlike
          # principal-review.yml/qa-agent.yml.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Read .claude/agents/human-merge-sweep-agent.md in full — it is
            your complete operating persona for this run. There is no
            specific PR number to start from; find your own work per Part
            1 and Part 2 of that file.

            Do not use anything that depends on a completion notification
            arriving later — there is no such mechanism in this CI run:
            - No subagent delegation (the Agent tool, any
              "Explore"/"Task" subagent type).
            - No backgrounded Bash commands (run_in_background) that you
              then wait to be notified about.
            Run every command in the foreground and wait for its real
            output before continuing, even if reviewing a PR takes
            several minutes — that's normal here, not a problem to work
            around.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash"
            --max-turns 120

      - name: Report outcome
        if: always()
        run: |
          if [ "${{ steps.agent.outcome }}" = "failure" ]; then
            echo "### :warning: Human-merge sweep crashed or exhausted its turn budget" >> "$GITHUB_STEP_SUMMARY"
            echo "See the job log above for what it managed to do before that happened." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Human-merge sweep completed" >> "$GITHUB_STEP_SUMMARY"
            echo "See the job log above for the summary the agent printed at the end of its run." >> "$GITHUB_STEP_SUMMARY"
          fi
