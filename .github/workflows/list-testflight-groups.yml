name: List TestFlight Beta Groups (diagnostic)

# One-off, cheap diagnostic — no Xcode build, no IPA upload. Authenticates with
# the same App Store Connect API key ios-testflight.yml already uses. See
# project_testflight_external_group_intermittent_failure.md for why this
# exists and what it already caught (a build stuck at
# externalState=READY_FOR_BETA_SUBMISSION despite being in the right group —
# group membership and "actually live to external testers" are different
# states in Apple's model, and pilot's own upload-success log wording is
# cosmetic, not proof of anything). Run this before assuming a code fix is
# right, not after.

on:
  workflow_dispatch:
    inputs:
      focus_build_number:
        description: "Optional: a specific build number to inspect in extra detail (e.g. 40)"
        required: false
        type: string
      focus_tester_email:
        description: "Optional: a specific tester email to check invite/accept state for"
        required: false
        type: string
      compare_build_numbers:
        description: "Optional: comma-separated build numbers to dump full raw attributes for, side by side (e.g. 39,40,41)"
        required: false
        type: string

jobs:
  list-groups:
    name: List beta groups via App Store Connect API
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: List beta groups
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          FOCUS_BUILD_NUMBER: ${{ inputs.focus_build_number }}
          FOCUS_TESTER_EMAIL: ${{ inputs.focus_tester_email }}
          COMPARE_BUILD_NUMBERS: ${{ inputs.compare_build_numbers }}
        run: |
          echo "$PRIVATE_KEY" > AuthKey.p8

          ruby -rspaceship -e '
            token = Spaceship::ConnectAPI::Token.create(
              key_id: ENV["KEY_ID"],
              issuer_id: ENV["ISSUER_ID"],
              filepath: "AuthKey.p8",
            )
            Spaceship::ConnectAPI.token = token

            apps = Spaceship::ConnectAPI::App.all(filter: { bundleId: ENV["APPLE_BUNDLE_ID"] })
            raise "No app found for bundle id #{ENV["APPLE_BUNDLE_ID"]}" if apps.empty?
            app = apps.first
            puts "App: #{app.name} (id=#{app.id}, bundleId=#{app.bundle_id})"
            puts ""

            groups = app.get_beta_groups
            puts "Found #{groups.size} beta group(s):"
            groups.each do |g|
              puts "  name=#{g.name.inspect} id=#{g.id} isInternalGroup=#{g.is_internal_group} publicLinkEnabled=#{g.public_link_enabled} hasAccessToAllBuilds=#{g.has_access_to_all_builds.inspect}"
              builds = g.fetch_builds
              puts "    build numbers in this group (#{builds.size}): " + builds.map { |b| b.version }.join(", ")

              next if g.is_internal_group
              testers = Spaceship::ConnectAPI.get_beta_testers(filter: { betaGroups: g.id }).all_pages.flat_map(&:to_models)
              puts "    testers in this group (#{testers.size}):"
              testers.each do |t|
                puts "      email=#{t.email.inspect} state=#{t.beta_tester_state.inspect} inviteType=#{t.invite_type.inspect} id=#{t.id}"
              end
            end

            puts ""
            puts "Most recent builds on the app (regardless of group) -- notification status:"
            recent = Spaceship::ConnectAPI::Build.all(app_id: app.id, sort: "-uploadedDate", limit: 10)
            recent.each do |b|
              d = b.build_beta_detail
              puts "  build=#{b.version} processingState=#{b.processing_state} " \
                   "internalState=#{d&.internal_build_state} externalState=#{d&.external_build_state} " \
                   "autoNotifyEnabled=#{d&.auto_notify_enabled} didNotify=#{d&.did_notify.inspect} " \
                   "uploadedDate=#{b.uploaded_date}"
            end

            if ENV["FOCUS_BUILD_NUMBER"] && !ENV["FOCUS_BUILD_NUMBER"].empty?
              puts ""
              puts "=== Focused check: build #{ENV["FOCUS_BUILD_NUMBER"]} ==="
              focus_builds = Spaceship::ConnectAPI::Build.all(app_id: app.id, build_number: ENV["FOCUS_BUILD_NUMBER"], limit: 5)
              if focus_builds.empty?
                puts "No build found with that number."
              else
                b = focus_builds.first
                d = b.build_beta_detail
                puts "id=#{b.id} version=#{b.version} processingState=#{b.processing_state}"
                puts "internalState=#{d&.internal_build_state} externalState=#{d&.external_build_state}"
                puts "autoNotifyEnabled=#{d&.auto_notify_enabled.inspect} didNotify=#{d&.did_notify.inspect}"
                puts "expired=#{b.expired.inspect} expirationDate=#{b.expiration_date}"

                localizations = b.get_beta_build_localizations rescue []
                puts "beta build localizations (#{localizations.size}):"
                localizations.each { |l| puts "  locale=#{l.locale} whatsNew=#{l.whats_new.inspect}" }
              end
            end

            if ENV["COMPARE_BUILD_NUMBERS"] && !ENV["COMPARE_BUILD_NUMBERS"].empty?
              ENV["COMPARE_BUILD_NUMBERS"].split(",").map(&:strip).each do |num|
                puts ""
                puts "=== Full raw attributes: build #{num} ==="
                builds = Spaceship::ConnectAPI::Build.all(app_id: app.id, build_number: num, limit: 5, includes: "app,buildBetaDetail,preReleaseVersion,betaAppReviewSubmission,individualTesters")
                if builds.empty?
                  puts "No build found with that number."
                  next
                end
                b = builds.first
                d = b.build_beta_detail
                puts "id=#{b.id}"
                puts "version=#{b.version.inspect} processingState=#{b.processing_state.inspect}"
                puts "usesNonExemptEncryption=#{b.uses_non_exempt_encryption.inspect}"
                puts "minOsVersion=#{b.min_os_version.inspect} iconAssetToken=#{b.icon_asset_token.inspect}"
                puts "expired=#{b.expired.inspect} expirationDate=#{b.expiration_date.inspect} uploadedDate=#{b.uploaded_date.inspect}"
                puts "buildBetaDetail: autoNotifyEnabled=#{d&.auto_notify_enabled.inspect} didNotify=#{d&.did_notify.inspect} internalState=#{d&.internal_build_state.inspect} externalState=#{d&.external_build_state.inspect}"
                prv = b.pre_release_version
                puts "preReleaseVersion: id=#{prv&.id.inspect} version=#{prv&.version.inspect} platform=#{prv&.platform.inspect}"

                submission = b.beta_app_review_submission
                if submission.nil?
                  puts "betaAppReviewSubmission: (none associated on this Build object, fetching directly)"
                  begin
                    subs = Spaceship::ConnectAPI.get_beta_app_review_submissions(filter: { build: b.id }).all_pages.flat_map(&:to_models)
                    subs.each { |s| puts "  betaReviewState=#{s.beta_review_state.inspect} id=#{s.id}" }
                    puts "  (none found)" if subs.empty?
                  rescue => e
                    puts "  error fetching: #{e.message}"
                  end
                else
                  puts "betaAppReviewSubmission: betaReviewState=#{submission.beta_review_state.inspect}"
                end

                indiv = b.individual_testers
                puts "individualTesters=#{indiv.inspect}"

                locs = b.get_beta_build_localizations rescue []
                puts "betaBuildLocalizations (#{locs.size}):"
                locs.each { |l| puts "  locale=#{l.locale.inspect} whatsNew=#{l.whats_new.inspect}" }
              end
            end

            if ENV["FOCUS_TESTER_EMAIL"] && !ENV["FOCUS_TESTER_EMAIL"].empty?
              puts ""
              puts "=== Focused check: tester #{ENV["FOCUS_TESTER_EMAIL"]} ==="
              testers = Spaceship::ConnectAPI.get_beta_testers(filter: { email: ENV["FOCUS_TESTER_EMAIL"] }).all_pages.flat_map(&:to_models)
              if testers.empty?
                puts "No tester found with that email at all (not on the app in any group)."
              else
                testers.each do |t|
                  puts "email=#{t.email.inspect} state=#{t.beta_tester_state.inspect} inviteType=#{t.invite_type.inspect} isDeleted=#{t.is_deleted.inspect} id=#{t.id}"
                end
              end
            end
          '

          rm -f AuthKey.p8
