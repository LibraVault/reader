name: UI Tests (Emulator)

# Only runs on PRs targeting main — slower due to emulator boot (~15-20 min)
# Public repo = free GitHub Actions minutes, no cost.
on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    name: Compose UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Enable KVM for hardware acceleration on ubuntu-latest.
      # This is the key step that makes emulator tests viable on free runners —
      # without KVM, software rendering is ~5-10x slower and very flaky.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Compile androidTest source to verify the test compile target builds,
      # without spinning up an emulator (v1 has zero androidTest source files).
      - name: Compile Android test source (no emulator)
        run: ./gradlew compileDebugAndroidTest --continue

      - name: Upload Android test compile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-results
          path: "**/build/reports/"
          retention-days: 7
