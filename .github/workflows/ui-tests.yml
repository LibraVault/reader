name: UI Tests (Emulator)

# Emulator boot makes this the slowest signal we have (~15-20 min vs. 1-3 min
# for jvm-tests.yml), so it deliberately does NOT gate every merge. It used to
# trigger only on `pull_request: branches: [main]` — but `dev` is the default
# branch and every development PR targets it, so this workflow last ran on
# 2026-04-24 and produced no signal at all through the Markdown viewer,
# Encrypted Vaults and iOS parity work. See docs/TEST_COVERAGE_PRD.md §7 Q1.
#
# Four triggers now, in increasing order of how much they cost us:
#   schedule         — nightly on `dev` (the default branch, so no explicit ref
#                      needed). Catches instrumented drift within 24h without
#                      slowing the merge loop the agent pipeline depends on.
#   pull_request     — to `main`: always. That is the dev -> main release PR,
#                      where a 20-minute wait is cheap insurance.
#                    — to `dev`: only when labelled `needs-emulator`, for PRs
#                      that obviously touch instrumented surfaces.
#   workflow_dispatch— manual, for release prep or ad-hoc investigation.
#
# Public repo = free GitHub Actions minutes, so the nightly run costs nothing.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily, on the default branch (dev)
  pull_request:
    branches: [ "main", "dev" ]
    # `labeled` is needed so adding `needs-emulator` to an already-open PR
    # starts a run rather than waiting for the next push.
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    name: Compose UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Non-PR events (schedule, manual) always run. PRs to main always run.
    # PRs to dev run only when explicitly labelled — `github.base_ref` is set
    # for pull_request events only, which is why the first clause guards it.
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref == 'main' ||
      contains(github.event.pull_request.labels.*.name, 'needs-emulator')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Enable KVM for hardware acceleration on ubuntu-latest.
      # This is the key step that makes emulator tests viable on free runners —
      # without KVM, software rendering is ~5-10x slower and very flaky.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # What this actually exercises today is thin, and worth stating plainly
      # rather than letting "the emulator gate is back" imply more than it is:
      # the repo has exactly two androidTest sources — feature:reader's
      # ReadiumIntegrationTest, and core:tts's PocketTtsAudioOutputTest, which
      # self-skips here because the sherpa-onnx AAR is arm64-only (that one
      # needs android-tts-audio-test.yml on a Test Lab physical device). So a
      # nightly run is currently one real test. Closing that gap is Phase 4 of
      # docs/TEST_COVERAGE_PRD.md; restoring the trigger first means the tests
      # written there have somewhere to run.
      #
      # `connectedDebugAndroidTest` is a task NAME, not a path, and carries the
      # same silent-skip trap that jvm-tests.yml documents at length for
      # `testDebugUnitTest`: modules with flavorDimensions (:app,
      # :feature:settings) have only connected{Fdroid,Play}DebugAndroidTest and
      # are skipped here with no error and no log line. Latent rather than
      # active — neither flavored module ships androidTest sources today — but
      # if one ever does, add its flavor-specific task here explicitly.
      #
      # Explicit module list, NOT the blanket task name (found 08-26 on the
      # CircleCI mirror of this job — see its own comment for the full
      # story): running `connectedDebugAndroidTest` unscoped fans out across
      # every module in the build on one shared emulator, most with zero
      # androidTest sources, and that cumulative churn reproducibly hung the
      # CircleCI job on its last module. Also now three real androidTest
      # sources, not two (core:vaultstore's joined feature:reader's and
      # core:tts's since this comment above was last accurate).
      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34          # Android 14 — good balance of coverage vs stability
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6G
          heap-size: 512M
          script: ./gradlew :core:tts:connectedDebugAndroidTest :core:vaultstore:connectedDebugAndroidTest :feature:reader:connectedDebugAndroidTest --continue

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: "**/build/reports/androidTests/"
          retention-days: 7
