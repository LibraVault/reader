name: iOS Build & Test

on:
  push:
    branches: [ feat/v3-ios-port, feature/ios-* ]
    paths:
      - 'ios/**'
      - 'core/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ feat/v3-ios-port ]
    paths:
      - 'ios/**'
      - 'core/**'

jobs:
  kmp-build-ios:
    name: KMP Framework Build (iOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build KMP framework for iOS
        run: |
          cd reader
          ./gradlew :core:domain:assembleIosArm64MainKlibrary \
                    :core:domain:assembleIosSimulatorArm64MainKlibrary \
                    :core:domain:assembleIosX64MainKlibrary \
                    :core:tts:assembleIosArm64MainKlibrary \
                    :core:tts:assembleIosSimulatorArm64MainKlibrary \
                    :core:tts:assembleIosX64MainKlibrary \
                    :core:logger:assembleIosArm64MainKlibrary \
                    :core:logger:assembleIosSimulatorArm64MainKlibrary \
                    :core:logger:assembleIosX64MainKlibrary \
                    -x test
        working-directory: /home/rob/git/LibraVault

      - name: Upload KMP artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: kmp-frameworks-ios
          path: |
            reader/core/domain/build/classes/kotlin/ios/main/
            reader/core/tts/build/classes/kotlin/ios/main/
            reader/core/logger/build/classes/kotlin/ios/main/
          retention-days: 5

  swift-build:
    name: Swift Package Build
    runs-on: macos-14
    needs: kmp-build-ios
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Build Swift Package
        run: |
          cd ios/LibraVault
          swift build

  swift-test:
    name: Swift Unit Tests
    runs-on: macos-14
    needs: swift-build
    steps:
      - uses: actions/checkout@v4

      - name: Run Swift tests
        run: |
          cd ios/LibraVault
          swift test 2>&1 | tee test-results.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: swift-test-results
          path: ios/LibraVault/test-results.txt

  summary:
    name: iOS Build Status Summary
    runs-on: ubuntu-latest
    needs: [ kmp-build-ios, swift-build, swift-test ]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- KMP Framework Build: ${{ needs.kmp-build-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Swift Build: ${{ needs.swift-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Swift Tests: ${{ needs.swift-test.result }}" >> $GITHUB_STEP_SUMMARY
