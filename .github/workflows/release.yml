name: Release Build

# Triggers when a version tag is pushed: git tag v0.1.0-alpha && git push --tags
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode the base64-encoded keystore and write keystore.properties so the
      # existing signing config in app/build.gradle.kts picks them up directly.
      # To encode: base64 -w0 libravault-release.keystore → paste into RELEASE_KEYSTORE secret
      - name: Set up signing
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode \
            > app/libravault-release.keystore
          printf 'storeFile=libravault-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleFdroidRelease

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/fdroid/release/*.apk
          generate_release_notes: true

      # Clean up signing material — never leave keys on the runner
      - name: Clean up signing
        if: always()
        run: |
          rm -f app/libravault-release.keystore
          rm -f keystore.properties
