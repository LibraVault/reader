name: iOS Architecture & Privacy Checks

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-checks.yml'

jobs:
  dependency-denylist:
    name: Dependency Denylist Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Package.swift for denied dependencies
        run: |
          set +e  # Don't fail on grep non-match
          DENIED_PATTERNS=(
            "firebase"
            "sentry"
            "bugsnag"
            "instabug"
            "amplitude"
            "mixpanel"
            "segment"
            "heap"
            "google-sign-in"
            "facebook.*sdk"
            "telemetry"
            "tracking"
            "crashlytics"
            "analytics"
            "ml-kit"
            "branch"
            "adjust"
            "appsflyer"
          )

          FOUND_DENIED=0
          for pattern in "${DENIED_PATTERNS[@]}"; do
            if grep -i "$pattern" ios/Package.swift ios/Podfile 2>/dev/null; then
              echo "❌ Denied dependency pattern found: $pattern"
              FOUND_DENIED=1
            fi
          done

          if [ $FOUND_DENIED -eq 1 ]; then
            echo ""
            echo "Denied dependencies violate the privacy-first posture (§4.9 of iOS v3.0 PRD)."
            echo "See docs/v3-ios-roadmap.md for context."
            exit 1
          fi

          echo "✅ No denied dependencies found in ios/Package.swift or ios/Podfile"

  privacy-configuration:
    name: Privacy Configuration Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify NSURLIsExcludedFromBackupKey (database)
        run: |
          if ! grep -r "NSURLIsExcludedFromBackupKey" ios/LibraVault/Persistence/ 2>/dev/null | grep -q "library.db"; then
            echo "⚠️  Warning: NSURLIsExcludedFromBackupKey not found for library.db"
            echo "    (§4.10 requires this to exclude the database from iCloud backup)"
          else
            echo "✅ Database excluded from iCloud backup"
          fi

      - name: Verify no iCloud / Keychain usage
        run: |
          ICLOUD_PATTERNS=(
            "NSUbiquitousKeyValueStore"
            "NSUbiquitousContainerIdentifier"
            "CloudKit"
            "CKContainer"
            "CKRecord"
            "iCloud"
          )

          KEYCHAIN_PATTERNS=(
            "SecItemAdd"
            "SecItemCopyMatching"
            "kSecClass"
            "kSecAttr"
            "kSecValue"
          )

          FOUND_ICLOUD=0
          for pattern in "${ICLOUD_PATTERNS[@]}"; do
            if grep -r "$pattern" ios/LibraVault/ 2>/dev/null | grep -v "Tests" | grep -v ".xcarchive"; then
              echo "❌ iCloud API usage found: $pattern"
              echo "   Project constraint (§4.10): no iCloud, no Keychain"
              FOUND_ICLOUD=1
            fi
          done

          FOUND_KEYCHAIN=0
          for pattern in "${KEYCHAIN_PATTERNS[@]}"; do
            if grep -r "$pattern" ios/LibraVault/ 2>/dev/null | grep -v "Tests" | grep -v ".xcarchive"; then
              echo "❌ Keychain API usage found: $pattern"
              echo "   Project constraint (§4.10): no iCloud, no Keychain"
              FOUND_KEYCHAIN=1
            fi
          done

          if [ $FOUND_ICLOUD -eq 1 ] || [ $FOUND_KEYCHAIN -eq 1 ]; then
            exit 1
          fi

          echo "✅ No iCloud or Keychain usage detected"

      - name: Verify security-scoped bookmarks storage
        run: |
          if grep -r "bookmarkData" ios/LibraVault/ 2>/dev/null | grep -q "App.*Support.*libravault.*bookmarks"; then
            echo "✅ Bookmarks stored in app sandbox (not Keychain)"
          else
            echo "⚠️  Verify BookmarkStore implementation uses app-sandbox plist (§4.10, B6)"
          fi

      - name: Check CFBundleDocumentTypes registration
        run: |
          if [ -f "ios/LibraVault/Info.plist" ]; then
            # Verify only EPUB and PDF are registered, not audio
            if grep -q "public.epub" ios/LibraVault/Info.plist && \
               grep -q "com.adobe.pdf" ios/LibraVault/Info.plist; then
              echo "✅ Document types correctly registered (EPUB + PDF only)"
            else
              echo "⚠️  Verify CFBundleDocumentTypes in Info.plist (§4.11, C8)"
            fi
          fi

  architecture-decisions:
    name: Architecture Decision Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify KMP database boundary
        run: |
          echo "Checking KMP module structure..."
          if [ ! -d "core/database/src/commonMain" ]; then
            echo "⚠️  core/database/src/commonMain not found"
            echo "    Phase A5 should create this for KMP database conversion"
          else
            echo "✅ KMP database structure in place"
          fi

      - name: Verify UIDocumentPickerViewController usage (not direct file access)
        run: |
          if grep -r "NSDocumentDirectory\|enumerator.*\/\|FileManager.*atPath.*\"\/\"" ios/LibraVault/ 2>/dev/null | grep -v Tests | grep -v ".xcarchive"; then
            echo "❌ Direct file system scanning detected (§4.1)"
            echo "    Use UIDocumentPickerViewController + security-scoped bookmarks instead"
            exit 1
          fi

          if grep -r "UIDocumentPickerViewController.*forOpeningContentTypes" ios/LibraVault/ 2>/dev/null | grep -q "folder"; then
            echo "✅ UIDocumentPickerViewController used for folder selection"
          else
            echo "⚠️  Verify UIDocumentPickerViewController implementation (§4.1, C1)"
          fi

      - name: Verify Readium-swift pinned version
        run: |
          if [ -f "ios/Package.swift" ]; then
            if grep "ReadiumSwift\|r2-shared\|r2-streamer" ios/Package.swift 2>/dev/null | grep -q "exact\|from:.*\..*\..*"; then
              echo "✅ Readium-swift version pinned"
            else
              echo "⚠️  Verify Readium-swift version is pinned in Package.swift (§2 & B1)"
            fi
          fi

  logging-audit:
    name: Logging Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify local-only logging
        run: |
          if [ -f "ios/LibraVault/Platform/IosLogger.swift" ]; then
            if grep -q "Library/Application Support.*libravault.log\|NSSearchPathForDirectoriesInDomains" ios/LibraVault/Platform/IosLogger.swift; then
              echo "✅ Local-only logging configured"
            else
              echo "⚠️  Verify IosLogger writes to local sandbox (§4.6 & C30)"
            fi
          fi

          # Ensure no remote logging
          if grep -r "URLSession\|HTTP\|network\|remote.*log" ios/LibraVault/Platform/IosLogger.swift 2>/dev/null | grep -v "//" | grep -v "Test"; then
            echo "❌ Remote logging detected in IosLogger"
            exit 1
          fi

          echo "✅ Logging appears local-only"

summary:
  if: always()
  name: Architecture Compliance Summary
  runs-on: ubuntu-latest
  needs: [dependency-denylist, privacy-configuration, architecture-decisions, logging-audit]
  steps:
    - name: Report status
      run: |
        if [ "${{ needs.dependency-denylist.result }}" == "failure" ] || \
           [ "${{ needs.privacy-configuration.result }}" == "failure" ] || \
           [ "${{ needs.architecture-decisions.result }}" == "failure" ] || \
           [ "${{ needs.logging-audit.result }}" == "failure" ]; then
          echo "❌ Architecture compliance check failed"
          exit 1
        fi
        echo "✅ All architecture & privacy constraints verified"
