name: QA Agent

# Phase 2 of docs/agent-team-pipeline.md. Verifies a PR the dev agent
# marked status:needs-qa against its originating issue's acceptance
# criteria and runs the real test suites (see .claude/agents/qa-agent.md
# for the actual verification logic — this workflow only wires triggers,
# guardrails, and label transitions around it).
#
# Runs on ubuntu-latest, so it can run JVM/Android suites directly; iOS
# XCTest verification (when relevant) relies on the persona reading the
# repo's own ios-app-build.yml CI results via `gh pr checks` rather than
# re-running the suite here — a macOS runner for every QA pass wasn't
# judged worth the added cost/complexity for this phase.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to QA (manual test trigger)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  # count_active_agent_runs.sh (Phase 4 concurrency cap) calls
  # `gh run list`, which needs this — without it every trigger fails at
  # the guard step with a 403, not just a soft cap miss.
  actions: read

concurrency:
  group: qa-agent-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  verify:
    # No author_association check on the PR here, deliberately — every PR
    # in this pipeline is opened by the dev agent via GITHUB_TOKEN, whose
    # author_association is not "COLLABORATOR", so that check would make
    # this trigger never fire for any pipeline-produced PR. Trust rests on
    # GitHub's own enforcement of who can add a label (requires
    # triage/write access) plus the same-repo check below. See the
    # matching comment in dev-agent.yml.
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'status:needs-qa' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target and check for status:blocked
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          ISSUE_NUMBER=$(.github/scripts/resolve_linked_issue.sh "$PR_NUMBER")
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Could not resolve the originating issue from PR #$PR_NUMBER's body (expects e.g. 'Closes #N' on its own line) — stopping, same as dev-agent.yml does for this condition." >&2
            gh pr comment "$PR_NUMBER" --body "Could not find a \`Closes #N\`-style line in this PR's body — QA can't tell which issue to check acceptance criteria against. Add one (on its own line, e.g. \`Closes #123\`) and re-apply the label."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          if echo ",$PR_LABELS," | grep -q ",status:blocked,"; then
            echo "PR #$PR_NUMBER carries status:blocked — a human parked this, skipping." >&2
            gh pr comment "$PR_NUMBER" --body "This PR carries \`status:blocked\` — a human parked this, skipping this QA run. Remove the label to resume."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null) || {
            echo "Could not read issue #$ISSUE_NUMBER (deleted/transferred/inaccessible?) — treating as unblocked." >&2
            ISSUE_LABELS=""
          }
          if echo ",$ISSUE_LABELS," | grep -q ",status:blocked,"; then
            echo "Issue #$ISSUE_NUMBER carries status:blocked — a human parked this, skipping." >&2
            gh pr comment "$PR_NUMBER" --body "The linked issue (#$ISSUE_NUMBER) carries \`status:blocked\` — a human parked this, skipping this QA run. Remove the label from the issue to resume."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Global concurrency cap (Phase 4 guardrail) — see the matching
          # comment in dev-agent.yml for why this is separate from the
          # per-item concurrency group above.
          read -r ACTIVE MAX <<< "$(.github/scripts/count_active_agent_runs.sh "${{ github.run_id }}" "${{ vars.MAX_CONCURRENT_AGENT_RUNS }}")"
          if [ "$ACTIVE" -ge "$MAX" ]; then
            echo "At capacity ($ACTIVE/$MAX active pipeline runs) — skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --body "Pipeline is at capacity ($ACTIVE/$MAX active runs) — skipping this QA run. Re-apply status:needs-qa once activity settles, or re-trigger manually via workflow_dispatch."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out PR branch
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `git reset --hard HEAD` after the checkout: see the matching
        # comment in principal-review.yml (issue #386) — `gh pr checkout`
        # was observed leaving unrelated files' working-tree content
        # mismatched against HEAD despite reporting a clean switch. Here
        # that's worse than a wrong diagnostic: the QA agent runs the real
        # test suite against these working-tree files, so a stale tree
        # means QA could pass/fail against the wrong code. Force it instead
        # of assuming it.
        run: |
          gh pr checkout "${{ steps.guard.outputs.pr_number }}"
          git reset --hard HEAD

      - name: Check for workflow-file drift (GitHub OIDC self-check)
        # GitHub refuses to mint the OIDC token claude-code-action needs
        # (this job requests id-token: write) when a pull_request-triggered
        # workflow's own file on the PR branch doesn't byte-match the copy
        # on the base branch — its own anti-tampering check, to stop a PR
        # from modifying the very workflow that's about to run with that
        # trust. "Run QA agent" below still reports success when this
        # happens (the token exchange fails inside the action, not the
        # step), so without this check the run silently does nothing and
        # falls through to the generic "produced neither a verdict file nor
        # a verdict comment line" message below — misleading, since QA
        # never actually ran. See issue #254 for the full diagnosis (a live
        # hit on PR #234, 14 commits behind dev, this exact file among the
        # 7 that had diverged).
        #
        # classify_workflow_drift.sh (issue #401) further distinguishes
        # *why* the file differs: "stale" (dev moved the file on since this
        # branch's merge-base — rebasing fixes it, the ordinary case) from
        # "self" (this PR's own commits modify the file directly — no
        # rebase can ever fix that, since the diff to the file IS the
        # point of the PR). "Advance PR" below routes those two cases
        # differently.
        id: workflow-drift
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch origin dev
          CLASS=$(.github/scripts/classify_workflow_drift.sh .github/workflows/qa-agent.yml origin/dev)
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          if [ "$CLASS" = "none" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "This workflow's own file (.github/workflows/qa-agent.yml) differs between this PR branch and dev ($CLASS) — the OIDC token exchange below would be refused. Skipping the agent step." >&2
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record run start time
        # Timestamp boundary for the comment-verdict fallback below — lets
        # "Advance PR" tell this run's own PR comment apart from a stale one
        # left over from an earlier QA round on the same PR.
        if: steps.guard.outputs.skip != 'true'
        id: run-start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run QA agent
        if: steps.guard.outputs.skip != 'true' && steps.workflow-drift.outputs.drift != 'true'
        id: agent
        # Without this, a hard crash (max-turns exhausted, tool error) skips
        # every step below by GitHub Actions' default job-status semantics —
        # the PR is left stuck on status:needs-qa forever with no comment
        # and no human signal. Mirrors dev-agent.yml's identical fix for the
        # same failure mode (see that workflow's "Force-classify risk and
        # advance to QA" step comment) — "Advance PR" below checks
        # steps.agent.outcome to react to it instead of silently continuing.
        continue-on-error: true
        env:
          # Safe default token: this step only comments and reports a
          # verdict to a file. The labels that need to cross into
          # principal-review.yml or back into dev-agent.yml are applied by
          # a separate step below, with the App token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action refuses to run at all when triggered by a
          # non-human actor by default (its own anti-recursion guard) —
          # confirmed live: "Workflow initiated by non-human actor:
          # libravault-pipeline-bot (type: Bot)." Every trigger for this
          # workflow IS the pipeline App applying status:needs-qa, so
          # without this it could never run at all. Scoped to our own bot
          # by name, not '*', per the action's own security guidance.
          allowed_bots: libravault-pipeline-bot
          # This — not the GH_TOKEN env var above — is what actually
          # controls the identity claude-code-action uses for git/gh
          # operations: with claude_code_oauth_token set, it defaults to
          # Claude's own claude[bot] App regardless of GH_TOKEN. Forced to
          # GITHUB_TOKEN explicitly for consistency with dev-agent.yml
          # (see that file's matching comment for why).
          # Defaults to false, hiding the agent's turn-by-turn transcript.
          # Turned on for consistency with dev-agent.yml, where it was
          # used to diagnose a real live failure: an agent spawning an
          # async Explore subagent via the Agent tool (not in
          # --allowedTools, available anyway — a documented Claude Agent
          # SDK gap, anthropics/claude-agent-sdk-typescript#189), then
          # waiting for a notification that never comes in a CI run. See
          # the explicit prohibition in the prompt below.
          show_full_output: true
          prompt: |
            Read .claude/agents/qa-agent.md in full — it is your complete
            operating persona for this run. Verify PR #${{ steps.guard.outputs.pr_number }}
            in this repository against its originating issue
            #${{ steps.guard.outputs.issue_number }} (use `gh pr view` and
            `gh issue view` to read them; the PR branch is already checked
            out in the working directory).

            Do not apply any labels yourself and don't try to track which
            QA round this is — the workflow determines the retry count
            deterministically from label history and applies whichever
            label matches your verdict.

            Do not use anything that depends on a completion notification
            arriving later — there is no such mechanism in this CI run, so
            it never arrives and no verdict ever gets produced:
            - No subagent delegation (the Agent tool, any "Explore"/"Task"
              subagent type).
            - No backgrounded Bash commands (run_in_background) that you
              then wait to be notified about — including the test suite,
              which is exactly this persona's core job. Run every command,
              including `./gradlew testDebugUnitTest`, in the foreground
              and wait for its real output before continuing, even if it
              takes several minutes; that's normal and expected here, not
              a problem to work around.
            Investigate everything yourself, directly, with your own
            Read/Grep/Glob/Bash calls in this same turn sequence, waiting
            synchronously for each one's actual result before moving on.

            The persona's "Reporting is mandatory" section is not
            optional framing — read it first and budget your turns to it
            before you start investigating. This workflow step has its own
            hard --max-turns 70 below; if you exhaust it without having
            posted the PR comment and written qa-verdict.txt, the PR is
            left with no usable signal at all, which is worse than a fast,
            low-confidence FAIL.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash,WebSearch"
            --max-turns 70

      - name: Mint pipeline App token
        # !cancelled(): must still run even if "Run QA agent" failed/crashed
        # (see that step's continue-on-error comment) — "Advance PR" needs
        # this token either way, to route a crash to status:needs-info just
        # as much as a real pass/fail verdict.
        if: steps.guard.outputs.skip != 'true' && !cancelled()
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Advance PR based on QA verdict
        if: steps.guard.outputs.skip != 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed for status:needs-review (crosses into principal-review.yml)
          # and status:in-progress (crosses into dev-agent.yml's
          # pull_request:labeled listener) — see
          # docs/agent-team-pipeline.md's "Cross-workflow triggering".
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # steps.guard.outputs.* are only trustworthy if the guard step
          # actually completed. If it crashed instead (e.g. a transient
          # `gh` API error hitting set -e before writing any output), this
          # step's own `if` above (`skip != 'true'`) can't tell that apart
          # from a real skip=false — steps.guard.outputs.pr_number/skip
          # just read as empty either way. Handle the crash first, using
          # raw event context rather than guard's own (possibly-unwritten)
          # outputs. See issue #231.
          if [ "${{ steps.guard.outcome }}" = "failure" ]; then
            PR_NUMBER="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
            echo "Guard step crashed while resolving PR #$PR_NUMBER — routing to status:needs-info instead of silently falling through to the no-verdict default." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:needs-qa || true
            GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-info
            gh pr comment "$PR_NUMBER" --body "The guard step (resolving the linked issue, checking status:blocked) crashed before it could finish — see the [workflow run]($RUN_URL). Routed to a human instead of silently advancing this PR or falling through to a default verdict."
            exit 0
          fi

          PR_NUMBER="${{ steps.guard.outputs.pr_number }}"

          # Workflow-file drift (see the "Check for workflow-file drift"
          # step above) — the agent step was skipped outright, so there's
          # no verdict of any kind to look for. Same reasoning as the crash
          # branch above: this is a pipeline/tooling failure, not a QA
          # finding, so route to a human without burning dev-agent's
          # automated retry budget.
          if [ "${{ steps.workflow-drift.outputs.drift }}" = "true" ]; then
            echo "PR #$PR_NUMBER's branch has workflow-file drift from dev — GitHub's OIDC anti-tampering check would have silently no-opped the QA agent step, so it was skipped instead. Routing to a human." >&2

            if [ "${{ steps.workflow-drift.outputs.class }}" = "self" ]; then
              # Issue #401: this PR's own diff touches
              # .github/workflows/qa-agent.yml directly, so the drift will
              # reproduce identically on every retry no matter how current
              # the branch is — "rebase and re-add status:needs-qa" is a
              # dead end, not a fix. This file is already a sensitive_path
              # (risk:high, always status:needs-human-merge eventually), so
              # skip the automated QA stage entirely and route straight
              # there instead of cycling through status:needs-info first.
              gh pr edit "$PR_NUMBER" --remove-label status:needs-qa || true
              GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-human-merge
              gh pr comment "$PR_NUMBER" --body "This PR's own diff modifies \`.github/workflows/qa-agent.yml\` — the exact workflow file this QA run is. GitHub Actions refuses to mint the OIDC token \`claude-code-action\` needs when a \`pull_request\`-triggered, \`id-token: write\` workflow's own file doesn't byte-match the base branch (its own anti-tampering check), so the QA agent step was skipped. Unlike ordinary branch staleness, **rebasing \`dev\` in will never fix this** — the PR's own diff to this file is the point of the PR, so it can never byte-match \`dev\`'s copy no matter how current the branch is (see issue #401). Routing straight to \`status:needs-human-merge\` — this needs direct human review, not another automated retry."
              exit 0
            fi

            gh pr edit "$PR_NUMBER" --remove-label status:needs-qa || true
            GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-info
            gh pr comment "$PR_NUMBER" --body "This PR's branch is stale relative to \`dev\` — specifically, \`.github/workflows/qa-agent.yml\` differs between this branch and \`dev\`. GitHub Actions refuses to mint the OIDC token \`claude-code-action\` needs when a \`pull_request\`-triggered, \`id-token: write\` workflow's own file doesn't byte-match the base branch (its own anti-tampering check), so the QA agent step was skipped rather than silently no-opping (see issue #254 for the full diagnosis). Rebase/merge \`dev\` into this branch and re-add \`status:needs-qa\` to retry."
            exit 0
          fi

          # Look for a real verdict FIRST, before consulting the agent
          # step's own exit status. A "failure" outcome (max-turns
          # exhausted, tool error) doesn't mean the agent produced nothing —
          # PR #355 (2026-08-20) hit exactly this: the agent posted a full,
          # reasoned "QA verdict: FAIL" comment, then ran out of its turn
          # budget completing step 7 (writing qa-verdict.txt) as its very
          # last action, which flipped the step to failure and used to
          # cause this workflow to discard the verdict it had already
          # posted and report a generic crash instead. Checking outcome
          # first threw away real signal; checking for a verdict first
          # doesn't lose anything — a true blank-slate crash still has
          # neither signal below and falls through to the crash branch.

          # Primary signal: qa-verdict.txt, written as the agent's mandated
          # last action.
          FILE_VERDICT=""
          if [ -f qa-verdict.txt ]; then
            FILE_VERDICT=$(tr -d '[:space:]' < qa-verdict.txt | tr '[:upper:]' '[:lower:]')
            rm -f qa-verdict.txt
            if [ "$FILE_VERDICT" != "pass" ] && [ "$FILE_VERDICT" != "fail" ]; then
              echo "qa-verdict.txt contained an unrecognized value ('$FILE_VERDICT') — ignoring it." >&2
              FILE_VERDICT=""
            fi
          else
            echo "Agent didn't write qa-verdict.txt." >&2
          fi

          # Fallback signal: the persona is also required to end its PR
          # comment with an exact "QA verdict: PASS"/"QA verdict: FAIL"
          # line. A real run of this pipeline (PR #186, 2026-08-15) hit
          # exactly the gap this covers — the agent step completed cleanly
          # (no crash, so the check above didn't fire) but wrote neither the
          # file nor a comment, and the workflow silently defaulted to
          # "fail" with no way to tell that apart from a genuine finding.
          # Restricted to comments posted after this run started, so a
          # match here is never a stale verdict left over from an earlier
          # QA round on the same PR (which already advanced the PR out of
          # status:needs-qa once).
          COMMENT_VERDICT=""
          if [ -z "$FILE_VERDICT" ]; then
            RECENT_COMMENTS=$(gh pr view "$PR_NUMBER" --json comments \
              -q "[.comments[] | select(.createdAt > \"${{ steps.run-start.outputs.started_at }}\") | .body] | join(\"\n\")")
            if echo "$RECENT_COMMENTS" | grep -qE '^QA verdict: PASS[[:space:]]*$'; then
              COMMENT_VERDICT="pass"
            elif echo "$RECENT_COMMENTS" | grep -qE '^QA verdict: FAIL[[:space:]]*$'; then
              COMMENT_VERDICT="fail"
            fi
            if [ -n "$COMMENT_VERDICT" ]; then
              echo "qa-verdict.txt was missing, but this run's PR comment ended with an explicit verdict line — using that: $COMMENT_VERDICT" >&2
            fi
          fi

          VERDICT="${FILE_VERDICT:-$COMMENT_VERDICT}"

          # Neither signal present: the agent's run reported nothing at
          # all. This is an agent malfunction, not a QA finding, so it
          # doesn't burn the automated dev-agent retry or get labeled as
          # an ordinary QA failure — but the message differs depending on
          # whether the step itself also crashed (max-turns exhausted,
          # tool error) or exited cleanly with just nothing to show for it.
          if [ -z "$VERDICT" ]; then
            if [ "${{ steps.agent.outcome }}" = "failure" ]; then
              echo "QA agent run crashed for PR #$PR_NUMBER before producing any verdict — routing to status:needs-info instead of a scored verdict." >&2
              gh pr edit "$PR_NUMBER" --remove-label status:needs-qa || true
              GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-info
              gh pr comment "$PR_NUMBER" --body "qa-agent's run crashed or exhausted its turn budget (see the [workflow run]($RUN_URL)) before reaching a verdict — routed to a human instead of silently leaving this on status:needs-qa or spending the automated dev-agent retry on a run that found nothing. Needs a human to either re-run QA (re-add \`status:needs-qa\`) or review this PR directly."
            else
              echo "QA agent produced neither a verdict file nor a verdict comment line — treating as an agent malfunction, not a QA finding." >&2
              gh pr edit "$PR_NUMBER" --remove-label status:needs-qa || true
              GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-info
              gh pr comment "$PR_NUMBER" --body "qa-agent's run completed (see the [workflow run]($RUN_URL)) without producing a verdict — no \`qa-verdict.txt\` and no \"QA verdict: PASS/FAIL\" line in any comment it posted. This is an agent-level failure, not a real QA finding, so it isn't being sent through the automated dev-agent retry — nothing was actually found to fix. Needs a human to either re-run QA (re-add \`status:needs-qa\`) or review this PR directly."
            fi
            exit 0
          fi

          # A verdict was found even though the step itself exited
          # failure — the agent produced its result, then ran out of turn
          # budget doing cleanup (or hit some other tool error) afterward.
          # Use the real verdict rather than discarding it, but leave a
          # visible note so a human skimming the workflow run's red X isn't
          # misled into thinking nothing came out of it.
          if [ "${{ steps.agent.outcome }}" = "failure" ]; then
            echo "QA agent step exited failure after already producing a verdict — using the verdict instead of discarding it as a crash." >&2
            gh pr comment "$PR_NUMBER" --body "Note: the QA agent's run technically exited with a failure status (see the [workflow run]($RUN_URL)) — most likely it exhausted its turn budget right after posting the verdict below — but a complete verdict was already posted before that happened, so it's being used as a real QA result rather than discarded as a crash."
          fi

          echo "QA verdict for #$PR_NUMBER: $VERDICT"

          gh pr edit "$PR_NUMBER" --remove-label status:needs-qa || true

          if [ "$VERDICT" = "pass" ]; then
            GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-review
          else
            # Deterministic retry cap: look for a marker comment that only
            # this exact branch ever posts, rather than (a) trusting the
            # agent to count its own past comments — fragile, a human
            # echoing a "QA verdict:" line would throw off an LLM's count —
            # or (b) paginating the PR's entire issue timeline to count
            # status:in-progress label events, which conflates ANY reason
            # that label was ever applied with an actual QA-triggered
            # retry, and costs a full timeline fetch just to answer a
            # yes/no question. A single non-paginated comment list, filtered
            # for a marker this code alone writes, has neither problem.
            MARKER="<!-- qa-agent:retry-used -->"
            PRIOR_RETRY=$(gh pr view "$PR_NUMBER" --json comments \
              -q "[.comments[].body | select(contains(\"$MARKER\"))] | length")
            echo "Prior QA-triggered retries for #$PR_NUMBER: $PRIOR_RETRY"
            if [ "$PRIOR_RETRY" -eq 0 ]; then
              GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:in-progress
              gh pr comment "$PR_NUMBER" --body "$MARKER QA failed its first round — routing back to the dev agent for one automated retry."
            else
              gh pr edit "$PR_NUMBER" --add-label status:needs-info
              gh pr comment "$PR_NUMBER" --body "QA failed for the 2nd time — automated retry budget (1 auto-retry) exhausted, routing to a human instead of trying a 3rd time. See the QA verdict comment(s) above for what's still failing."
            fi
          fi
