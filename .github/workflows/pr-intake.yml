name: PR Intake

# Deterministic backstop for PRs opened OUTSIDE the automated pipeline —
# e.g. a human or a Claude Code session pushing a fix directly with a
# personal PAT, rather than dev-agent.yml's own triage-and-implement job
# opening it. That job's tail step (risk classification + applying
# status:needs-qa via the pipeline App token, see docs/agent-team-pipeline.md's
# "Cross-workflow triggering" section) only ever runs for PRs IT itself
# opens, synchronously, in the same job run. A PR opened any other way
# carries no risk:*/status:* label at all and nothing downstream ever
# picks it up — confirmed live: issue #223's actual fix, PR #224, was
# opened by a session outside the pipeline and sat unlabeled until a
# human noticed and hand-applied the labels this workflow now applies
# automatically.
#
# This workflow does NOT run an agent. It's the exact same deterministic
# classify-and-label logic dev-agent.yml's tail already runs for its own
# PRs, applied here for PRs it didn't open — see that workflow's last
# step for the twin of the step below.
#
# A PR opened this way doesn't always link an issue via a `Closes #N`-style
# line either (confirmed live: PRs #326, #335, #342 — self-authored feature
# work with no filed issue to link to). That's not grounds to skip labeling
# either — it degrades to "treat it like any other manually-opened PR,"
# still risk-classified and still routed into the pipeline, just at
# `status:needs-review` instead of `status:needs-qa`: qa-agent.yml hard-stops
# when it can't resolve a linked issue (nothing to check acceptance criteria
# against), so handing it status:needs-qa would just dead-end there with a
# comment asking for a `Closes #N` line that, for a genuinely issue-less PR,
# can never be satisfied. principal-review.yml already tolerates a missing
# linked issue gracefully (see its own guard step's comment), which is why
# that's the right landing spot instead.
#
# The `sweep-missing-status` job below covers a distinct, later-in-time gap
# (issue #403): a PR can pick up a `risk:*` label (dev-agent.yml's own tail
# step, or the `intake` job above) and then still end up with no `status:*`
# label at all — e.g. dev-agent.yml's risk-classify call succeeds under
# `GITHUB_TOKEN` but the very next call, handing off `status:needs-qa` under
# the App token, fails separately (confirmed live: PR #339, App-token expiry
# on a long-running triage job). `intake` above can't catch this: it only
# fires on `pull_request: opened`/`reopened`, and a PR that already existed
# when the status label went missing gets no further event to re-trigger it
# on. `sweep-missing-status` runs on a schedule instead, re-scanning every
# open PR for exactly this "risk present, status absent" combination — same
# deterministic classify-and-label shape as `intake`, just triggered
# differently.
#
# `sweep-missing-risk` (same schedule trigger) is the mirror image (issue
# #388): a PR can end up with a `status:*` label but no `risk:*` label at
# all, via a different crash-recovery path than the one above — a manual/
# human-merge-sweep-agent "near-miss" recovery (turn-budget wrapper firing
# after the dev agent's run actually succeeded) that hand-relabels straight
# to `status:needs-qa`/`status:needs-review` without ever invoking
# `classify_pr_risk.py`, the same way `dev-agent.yml`'s own success-path
# tail step would have. Confirmed live: PR #374, which sat through its
# entire QA and principal-review cycle with no risk label at all until a
# human noticed during principal review and re-ran the classifier by hand.
# `sweep-missing-risk` re-scans every open PR for the opposite combination
# ("status present, risk absent") and runs the same classifier against it —
# no status-label decision to make here, unlike `sweep-missing-status`,
# since the PR already carries whatever status label routed it into the
# pipeline; this just backfills the risk classification it should already
# have.

on:
  pull_request:
    types: [opened, reopened]
  schedule:
    # Offset 15 minutes from human-merge-sweep.yml's own `0 */4 * * *` so
    # the two scheduled jobs don't cluster on the same tick.
    - cron: '15 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: pr-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  intake:
    # Same public-repo trust boundary as dev-agent.yml's own pull_request
    # trigger: `pull_request: opened` fires for fork PRs from anyone with
    # zero permission required, so this requires same-repo.
    #
    # Excludes PRs the pipeline app itself opened (login confirmed live
    # via the API: PR #221's author.login is
    # "libravault-pipeline-bot[bot]") — those are already labeled by
    # dev-agent.yml's own tail before this event's job would even start;
    # re-running here would be redundant at best, and a real race at
    # worst (this job doesn't wait for that job to finish).
    #
    # Explicit event_name check (rather than relying on
    # github.event.pull_request.* simply being empty on a schedule/
    # workflow_dispatch run) so it's unambiguous this job only ever
    # reacts to a real pull_request event — sweep-missing-status below is
    # the only job those other two trigger.
    if: >-
      github.event_name == 'pull_request' &&
      vars.AGENTS_PAUSED != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'libravault-pipeline-bot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this PR needs intake
        id: guard
        env:
          # Read-only lookups only — nothing here needs to trigger a
          # further workflow run.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # No early exit when this comes back empty — see the top-of-file
          # comment. issue_number is still exported (possibly empty) so
          # the classify step below knows which label to hand off to.
          ISSUE_NUMBER=$(.github/scripts/resolve_linked_issue.sh "$PR_NUMBER")
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "PR #$PR_NUMBER doesn't link an issue (no 'Closes #N' etc in its body) — proceeding anyway as a manually-opened, issue-less PR (see top-of-file comment)." >&2
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          # Idempotency / re-entry guard: `reopened` can fire on a PR this
          # workflow (or a human) already labeled once. Any existing
          # pipeline status label means intake already happened (or a
          # human/qa/review round has since moved it on) — don't relabel
          # over that state. Applies whether or not an issue is linked.
          PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          if echo ",$PR_LABELS," | grep -qE ",status:(needs-qa|needs-review|needs-info|needs-human-merge|blocked|in-progress),"; then
            echo "PR #$PR_NUMBER already carries a pipeline status label ($PR_LABELS) — already picked up, nothing to do." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nothing to check here without a linked issue — an issue-less
          # PR has no status:blocked source to read besides the PR itself,
          # already covered by the idempotency guard above.
          if [ -n "$ISSUE_NUMBER" ]; then
            # Guarded rather than left to fail under set -e, same rationale
            # as dev-agent.yml's own guard: a deleted/transferred issue
            # shouldn't hard-crash this step, just proceed as unblocked.
            ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null) || {
              echo "Could not read issue #$ISSUE_NUMBER (deleted/transferred/inaccessible?) — treating as unblocked." >&2
              ISSUE_LABELS=""
            }
            if echo ",$ISSUE_LABELS," | grep -q ",status:blocked,"; then
              echo "Issue #$ISSUE_NUMBER carries status:blocked — a human parked this, skipping." >&2
              gh pr comment "$PR_NUMBER" --body "The linked issue (#$ISSUE_NUMBER) carries \`status:blocked\` — a human parked this, skipping automated intake for this PR. Remove the label from the issue to resume."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Mint pipeline App token
        if: steps.guard.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Classify risk and hand off to qa-agent or principal-review
        if: steps.guard.outputs.skip != 'true'
        env:
          # risk:* labels stay on GITHUB_TOKEN — nothing in this pipeline
          # triggers on a risk:* label event, so there's no cross-workflow
          # need here (mirrors dev-agent.yml's own risk-classification
          # step). Only status:needs-qa/status:needs-review, further down,
          # need the App token — see docs/agent-team-pipeline.md's
          # "Cross-workflow triggering" section for why.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          ISSUE_NUMBER="${{ steps.guard.outputs.issue_number }}"

          git fetch origin "$BASE_REF" "$HEAD_REF"

          pip install --quiet pyyaml
          python3 .github/scripts/classify_pr_risk.py \
            "origin/$BASE_REF" "origin/$HEAD_REF" --apply-label "$PR_NUMBER"

          if [ -n "$ISSUE_NUMBER" ]; then
            GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-qa
            echo "Applied status:needs-qa to #$PR_NUMBER."
            gh pr comment "$PR_NUMBER" --body "This PR was opened outside the automated pipeline (author isn't \`libravault-pipeline-bot[bot]\`), so \`dev-agent.yml\`'s own end-of-run classification step never ran for it — it would otherwise have sat with no risk/status label and nothing downstream would pick it up (see issue #223's actual history). This deterministic backstop (\`pr-intake.yml\`) classified its risk and applied \`status:needs-qa\` to route it into the normal pipeline from here."
          else
            # No linked issue to check acceptance criteria against, so
            # qa-agent.yml is the wrong landing spot — its own guard hard-
            # stops on exactly this condition (see top-of-file comment).
            # Land on status:needs-review instead, which principal-review.yml
            # already handles gracefully with no linked issue.
            GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-review
            echo "Applied status:needs-review to #$PR_NUMBER."
            gh pr comment "$PR_NUMBER" --body "This PR was opened outside the automated pipeline (author isn't \`libravault-pipeline-bot[bot]\`) and doesn't link an issue (no \`Closes #N\`-style line in its body), so there's no acceptance criteria for \`qa-agent.yml\` to verify against — it would otherwise sit with no risk/status label and nothing downstream would pick it up (see issue #223's actual history, and issue #343 for this issue-less case specifically). This deterministic backstop (\`pr-intake.yml\`) classified its risk and applied \`status:needs-review\` to route it straight to principal review."
          fi

  sweep-missing-status:
    # See the top-of-file comment for why this is a separate, schedule-
    # triggered job rather than something `intake` above also happens to
    # catch: `intake` only reacts to a `pull_request` event on a single PR,
    # so it can't find a PR that already existed when it silently lost its
    # status label. This job re-scans every open PR instead.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint pipeline App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Find and label PRs carrying risk:* but no status:* label
        env:
          # Same split as `intake` above: read-only lookups and the
          # explanatory comment stay on GITHUB_TOKEN; only the
          # status:needs-qa/status:needs-review handoff itself needs the
          # App token, since that's the one action that must trigger
          # qa-agent.yml/principal-review.yml (see docs/agent-team-pipeline.md's
          # "Cross-workflow triggering" section).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          ALL_PRS=$(gh pr list --state open --json number,labels --limit 200)
          MATCHES=$(echo "$ALL_PRS" | jq -c '
            [.[] | select(
              (.labels | map(.name) | any(startswith("risk:"))) and
              (.labels | map(.name) | any(startswith("status:")) | not)
            ) | .number]
          ')
          COUNT=$(echo "$MATCHES" | jq 'length')
          echo "Found $COUNT open PR(s) carrying risk:* but no status:* label."

          if [ "$COUNT" -eq 0 ]; then
            exit 0
          fi

          # Same "flag the volume, don't silently truncate" cap as
          # human-merge-sweep-agent.md uses for its own per-part queries —
          # this many PRs missing a status label is unusual and worth a
          # human glance on its own, not something to churn through
          # unattended.
          if [ "$COUNT" -gt 15 ]; then
            echo "::warning::$COUNT PRs are missing a status:* label despite carrying risk:* — capping this run at the first 15. That volume itself is unusual and worth a human look."
          fi

          process_pr() {
            local PR_NUMBER="$1"
            echo "Processing PR #$PR_NUMBER..."

            local ISSUE_NUMBER
            ISSUE_NUMBER=$(.github/scripts/resolve_linked_issue.sh "$PR_NUMBER") || {
              echo "resolve_linked_issue.sh could not resolve a single linked issue for #$PR_NUMBER (none found, or ambiguous) — treating as issue-less for routing purposes." >&2
              ISSUE_NUMBER=""
            }

            if [ -n "$ISSUE_NUMBER" ]; then
              # Same blocked-issue guard as `intake`'s own guard step above —
              # a human parked the linked issue, so leave this PR alone too.
              local ISSUE_LABELS
              ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null) || {
                echo "Could not read issue #$ISSUE_NUMBER (deleted/transferred/inaccessible?) — treating as unblocked." >&2
                ISSUE_LABELS=""
              }
              if echo ",$ISSUE_LABELS," | grep -q ",status:blocked,"; then
                echo "Issue #$ISSUE_NUMBER (linked from PR #$PR_NUMBER) carries status:blocked — skipping, not labeling." >&2
                gh pr comment "$PR_NUMBER" --body "This PR carries a \`risk:*\` label but no \`status:*\` label at all — a scheduled sweep (\`pr-intake.yml\`'s \`sweep-missing-status\` job, see issue #403) found it, but its linked issue (#$ISSUE_NUMBER) carries \`status:blocked\`, so it's left unlabeled until that's cleared."
                return 0
              fi
            fi

            if [ -n "$ISSUE_NUMBER" ]; then
              GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-qa
              echo "Applied status:needs-qa to #$PR_NUMBER (links issue #$ISSUE_NUMBER)."
              gh pr comment "$PR_NUMBER" --body "This PR carried a \`risk:*\` label but no \`status:*\` label at all — nothing in the pipeline was driving it forward (see issue #403 for how this can happen, e.g. a crashed handoff step after risk classification already succeeded). A scheduled sweep (\`pr-intake.yml\`'s \`sweep-missing-status\` job) found it and applied \`status:needs-qa\`, since it links issue #$ISSUE_NUMBER."
            else
              GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-review
              echo "Applied status:needs-review to #$PR_NUMBER (no linked issue resolved)."
              gh pr comment "$PR_NUMBER" --body "This PR carried a \`risk:*\` label but no \`status:*\` label at all — nothing in the pipeline was driving it forward (see issue #403 for how this can happen). A scheduled sweep (\`pr-intake.yml\`'s \`sweep-missing-status\` job) found it and applied \`status:needs-review\` (no linked issue found, or the link was ambiguous)."
            fi
          }

          # Each PR is handled in its own subshell so one flaky `gh` call
          # (rate limit, transient 5xx) can't abort the whole batch under
          # this script's `set -e` — it just gets flagged, and the next
          # scheduled run picks it back up (it'll still match the filter
          # above, since it's still missing a status:* label).
          echo "$MATCHES" | jq -r '.[:15][]' | while IFS= read -r PR_NUMBER; do
            ( process_pr "$PR_NUMBER" ) || echo "::warning::Failed to process PR #$PR_NUMBER this round — will retry on the next scheduled run." >&2
          done

  sweep-missing-risk:
    # Mirror image of `sweep-missing-status` above (issue #388, see the
    # top-of-file comment) — finds PRs carrying a status:* label but no
    # risk:* label at all, and backfills the classification. No App token
    # needed anywhere in this job: unlike a status:* handoff, applying a
    # risk:* label doesn't need to trigger any other workflow (nothing in
    # this pipeline triggers on a risk:* label event — see
    # docs/agent-team-pipeline.md's "Risk classification" section), so the
    # default GITHUB_TOKEN is sufficient for the `gh pr edit` the classifier
    # script itself runs.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and label PRs carrying status:* but no risk:* label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pip install --quiet pyyaml

          ALL_PRS=$(gh pr list --state open --json number,labels,baseRefName,headRefName --limit 200)
          # Excludes PRs carrying status:blocked, the same hard stop every
          # other entry point in this pipeline (intake's own guard step
          # above, dev-agent.yml, qa-agent.yml, principal-review.yml) applies
          # before acting on a PR. Unlike sweep-missing-status's filter
          # ("risk:* present, status:* absent entirely"), this job's filter
          # is "any status:* present, risk:* absent" — and status:blocked is
          # itself a status:* label, so without this exclusion a PR a human
          # parked specifically on status:blocked would still match and get
          # relabeled/commented on here.
          MATCHES=$(echo "$ALL_PRS" | jq -c '
            [.[] | select(
              (.labels | map(.name) | any(startswith("status:"))) and
              (.labels | map(.name) | any(startswith("risk:")) | not) and
              (.labels | map(.name) | any(. == "status:blocked") | not)
            )]
          ')
          COUNT=$(echo "$MATCHES" | jq 'length')
          echo "Found $COUNT open PR(s) carrying status:* but no risk:* label (excluding status:blocked)."

          if [ "$COUNT" -eq 0 ]; then
            exit 0
          fi

          # Same "flag the volume, don't silently truncate" cap as
          # `sweep-missing-status` above and human-merge-sweep-agent.md's
          # own per-part queries.
          if [ "$COUNT" -gt 15 ]; then
            echo "::warning::$COUNT PRs are missing a risk:* label despite carrying status:* — capping this run at the first 15. That volume itself is unusual and worth a human look."
          fi

          process_pr() {
            local PR_NUMBER="$1"
            local BASE_REF="$2"
            local HEAD_REF="$3"
            echo "Processing PR #$PR_NUMBER (base=$BASE_REF, head=$HEAD_REF)..."

            git fetch origin "$BASE_REF" "$HEAD_REF"
            python3 .github/scripts/classify_pr_risk.py \
              "origin/$BASE_REF" "origin/$HEAD_REF" --apply-label "$PR_NUMBER"

            gh pr comment "$PR_NUMBER" --body "This PR carried a \`status:*\` label but no \`risk:*\` label at all — it likely reached its current stage via a manual/near-miss recovery that skipped \`classify_pr_risk.py\` instead of dev-agent.yml's own success-path tail step running it (see issue #388 for the confirmed-live case, PR #374). A scheduled sweep (\`pr-intake.yml\`'s \`sweep-missing-risk\` job) found it and ran the classifier against the current diff to backfill the missing label."
          }

          # Each PR is handled in its own subshell so one flaky `gh`/`git`
          # call (rate limit, transient 5xx) can't abort the whole batch
          # under this script's `set -e` — it just gets flagged, and the
          # next scheduled run picks it back up (it'll still match the
          # filter above, since it's still missing a risk:* label).
          echo "$MATCHES" | jq -r '.[:15][] | "\(.number)\t\(.baseRefName)\t\(.headRefName)"' | while IFS=$'\t' read -r PR_NUMBER BASE_REF HEAD_REF; do
            ( process_pr "$PR_NUMBER" "$BASE_REF" "$HEAD_REF" ) || echo "::warning::Failed to process PR #$PR_NUMBER this round — will retry on the next scheduled run." >&2
          done
