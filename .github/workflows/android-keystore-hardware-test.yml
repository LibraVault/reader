name: Keystore Hardware-Backed Test (Firebase Test Lab)

# Runs AndroidKeystoreHardwareKeyWrapHardwareBackedTest — the two cases that
# need `create()` to actually land on real StrongBox/TEE hardware (issue
# #283, follow-up to #253/PR #279):
#   1. create() succeeds and isHardwareBacked == true.
#   2. create() replaces an existing key under the same alias.
#
# Why this needs its own workflow rather than joining ui-tests.yml:
# ui-tests.yml's `google_apis` x86_64 emulator always reports
# SECURITY_LEVEL_SOFTWARE (probe result, issue #253 comment), so create()'s
# hardware-only happy path is unreachable there — AndroidKeystoreHardwareKeyWrapTest
# deliberately avoids calling create() for exactly this reason. Real signal
# needs a real device, which on free infrastructure means a Firebase Test
# Lab physical device, same as android-tts-audio-test.yml.
#
# Manual dispatch only: physical-device runs draw on the project's Test Lab
# quota, so this is for release prep and for any change that touches
# AndroidKeystoreHardwareKeyWrap or its Keystore usage — not for every push.

on:
  workflow_dispatch:
    inputs:
      # Must be a PHYSICAL device: Test Lab's virtual devices are x86/x86_64
      # and would just report SECURITY_LEVEL_SOFTWARE like the emulator does.
      # Test Lab retires models over time, so re-check with
      #   gcloud firebase test android models list
      # if a run reports an unknown model. Any arm64-v8a phone at API >= 31
      # (the project's minSdk) works — StrongBox is a bonus, not a requirement,
      # since AndroidKeystoreHardwareKeyWrap.create() accepts a TEE-backed key too.
      device_model:
        description: "Test Lab physical device model id (must be arm64, API >= 31)"
        required: false
        # Pixel 8a — arm64-v8a, API 34, and critically DEVICE_CAPACITY=High.
        # See android-tts-audio-test.yml's own note on this default for why a
        # Low-capacity model can queue indefinitely on the free tier; check
        #   gcloud firebase test android list-device-capacities
        # before switching this.
        default: "akita"
      device_version:
        description: "Android API level for that device"
        required: false
        default: "34"

concurrency:
  group: keystore-hardware-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hardware-test:
    name: Keystore hardware-backed key wrap (arm64 device)
    runs-on: ubuntu-latest
    # 45 not 30, matching android-tts-audio-test.yml: the APK build is a
    # couple minutes but free-tier physical-device queueing is unbounded and
    # is charged to this wall clock.
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # In-project results bucket — see android-tts-audio-test.yml's
      # --results-bucket note for why gcloud's default bucket cannot work here.
      RESULTS_BUCKET: libravault-test-lab-results

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # core:vaultstore is a library module, so this is the only APK produced:
      # it is self-instrumenting (targetPackage == its own package).
      - name: Assemble instrumentation test APK
        run: ./gradlew :core:vaultstore:assembleDebugAndroidTest

      - name: Locate test APK
        id: apk
        run: |
          APK=$(find core/vaultstore/build/outputs/apk/androidTest -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No androidTest APK was produced"
            exit 1
          fi
          echo "Built $APK ($(du -h "$APK" | cut -f1))"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # Reuses the service account already wired up for App Distribution /
      # android-tts-audio-test.yml. It additionally needs
      # roles/cloudtestservice.testAdmin and roles/viewer on the project, plus
      # the Cloud Testing and Cloud Tool Results APIs enabled — grant those
      # once if this step 403s.
      - name: Authenticate to Google Cloud
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 --decode > "$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_CLOUD_PROJECT=$(jq -r .project_id "$RUNNER_TEMP/gcp-sa.json")" >> "$GITHUB_ENV"

      # --app and --test are both required by gcloud, and for a
      # self-instrumenting library test APK they are the same file.
      - name: Run on Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --app "${{ steps.apk.outputs.path }}" \
            --test "${{ steps.apk.outputs.path }}" \
            --device "model=${{ inputs.device_model }},version=${{ inputs.device_version }},locale=en,orientation=portrait" \
            --test-targets "class xyz.libravault.core.vaultstore.AndroidKeystoreHardwareKeyWrapHardwareBackedTest" \
            --timeout 15m \
            --results-bucket "$RESULTS_BUCKET" \
            --results-dir "keystore-hardware-${{ github.run_id }}" \
            --format json

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json"

      - name: Upload test APK for local reproduction
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keystore-hardware-test-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
