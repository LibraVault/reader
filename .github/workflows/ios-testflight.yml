name: iOS TestFlight Build & Upload

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (default: auto-increment)'
        required: false
        type: string
      release_notes:
        description: 'What to test — shown to TestFlight testers on this build. Required: the previous auto-generated notes were permanently stale Phase B/D boilerplate and never matched what actually shipped.'
        required: true
        type: string

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    # Apple's build-processing time before pilot can distribute to a group is
    # highly variable — observed well over 2 hours on build 30 (2026-08-11),
    # vs. the usual 15-30 min. 120 min was cutting it close once the "Upload
    # to TestFlight" step below started waiting on that instead of returning
    # immediately (see the comment on that step for why it waits now).
    timeout-minutes: 240
    outputs:
      build_number: ${{ steps.build-number.outputs.value }}

    env:
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      XCODEPROJ: ios/LibraVaultApp/LibraVault/LibraVault.xcodeproj
      SCHEME: LibraVault

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Import Code Signing Certificate
        env:
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          echo "${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}" | base64 --decode > cert.p12

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign,xcodebuild -k "" build.keychain >/dev/null

          rm -f cert.p12

          echo "✅ Code signing certificate imported"

      - name: Import Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          rm -f profile.mobileprovision

          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "✅ Provisioning profile installed (UUID: $UUID)"

      - name: Determine Build Number
        id: build-number
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
        run: |
          if [ -n "$BUILD_NUMBER_INPUT" ]; then
            BUILD_NUMBER="$BUILD_NUMBER_INPUT"
            echo "Using explicit build_number input: $BUILD_NUMBER"
          else
            # github.run_number is NOT a safe default on its own -- it's this
            # workflow's own run counter, blind to builds uploaded any other
            # way. A build numbered lower than one Apple has already seen for
            # this app version silently uploads and validates fine (Apple's
            # uniqueness check is per exact number, not strictly-increasing),
            # but TestFlight never treats it as newer than what's already
            # live, so it's never offered to testers and never notifies --
            # no error anywhere, just silent invisibility. Hit for real:
            # build 148 (an out-of-band CircleCI fallback-pipeline test
            # upload, see docs/circleci-agent-pipeline-design.md) landed with
            # a build number far above this workflow's own run_number-based
            # sequence, and every run_number-based build after it (40, 41)
            # was silently invisible to every tester until this fix.
            echo "$PRIVATE_KEY" > AuthKey.p8
            HIGHEST=$(ruby -rspaceship -e '
              token = Spaceship::ConnectAPI::Token.create(
                key_id: ENV["KEY_ID"],
                issuer_id: ENV["ISSUER_ID"],
                filepath: "AuthKey.p8",
              )
              Spaceship::ConnectAPI.token = token

              apps = Spaceship::ConnectAPI::App.all(filter: { bundleId: ENV["APPLE_BUNDLE_ID"] })
              raise "No app found for bundle id #{ENV["APPLE_BUNDLE_ID"]}" if apps.empty?
              app = apps.first

              builds = Spaceship::ConnectAPI::Build.all(app_id: app.id, platform: "IOS", sort: "-uploadedDate", limit: 200)
              highest = builds.map { |b| b.version.to_i }.max || 0
              puts highest
            ')
            rm -f AuthKey.p8

            RUN_NUMBER=${{ github.run_number }}
            # Always strictly greater than both -- HIGHEST == RUN_NUMBER is a
            # real, routinely-hit case here (e.g. an explicit build_number
            # dispatch, or the CircleCI fallback path landing a build with
            # today's run_number), and a bare `HIGHEST > RUN_NUMBER ? +1 : `
            # ternary silently re-picks a number Apple has already seen in
            # that case -- the exact bug this step exists to prevent.
            BUILD_NUMBER=$(( (HIGHEST > RUN_NUMBER ? HIGHEST : RUN_NUMBER) + 1 ))
            echo "Highest build number Apple has seen for this app: $HIGHEST. This workflow's own run_number: $RUN_NUMBER. Using: $BUILD_NUMBER"
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "value=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using build number: $BUILD_NUMBER"

      # Pocket TTS's native frameworks + bundled voice model (~230MB combined)
      # aren't committed to git - see SHERPA_ONNX_SETUP.md. Same step as
      # ios-app-build.yml's CI job; this workflow archives independently and
      # needs it too, or "Build & Archive" fails with "There is no XCFramework
      # found at .../third-party/sherpa-onnx/ios/sherpa-onnx.xcframework".
      - name: Cache Pocket TTS iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            third-party/sherpa-onnx/ios
            ios/LibraVaultApp/LibraVault/LibraVault/PocketTTSModel
          key: pocket-tts-ios-${{ hashFiles('third-party/sherpa-onnx/setup-ios.sh') }}

      - name: Fetch Pocket TTS iOS dependencies
        run: ./third-party/sherpa-onnx/setup-ios.sh

      - name: Build & Archive
        run: |
          # Deliberately NOT passing CODE_SIGN_STYLE/CODE_SIGN_IDENTITY/
          # PROVISIONING_PROFILE_SPECIFIER/DEVELOPMENT_TEAM as xcodebuild CLI
          # overrides here, even though they're the values this archive needs.
          # The LibraVault app target's Release config already has all of these
          # baked in per-target in project.pbxproj (CODE_SIGN_STYLE=Manual,
          # PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]="LibraVault",
          # DEVELOPMENT_TEAM[sdk=iphoneos*]=H74LNL8UCG). xcodebuild CLI build
          # setting overrides apply to every target in the build graph, not just
          # the scheme's top-level target — with two SwiftPM package product
          # dependencies now linked (ZIPFoundation + Markdown), that cascaded
          # onto ZIPFoundation's auto-generated resource-bundle target
          # ("ZIPFoundation_ZIPFoundation"), which can't carry a provisioning
          # profile at all and failed archiving with "does not support
          # provisioning profiles". Per-target project settings don't cascade
          # like this, so relying on the project's own config (already correct)
          # avoids the whole class of problem instead of chasing it per package.
          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/LibraVault.xcarchive \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          echo "✅ Archive created (build $BUILD_NUMBER)"

      - name: Create Export Options
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${APPLE_BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LibraVault.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

          echo "✅ IPA exported"
          ls -la build/export/

      - name: Create Build Metadata
        if: always()
        run: |
          cat > build-info.txt << EOF
          Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Build Number: $BUILD_NUMBER
          Git Commit: ${{ github.sha }}
          Git Branch: ${{ github.ref_name }}
          GitHub Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          cat build-info.txt

      - name: Upload to TestFlight
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          echo "$PRIVATE_KEY" > AuthKey.p8

          jq -n \
            --arg key_id "$KEY_ID" \
            --arg issuer_id "$ISSUER_ID" \
            --rawfile key AuthKey.p8 \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > api_key.json

          rm -f AuthKey.p8

          IPA_PATH=$(find build/export -name "*.ipa" | head -1)
          echo "Uploading $IPA_PATH to TestFlight..."

          # --changelog is the "What to Test" text testers actually see. Fed from the
          # workflow_dispatch release_notes input (required — see that input's own
          # description for why: this workflow used to have a separate
          # `create-release-notes` job generating a same-named RELEASE_NOTES.md
          # artifact that was never wired into this upload at all — permanently-stale
          # hardcoded "Phase B" text nobody actually saw as tester notes. Removed in
          # favor of this real, per-build input.
          echo "$RELEASE_NOTES" > changelog.txt

          # --groups is meant to auto-assign the build to the external testers
          # group on upload - without it, every build (compliance status
          # notwithstanding) sat unassigned until someone manually clicked "+"
          # in App Store Connect's Groups column for it (#83).
          #
          # That fix never actually took effect, though: fastlane's pilot
          # (pilot/lib/pilot/build_manager.rb) returns *before* calling
          # distribute_build - the step that assigns groups and sends tester
          # notification emails - whenever skip_waiting_for_build_processing
          # is true and the build isn't done processing yet, which it never
          # is immediately after upload. So --groups here was a no-op on
          # every build since #83 landed; whichever testers did get notified
          # were Apple's automatic internal testers (any org member with App
          # Store Connect access), not the "LibraVault Alpha/Beta" external
          # group, which was never actually being populated.
          #
          # Removing skip_waiting_for_build_processing makes pilot wait for
          # Apple's processing (variable, sometimes 2+ hours - see the job's
          # timeout-minutes) and then actually run distribute_build, so group
          # assignment and tester notification happen for real, inside this
          # job, where a failure would show up in the run instead of silently
          # never happening.
          fastlane pilot upload \
            --api_key_path api_key.json \
            --ipa "$IPA_PATH" \
            --groups "LibraVault Alpha/Beta" \
            --changelog "$(cat changelog.txt)"

          rm -f AuthKey.p8 api_key.json changelog.txt

          echo "✅ Uploaded to TestFlight"

      # `pilot upload --groups` above has been observed (2026-08-25) to
      # intermittently fail to add the external group SILENTLY -- no error,
      # no failed job, "Successfully distributed build to Internal testers"
      # printed regardless (that wording is cosmetic: build_manager.rb's
      # `distribute` labels its final message purely from whether
      # `--distribute_external` was passed, unrelated to whether the named
      # `--groups` group-add actually succeeded). 7 of 24 recent builds were
      # affected. Never trust the upload step's own exit code for this --
      # verify group membership directly via the same API, retry once, and
      # fail the job loudly if it still didn't take, rather than let this
      # look green while testers never get notified again.
      - name: Verify external TestFlight distribution
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY" > AuthKey.p8

          ruby -rspaceship -e '
            token = Spaceship::ConnectAPI::Token.create(
              key_id: ENV["KEY_ID"],
              issuer_id: ENV["ISSUER_ID"],
              filepath: "AuthKey.p8",
            )
            Spaceship::ConnectAPI.token = token

            apps = Spaceship::ConnectAPI::App.all(filter: { bundleId: ENV["APPLE_BUNDLE_ID"] })
            raise "No app found for bundle id #{ENV["APPLE_BUNDLE_ID"]}" if apps.empty?
            app = apps.first

            builds = Spaceship::ConnectAPI::Build.all(app_id: app.id, build_number: ENV["BUILD_NUMBER"], limit: 5)
            raise "No build found with build_number=#{ENV["BUILD_NUMBER"]} -- upload apparently did not really complete" if builds.empty?
            build = builds.first

            external_group = app.get_beta_groups.find { |g| g.name == "LibraVault Alpha/Beta" }
            raise "External group \"LibraVault Alpha/Beta\" not found" if external_group.nil?

            in_group = -> { external_group.fetch_builds.any? { |b| b.id == build.id } }

            if in_group.call
              puts "✅ Verified: build #{build.version} is in \"LibraVault Alpha/Beta\"."
            else
              puts "⚠️ Build #{build.version} is NOT in \"LibraVault Alpha/Beta\" despite --groups on upload -- retrying add_beta_groups directly."
              build.add_beta_groups(beta_groups: [external_group])
              if in_group.call
                puts "✅ Retry succeeded: build #{build.version} now appears in \"LibraVault Alpha/Beta\"."
              else
                raise "add_beta_groups did not raise, but build #{build.version} still is not in the external group after a direct retry. Testers were NOT notified. Run .github/workflows/add-testflight-external-group.yml with build_number=#{build.version} once this is investigated, or add it manually in App Store Connect."
              end
            end
          '

          rm -f AuthKey.p8

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            build/export/
            build-info.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Post Build Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const buildInfo = fs.existsSync('build-info.txt')
              ? fs.readFileSync('build-info.txt', 'utf8')
              : 'Build metadata unavailable';
            const releaseNotes = ${{ toJSON(inputs.release_notes) }};

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || null,
              body: `## 📱 iOS TestFlight Build

              ### Build Information
              \`\`\`
              ${buildInfo}
              \`\`\`

              ### What testers see ("What to Test")
              ${releaseNotes}

              ### Status
              Build completed: ${{ job.status }}

              ${{ job.status == 'success' && 'Uploaded, processed, and distributed to the LibraVault Alpha/Beta group on TestFlight - testers should already have their notification email.' || 'Build or upload failed - check the workflow logs for details.' }}`
            }).catch(err => console.log('PR comment skipped (not a PR context)'))
