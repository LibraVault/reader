name: iOS TestFlight Build & Upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (default: auto-increment)'
        required: false
        type: string

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 120

    env:
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      XCODEPROJ: ios/LibraVaultApp/LibraVault/LibraVault.xcodeproj
      SCHEME: LibraVault

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Import Code Signing Certificate
        env:
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          echo "${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}" | base64 --decode > cert.p12

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign,xcodebuild -k "" build.keychain >/dev/null

          rm -f cert.p12

          echo "✅ Code signing certificate imported"

      - name: Import Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          rm -f profile.mobileprovision

          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "✅ Provisioning profile installed (UUID: $UUID)"

      - name: Build & Archive
        run: |
          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/LibraVault.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

          echo "✅ Archive created"

      - name: Create Export Options
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${APPLE_BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LibraVault.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

          echo "✅ IPA exported"
          ls -la build/export/

      - name: Create Build Metadata
        if: always()
        run: |
          cat > build-info.txt << EOF
          Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Git Commit: ${{ github.sha }}
          Git Branch: ${{ github.ref_name }}
          GitHub Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          cat build-info.txt

      - name: Upload to TestFlight
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY" > AuthKey.p8

          jq -n \
            --arg key_id "$KEY_ID" \
            --arg issuer_id "$ISSUER_ID" \
            --rawfile key AuthKey.p8 \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > api_key.json

          rm -f AuthKey.p8

          IPA_PATH=$(find build/export -name "*.ipa" | head -1)
          echo "Uploading $IPA_PATH to TestFlight..."

          fastlane pilot upload \
            --api_key_path api_key.json \
            --ipa "$IPA_PATH" \
            --skip_waiting_for_build_processing true

          rm -f AuthKey.p8 api_key.json

          echo "✅ Uploaded to TestFlight"

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            build/export/
            build-info.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Post Build Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const buildInfo = fs.existsSync('build-info.txt')
              ? fs.readFileSync('build-info.txt', 'utf8')
              : 'Build metadata unavailable';

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || null,
              body: `## 📱 iOS TestFlight Build

              ### Build Information
              \`\`\`
              ${buildInfo}
              \`\`\`

              ### Status
              Build completed: ${{ job.status }}

              ${{ job.status == 'success' && 'Uploaded to TestFlight. It will appear in App Store Connect within 15-30 minutes once Apple finishes processing.' || 'Build or upload failed - check the workflow logs for details.' }}`
            }).catch(err => console.log('PR comment skipped (not a PR context)'))

  create-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-24.04
    needs: build-and-upload
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Generate Release Notes
        run: |
          echo "## 📱 LibraVault iOS v3.0 TestFlight Build" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### What's New" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "#### Phase B: Complete iOS UI" >> RELEASE_NOTES.md
          echo "- Native SwiftUI app with tab navigation" >> RELEASE_NOTES.md
          echo "- Book library with search functionality" >> RELEASE_NOTES.md
          echo "- Reading experience with page navigation" >> RELEASE_NOTES.md
          echo "- Bookmarks and highlights support" >> RELEASE_NOTES.md
          echo "- TTS (Text-to-Speech) integration" >> RELEASE_NOTES.md
          echo "- Settings for display, audio, and vault management" >> RELEASE_NOTES.md
          echo "- Developer logging and debugging tools" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Build Information" >> RELEASE_NOTES.md
          echo "- **Build Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> RELEASE_NOTES.md
          echo "- **Git Commit**: ${{ github.sha }}" >> RELEASE_NOTES.md
          echo "- **Branch**: ${{ github.ref_name }}" >> RELEASE_NOTES.md
          echo "- **Build Number**: ${{ github.run_number }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Known Limitations" >> RELEASE_NOTES.md
          echo "- Using mock library data (Phase B)" >> RELEASE_NOTES.md
          echo "- Real KMP domain layer integration pending (Phase D)" >> RELEASE_NOTES.md
          echo "- Database persistence not yet active" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Testing Checklist" >> RELEASE_NOTES.md
          echo "- [ ] App launches without crashes" >> RELEASE_NOTES.md
          echo "- [ ] Library view displays sample books" >> RELEASE_NOTES.md
          echo "- [ ] Can open and read books" >> RELEASE_NOTES.md
          echo "- [ ] Page navigation works smoothly" >> RELEASE_NOTES.md
          echo "- [ ] Bookmarks can be created and viewed" >> RELEASE_NOTES.md
          echo "- [ ] Highlights can be created and viewed" >> RELEASE_NOTES.md
          echo "- [ ] Settings page loads and responds" >> RELEASE_NOTES.md
          echo "- [ ] No memory leaks during extended use" >> RELEASE_NOTES.md
          echo "- [ ] Works on iOS 17+ devices/simulators" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 30
