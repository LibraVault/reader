name: JVM Tests

# Runs on every push and every PR — fast, no emulator needed (~2-3 min)
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: jvm-${{ github.ref }}
  cancel-in-progress: true  # Cancel superseded runs on the same branch

jobs:
  test:
    name: Unit & Integration Tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run all JVM-based tests across all modules:
      #   - Domain use case tests (JUnit 5 + MockK + Turbine)
      #   - Repository tests (JUnit 5 + Robolectric)
      #   - ViewModel tests (JUnit 5 + MockK + Turbine)
      #
      # `testDebugUnitTest` is a task NAME, not a path — Gradle runs it in every
      # subproject that has a task by that exact name and *silently* skips any
      # subproject that doesn't, with no error and no log line. core:licensing,
      # feature:settings, and app all have `flavorDimensions` (fdroid/play), so
      # they only have `test{Fdroid,Play}{Debug,Release}UnitTest` tasks — no plain
      # `testDebugUnitTest` — and were never actually exercised by this step
      # despite having real, passing-when-run-directly tests. Call out their
      # flavor-specific debug tasks explicitly so this can't recur silently.
      - name: Run JVM tests
        run: |
          ./gradlew testDebugUnitTest \
            :core:licensing:testFdroidDebugUnitTest \
            :core:licensing:testPlayDebugUnitTest \
            :feature:settings:testFdroidDebugUnitTest \
            :feature:settings:testPlayDebugUnitTest \
            :app:testFdroidDebugUnitTest \
            :app:testPlayDebugUnitTest \
            --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          path: "**/build/reports/tests/"
          retention-days: 7

      - name: Run Lint
        run: ./gradlew lint

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: "**/build/reports/lint-results-*.html"
          retention-days: 7
