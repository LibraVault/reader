name: JVM Tests

# Runs on every PR (any branch) plus every push to dev/main — fast, no
# emulator needed (~2-3 min). Deliberately NOT push: branches: ["**"] —
# that duplicated this same check on every PR's push event too (the
# slowest required check running twice per PR for no extra signal), see
# issue #244. Mirrors ios-app-build.yml's push trigger.
on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: jvm-${{ github.ref }}
  cancel-in-progress: true  # Cancel superseded runs on the same branch

jobs:
  test:
    name: Unit & Integration Tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run all JVM-based tests across all modules:
      #   - Domain use case tests (JUnit 5 + MockK + Turbine)
      #   - Repository tests (JUnit 5 + Robolectric)
      #   - ViewModel tests (JUnit 5 + MockK + Turbine)
      #
      # `testDebugUnitTest` is a task NAME, not a path — Gradle runs it in every
      # subproject that has a task by that exact name and *silently* skips any
      # subproject that doesn't, with no error and no log line. feature:settings
      # and app both have `flavorDimensions` (fdroid/play), so they only have
      # `test{Fdroid,Play}{Debug,Release}UnitTest` tasks — no plain
      # `testDebugUnitTest` — and were never actually exercised by this step
      # despite having real, passing-when-run-directly tests. Call out their
      # flavor-specific debug tasks explicitly so this can't recur silently.
      # (core:licensing used to be listed here too — deleted, no Pro tier for
      # now, see the Encrypted Vaults Phase 6 cleanup.)
      - name: Run JVM tests
        run: |
          ./gradlew testDebugUnitTest \
            :feature:settings:testFdroidDebugUnitTest \
            :feature:settings:testPlayDebugUnitTest \
            :app:testFdroidDebugUnitTest \
            :app:testPlayDebugUnitTest \
            --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          path: "**/build/reports/tests/"
          retention-days: 7

      # Coverage — docs/TEST_COVERAGE_PRD.md Phase 1. Before this the repo had
      # no coverage instrumentation at all, which let TEST_PLAN.md publish
      # per-module percentages nobody could verify (core:domain was listed at
      # "95%"; it measures 17.2%).
      #
      # Cheap to add here: the Kover agent is already attached to the test tasks
      # that just ran, so these tasks are report generation over existing
      # execution data rather than a second test run.
      #
      # Debug variant only — Kover's cross-variant total drags in release unit
      # tests, which cannot pass in this repo (ui-test-manifest is
      # debugImplementation, so createComposeRule() has no Activity). And the
      # flavored modules are named explicitly for exactly the reason spelled out
      # above for testDebugUnitTest: `koverXmlReportDebug` does not exist in
      # :app or :feature:settings and would skip them without a word.
      - name: Generate coverage reports
        run: |
          ./gradlew koverXmlReportDebug koverHtmlReportDebug \
            :app:koverXmlReportFdroidDebug :app:koverHtmlReportFdroidDebug \
            :feature:settings:koverXmlReportFdroidDebug \
            :feature:settings:koverHtmlReportFdroidDebug

      # Prints the per-module table to the run summary, then enforces the gate.
      # Only the core:vault* modules are gated; everything else is report-only,
      # because a repo-wide ratchet mostly produces tests written to move a
      # number. `--gate` also fails if a gated module produces no report at all.
      - name: Coverage summary and gate
        run: python3 scripts/coverage-summary.py --gate

      # Gates COMPLETENESS of docs/TEST_PLAN.md, not accuracy — every module in
      # settings.gradle.kts must be named there, and the plan must not name
      # modules that no longer exist. Deliberately weak: gating a doc on being
      # *true* would mean regenerating it on every PR, which just trains people
      # to bypass the check. What it prevents is a new module arriving with no
      # tests and no mention, leaving the plan reading as though it still covers
      # the repo. See docs/TEST_COVERAGE_PRD.md Phase 6.
      #
      # Placed LAST, with `if: always()`, on purpose. It is pure Python and
      # finishes in under a second, so running it first would give faster
      # feedback — but a failing step ends the job, and a stale doc would then
      # hide every test and coverage result behind it. Someone who adds a module
      # and forgets the table would see a red X and learn nothing about whether
      # their tests pass, which is precisely how a check teaches people to route
      # around it. Running last means both signals always arrive; `always()`
      # means the doc is still checked when the tests themselves fail.
      - name: Check test plan covers every module
        if: always()
        run: python3 scripts/check-test-plan-modules.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/build/reports/kover/html*/"
          retention-days: 7
          if-no-files-found: warn

      - name: Run Lint
        run: ./gradlew lint

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: "**/build/reports/lint-results-*.html"
          retention-days: 7
