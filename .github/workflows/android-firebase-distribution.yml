name: Android Firebase Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for testers"
        required: false
        default: "Beta build via GitHub Actions"
      groups:
        description: "Firebase tester group(s), comma-separated (use group alias, not display name)"
        required: false
        default: "libravault-alphabeta"
      version_code:
        description: 'Version code / build number (default: auto-increment via run number)'
        required: false
        type: string

concurrency:
  group: android-firebase-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-distribute:
    name: Build & Distribute to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Firebase App Distribution's tester invite page auto-linkifies any
      # dot-separated, domain-shaped token in the release notes text --
      # without validating a real TLD or requiring a scheme -- so a bare
      # version string like "v0.4.6.1-alpha" renders as a dead link to
      # http://0.4.6.1-alpha (see issue #290). Firebase's own page heading
      # already shows the build's version + build number, so restating it
      # in the notes body is both redundant and broken. Fail fast, before
      # the build/signing steps, rather than shipping a broken invite link.
      # Logic lives in validate_release_notes.sh so it can be exercised by
      # test_validate_release_notes.sh without a live workflow run.
      - name: Validate release notes don't contain a bare version string
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: .github/scripts/validate_release_notes.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # app/build.gradle.kts's defaultConfig hardcodes versionCode = 12 as the
      # source of truth for local/F-Droid builds. Without an override here, every
      # build this workflow produces reused that same literal, so Firebase App
      # Distribution showed multiple genuinely different uploads (different
      # dates, sizes, release notes) all labeled "0.4.6.1-alpha (12)" -- there
      # was nothing distinguishing them in the tester-facing UI (issue #655).
      # Same pattern as ios-testflight.yml's "Determine Build Number" step:
      # auto-increment via the workflow's own run number unless a specific
      # value is passed explicitly.
      - name: Determine Version Code
        id: version-code
        env:
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          VERSION_CODE="${VERSION_CODE_INPUT:-${{ github.run_number }}}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using version code: $VERSION_CODE"

      # Same pattern as release.yml: decode the base64-encoded keystore and
      # write keystore.properties so the existing signing config in
      # app/build.gradle.kts picks it up directly. No new signing secrets —
      # this reuses the keystore that already signs the F-Droid release APK.
      - name: Set up signing
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode \
            > app/libravault-release.keystore
          printf 'storeFile=libravault-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            > keystore.properties

      - name: Build Play release APK
        run: ./gradlew assemblePlayRelease -PlibravaultVersionCode="$VERSION_CODE"

      # Decoded only for the duration of the upload step below, then removed.
      - name: Set up Firebase credentials
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 --decode \
            > firebase-key.json

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTER_GROUPS: ${{ inputs.groups }}
          # firebase-tools has no --credential-file flag; it authenticates via
          # this standard env var instead (see requireAuth.js in the CLI).
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-key.json
        run: |
          APK_PATH=$(find app/build/outputs/apk/play/release -name "*.apk" | head -1)
          echo "Distributing $APK_PATH"

          npx --yes firebase-tools@13.29.1 appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$RELEASE_NOTES"

          echo "✅ Uploaded to Firebase App Distribution"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-play-release-${{ github.run_number }}
          path: app/build/outputs/apk/play/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      # Clean up signing and Firebase material — never leave keys on the runner
      - name: Clean up secrets
        if: always()
        run: |
          rm -f app/libravault-release.keystore
          rm -f keystore.properties
          rm -f firebase-key.json
