name: Principal Review Agent

# Phase 3 of docs/agent-team-pipeline.md. Runs the last automated gate on a
# QA-passed PR (labeled status:needs-review), then either auto-merges it or
# hands it to a human — see .claude/agents/principal-review-agent.md for
# the actual review logic; this workflow only wires triggers, guardrails,
# and the auto-merge/human-merge split around it.
#
# Plain GITHUB_TOKEN throughout, unlike dev-agent.yml/qa-agent.yml: neither
# outcome here needs to trigger a further workflow run (auto-merge happens
# inline in this same job; human-merge is terminal until a person acts).
#
# History worth recording (both found live, by real principal-review runs
# on PR #187, which correctly diagnosed each and routed to
# status:needs-human-merge rather than guess):
# 1. This briefly used the pipeline App token for the review step,
#    reasoning GITHUB_TOKEN (github-actions[bot]) would collide with the
#    PR's own author identity. Right at the time, wrong once PR #184
#    changed dev-agent.yml's PR-creation to also use the App token — PRs
#    are now authored as the App, so the App token collided with the PR
#    author instead ("viewerDidAuthor: true" on `gh pr review --approve`).
#    Reverted to GITHUB_TOKEN, which is the one actually distinct from the
#    PR author now.
# 2. Even with the right identity, `gh pr review --approve` still fails —
#    this repo's Actions settings block GITHUB_TOKEN from approving PRs
#    outright ("GitHub Actions is not permitted to approve pull requests"),
#    independent of identity, and the same setting #184 worked around for
#    PR creation. There's no branch protection requiring a formal approval
#    here, so the fix is simpler than another token dance: post findings
#    via `gh pr comment`/`--request-changes` (both unaffected) instead of
#    `--approve`, and let the verdict file (not GitHub's review state)
#    drive the actual merge decision, as it already did.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (manual test trigger)"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  # count_active_agent_runs.sh (Phase 4 concurrency cap) calls
  # `gh run list`, which needs this — without it every trigger fails at
  # the guard step with a 403, not just a soft cap miss.
  actions: read

concurrency:
  group: principal-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    # No author_association check on the PR here, deliberately — every PR
    # in this pipeline is opened by the dev agent via GITHUB_TOKEN, whose
    # author_association is not "COLLABORATOR", so that check would make
    # this trigger never fire for any pipeline-produced PR. Trust rests on
    # GitHub's own enforcement of who can add a label (requires
    # triage/write access) plus the same-repo check below. See the
    # matching comment in dev-agent.yml.
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'status:needs-review' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target and check for status:blocked
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          if echo ",$PR_LABELS," | grep -q ",status:blocked,"; then
            echo "PR #$PR_NUMBER carries status:blocked — a human parked this, skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE_NUMBER=$(.github/scripts/resolve_linked_issue.sh "$PR_NUMBER")
          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null) || {
              echo "Could not read issue #$ISSUE_NUMBER (deleted/transferred/inaccessible?) — treating as unblocked." >&2
              ISSUE_LABELS=""
            }
            if echo ",$ISSUE_LABELS," | grep -q ",status:blocked,"; then
              echo "Issue #$ISSUE_NUMBER carries status:blocked — a human parked this, skipping." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # Deliberately non-fatal here, unlike dev-agent.yml/qa-agent.yml
            # (which stop entirely on this) — by the time a PR reaches
            # status:needs-review it's already passed QA, so an unresolved
            # link at this last gate more likely means the body was edited
            # than that this PR is illegitimate. Still logged, so a
            # skipped issue-blocked check is visible in the run log rather
            # than silent.
            echo "Could not resolve the originating issue from PR #$PR_NUMBER's body — proceeding without the issue-level status:blocked check." >&2
          fi

          # Global concurrency cap (Phase 4 guardrail) — see the matching
          # comment in dev-agent.yml for why this is separate from the
          # per-item concurrency group above.
          read -r ACTIVE MAX <<< "$(.github/scripts/count_active_agent_runs.sh "${{ github.run_id }}" "${{ vars.MAX_CONCURRENT_AGENT_RUNS }}")"
          if [ "$ACTIVE" -ge "$MAX" ]; then
            echo "At capacity ($ACTIVE/$MAX active pipeline runs) — skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --body "Pipeline is at capacity ($ACTIVE/$MAX active runs) — skipping this review run. Re-apply status:needs-review once activity settles, or re-trigger manually via workflow_dispatch."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out PR branch
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `git reset --hard HEAD` after the checkout is deliberate, not
        # redundant: issue #386 caught `gh pr checkout` (run right after
        # actions/checkout@v4's own merge-ref checkout above) reporting a
        # clean switch while actually leaving 3 unrelated files' working-tree
        # content mismatched against what's committed at HEAD — root cause
        # unconfirmed, but every downstream step here (the workflow-drift
        # check below, and the review agent itself) trusts the working tree
        # to match HEAD. Force it, rather than assume it.
        run: |
          gh pr checkout "${{ steps.guard.outputs.pr_number }}"
          git reset --hard HEAD

      - name: Check for workflow-file drift (GitHub OIDC self-check)
        # GitHub refuses to mint the OIDC token claude-code-action needs
        # (this job requests id-token: write) when a pull_request-triggered
        # workflow's own file on the PR branch doesn't byte-match the copy
        # on the base branch — its own anti-tampering check, to stop a PR
        # from modifying the very workflow that's about to run with that
        # trust. "Run principal review agent" below still reports success
        # when this happens (the token exchange fails inside the action,
        # not the step), so without this check the run silently does
        # nothing and the PR is left stuck on status:needs-review with no
        # actionable signal. See issue #254 for the full diagnosis (a live
        # hit on PR #234, 14 commits behind dev, this exact pattern hitting
        # qa-agent.yml).
        #
        # classify_workflow_drift.sh (issue #401) further distinguishes
        # *why* the file differs: "stale" (dev moved the file on since this
        # branch's merge-base — rebasing fixes it, the ordinary case) from
        # "self" (this PR's own commits modify the file directly — no
        # rebase can ever fix that, since the diff to the file IS the
        # point of the PR). The routing step below treats those two cases
        # differently.
        id: workflow-drift
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch origin dev
          CLASS=$(.github/scripts/classify_workflow_drift.sh .github/workflows/principal-review.yml origin/dev)
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          if [ "$CLASS" = "none" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "This workflow's own file (.github/workflows/principal-review.yml) differs between this PR branch and dev ($CLASS) — the OIDC token exchange below would be refused. Skipping the agent step." >&2
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run principal review agent
        if: steps.guard.outputs.skip != 'true' && steps.workflow-drift.outputs.drift != 'true'
        id: agent
        # Without this, a crash here (e.g. exhausting --max-turns) fails
        # the whole job and skips every step after it, including "Advance
        # PR based on review verdict" — the PR is then left stuck on
        # status:needs-review with no comment, no label change, and no
        # visible signal anything went wrong (found live on PR #224,
        # issue #227). Mirrors qa-agent.yml's identical step, whose
        # "Advance PR" step routes a crash to status:needs-info instead of
        # silently doing nothing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action refuses to run at all when triggered by a
          # non-human actor by default (its own anti-recursion guard) —
          # confirmed live: "Workflow initiated by non-human actor:
          # libravault-pipeline-bot (type: Bot)." The trigger here IS the
          # pipeline App applying status:needs-review, so without this
          # Phase 3 could never run. Scoped to our own bot by name, not '*'.
          allowed_bots: libravault-pipeline-bot
          # This — not the GH_TOKEN env var above — is what actually
          # controls the identity claude-code-action uses for git/gh
          # operations when claude_code_oauth_token is set: it defaults to
          # Claude's own claude[bot] App regardless of GH_TOKEN. Forced to
          # GITHUB_TOKEN explicitly, matching dev-agent.yml/qa-agent.yml —
          # see the file header comment for why GITHUB_TOKEN (not the App
          # token) is what's actually distinct from the PR's author here.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to false, hiding the agent's turn-by-turn transcript.
          # Turned on for consistency with dev-agent.yml, where it was
          # used to diagnose a real live failure: an agent spawning an
          # async Explore subagent via the Agent tool (not in
          # --allowedTools, available anyway — a documented Claude Agent
          # SDK gap, anthropics/claude-agent-sdk-typescript#189), then
          # waiting for a notification that never comes in a CI run. See
          # the explicit prohibition in the prompt below.
          show_full_output: true
          prompt: |
            Read .claude/agents/principal-review-agent.md in full — it is
            your complete operating persona for this run. Review PR
            #${{ steps.guard.outputs.pr_number }} in this repository (the
            branch is already checked out; use `gh pr view --json` /
            `gh pr diff` to read the PR itself). Post your findings with
            `gh pr comment` for auto-merge, or `gh pr review --request-changes`
            for human-merge, per the persona — do NOT use
            `gh pr review --approve`; this repo's Actions settings block
            GITHUB_TOKEN from approving PRs outright, and there's no
            branch protection requiring a formal approval anyway. Do not
            apply status:approved-auto-merge or status:needs-human-merge
            yourself — the workflow applies whichever one matches your
            verdict, based on the verdict file you write below.

            Start that PR comment/review body with a line of the exact
            form `## Principal review — verdict: \`auto-merge\`` or
            `## Principal review — verdict: \`human-merge\`` (matching
            whichever you conclude). This is load-bearing, not cosmetic:
            if you crash on a later turn before writing
            `principal-verdict.txt` below (e.g. an API rate-limit hit
            right after posting), the workflow's crash-recovery step
            recovers your verdict by grepping your most recent PR
            review/comment for exactly this line instead of discarding a
            completed review to status:needs-info (see issue #426).

            Do not use anything that depends on a completion notification
            arriving later — there is no such mechanism in this CI run, so
            it never arrives and no verdict ever gets produced:
            - No subagent delegation (the Agent tool, any "Explore"/"Task"
              subagent type).
            - No backgrounded Bash commands (run_in_background) that you
              then wait to be notified about. Run every command in the
              foreground and wait for its real output before continuing,
              even if it takes several minutes; that's normal and expected
              here, not a problem to work around.
            Investigate everything yourself, directly, with your own
            Read/Grep/Glob/Bash calls in this same turn sequence, waiting
            synchronously for each one's actual result before moving on.

            As your very last action, write a single line to the file
            `principal-verdict.txt` in the repo root: exactly one of
            `auto-merge` or `human-merge`. Always write this file, even if
            something went wrong earlier — default to `human-merge` if
            you're not fully confident.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash"
            # Was 40. Raised after at least 4 same-day crashes (PRs
            # #257/#264/#281, plus one flagged earlier on #279 without the
            # cap being raised) where the agent's own last action —
            # writing principal-verdict.txt — landed one or two turns past
            # the cap (e.g. PR #281's job log: "num_turns": 41 against a
            # 40 cap). See issue #297.
            --max-turns 65

      - name: Advance PR based on review verdict
        if: steps.guard.outputs.skip != 'true' && !cancelled()
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # steps.guard.outputs.* are only trustworthy if the guard step
          # actually completed. If it crashed instead (e.g. a transient
          # `gh` API error hitting set -e before writing any output), this
          # step's own `if` above (`skip != 'true'`) can't tell that apart
          # from a real skip=false — steps.guard.outputs.pr_number/skip
          # just read as empty either way. Handle the crash first, using
          # raw event context rather than guard's own (possibly-unwritten)
          # outputs. See issue #231.
          if [ "${{ steps.guard.outcome }}" = "failure" ]; then
            PR_NUMBER="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
            echo "Guard step crashed while resolving PR #$PR_NUMBER — routing to status:needs-info instead of silently falling through to the human-merge default." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:needs-review || true
            gh pr edit "$PR_NUMBER" --add-label status:needs-info
            gh pr comment "$PR_NUMBER" --body "The guard step (checking status:blocked) crashed before it could finish — see the [workflow run]($RUN_URL). Routed to a human instead of silently advancing this PR or falling through to a default verdict."
            echo "verdict=guard-crashed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER="${{ steps.guard.outputs.pr_number }}"

          # Workflow-file drift (see the "Check for workflow-file drift"
          # step above) — the agent step was skipped outright, so there's
          # no principal-verdict.txt to look for. Same reasoning as the
          # crash branch above: this is a pipeline/tooling failure, not a
          # review verdict, so route to a human directly.
          if [ "${{ steps.workflow-drift.outputs.drift }}" = "true" ]; then
            echo "PR #$PR_NUMBER's branch has workflow-file drift from dev — GitHub's OIDC anti-tampering check would have silently no-opped the principal review agent step, so it was skipped instead. Routing to a human." >&2

            if [ "${{ steps.workflow-drift.outputs.class }}" = "self" ]; then
              # Issue #401: this PR's own diff touches
              # .github/workflows/principal-review.yml directly, so the
              # drift will reproduce identically on every retry no matter
              # how current the branch is — "rebase and re-add
              # status:needs-review" is a dead end, not a fix. This file is
              # already a sensitive_path (risk:high, always ends at
              # status:needs-human-merge anyway), so skip straight there
              # instead of cycling through status:needs-info first.
              gh pr edit "$PR_NUMBER" --remove-label status:needs-review || true
              gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge || true
              gh pr edit "$PR_NUMBER" --add-label status:needs-human-merge
              gh pr comment "$PR_NUMBER" --body "This PR's own diff modifies \`.github/workflows/principal-review.yml\` — the exact workflow file this review run is. GitHub Actions refuses to mint the OIDC token \`claude-code-action\` needs when a \`pull_request\`-triggered, \`id-token: write\` workflow's own file doesn't byte-match the base branch (its own anti-tampering check), so the principal review agent step was skipped. Unlike ordinary branch staleness, **rebasing \`dev\` in will never fix this** — the PR's own diff to this file is the point of the PR, so it can never byte-match \`dev\`'s copy no matter how current the branch is (see issue #401). Routing straight to \`status:needs-human-merge\` — this needs direct human review, not another automated retry."
              echo "verdict=self-drift" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            gh pr edit "$PR_NUMBER" --remove-label status:needs-review || true
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge || true
            gh pr edit "$PR_NUMBER" --remove-label status:needs-human-merge || true
            gh pr edit "$PR_NUMBER" --add-label status:needs-info
            gh pr comment "$PR_NUMBER" --body "This PR's branch is stale relative to \`dev\` — specifically, \`.github/workflows/principal-review.yml\` differs between this branch and \`dev\`. GitHub Actions refuses to mint the OIDC token \`claude-code-action\` needs when a \`pull_request\`-triggered, \`id-token: write\` workflow's own file doesn't byte-match the base branch (its own anti-tampering check), so the principal review agent step was skipped rather than silently no-opping (see issue #254 for the full diagnosis). Rebase/merge \`dev\` into this branch and re-add \`status:needs-review\` to retry."
            echo "verdict=drift" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A crashed agent step (max-turns exhausted, tool error) doesn't
          # necessarily mean there's no verdict — the agent's very last
          # action is writing principal-verdict.txt, so hitting the turn
          # cap one action later is common, not rare (see issue #297: PRs
          # #257/#264/#281 all crashed with a valid verdict already on
          # disk, discarded to status:needs-info unnecessarily). Only
          # treat this as a real pipeline failure — no usable verdict to
          # trust — when principal-verdict.txt is either missing or
          # doesn't contain a recognized verdict. Mirrors
          # dev-agent.yml/qa-agent.yml's identical steps.agent.outcome
          # check in spirit (issue #227, found live on PR #224), but those
          # two don't have this file-recovery path (yet — see #297).
          AGENT_CRASHED="false"
          if [ "${{ steps.agent.outcome }}" = "failure" ]; then
            AGENT_CRASHED="true"
            CRASH_VERDICT=""
            CRASH_VERDICT_SOURCE=""
            if [ -f principal-verdict.txt ]; then
              CRASH_VERDICT=$(tr -d '[:space:]' < principal-verdict.txt | tr '[:upper:]' '[:lower:]')
              if [ "$CRASH_VERDICT" = "auto-merge" ] || [ "$CRASH_VERDICT" = "human-merge" ]; then
                CRASH_VERDICT_SOURCE="verdict file"
              fi
            fi

            # No usable verdict file doesn't necessarily mean no usable
            # verdict — the agent's actual review is posted to GitHub
            # (`gh pr review` or `gh pr comment`, per the persona) *before*
            # it writes principal-verdict.txt as its last action, so a crash
            # on a later turn (e.g. the org's weekly rate cap, see issue
            # #426, distinct from #297's turn-budget crash) can discard a
            # fully valid, already-posted review. Fall back to the most
            # recent PR comment/review whose body carries the agent's own
            # `verdict: \`X\`` line before concluding there's nothing to
            # recover.
            if [ "$CRASH_VERDICT" != "auto-merge" ] && [ "$CRASH_VERDICT" != "human-merge" ]; then
              REVIEW_VERDICT=$(.github/scripts/extract_review_verdict.sh "$PR_NUMBER" 2>/dev/null || true)
              if [ "$REVIEW_VERDICT" = "auto-merge" ] || [ "$REVIEW_VERDICT" = "human-merge" ]; then
                CRASH_VERDICT="$REVIEW_VERDICT"
                CRASH_VERDICT_SOURCE="an already-posted PR review/comment (verdict file was never written before the crash)"
              fi
            fi

            if [ "$CRASH_VERDICT" != "auto-merge" ] && [ "$CRASH_VERDICT" != "human-merge" ]; then
              echo "Principal review run crashed for PR #$PR_NUMBER with no usable verdict file and no recoverable verdict in its posted reviews/comments — routing to status:needs-info instead of a verdict." >&2
              gh pr edit "$PR_NUMBER" --remove-label status:needs-review || true
              # Also clear a stale outcome label left by an EARLIER review
              # round on this same PR (e.g. re-review after an
              # update-from-base) — mirrors the cleanup the verdict path
              # below already does, but that path is skipped entirely on a
              # crash. Without this, a PR that was status:needs-human-merge
              # (or status:approved-auto-merge) from a prior round keeps
              # that label alongside the new status:needs-info, so it can
              # read as already reviewed/mergeable even though this round
              # never reached a verdict (issue #236).
              gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge || true
              gh pr edit "$PR_NUMBER" --remove-label status:needs-human-merge || true
              gh pr edit "$PR_NUMBER" --add-label status:needs-info
              gh pr comment "$PR_NUMBER" --body "principal-review's run crashed or exhausted its turn budget (see the [workflow run]($RUN_URL)) before writing a usable verdict — routed to a human instead of silently leaving this on status:needs-review. Needs a human to either re-run review (re-add \`status:needs-review\`) or review this PR directly."
              echo "verdict=crashed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Principal review run crashed for PR #$PR_NUMBER (see the workflow run), but a valid verdict ($CRASH_VERDICT) was recovered from $CRASH_VERDICT_SOURCE — using it instead of discarding to status:needs-info." >&2
          fi

          VERDICT="human-merge"
          if [ -f principal-verdict.txt ]; then
            VERDICT=$(tr -d '[:space:]' < principal-verdict.txt | tr '[:upper:]' '[:lower:]')
            rm -f principal-verdict.txt
          else
            echo "Agent didn't write principal-verdict.txt — defaulting to human-merge." >&2
          fi
          if [ "$VERDICT" != "auto-merge" ] && [ "$VERDICT" != "human-merge" ]; then
            echo "Unrecognized verdict '$VERDICT' — treating as human-merge." >&2
            VERDICT="human-merge"
          fi

          # Phase 5 dry-run switch: pilot the full pipeline (including this
          # agent's real judgment) on real issues without ever letting
          # anything actually auto-merge. See docs/agent-team-pipeline.md's
          # rollout plan.
          if [ "$VERDICT" = "auto-merge" ] && [ "${{ vars.AUTO_MERGE_DISABLED }}" = "true" ]; then
            echo "AUTO_MERGE_DISABLED is set — would have auto-merged, routing to human-merge instead (dry run)." >&2
            gh pr comment "$PR_NUMBER" --body "Auto-merge is disabled repo-wide (AUTO_MERGE_DISABLED, dry-run/pilot mode) — this PR's actual verdict was \`auto-merge\` (risk:low, no CONFIRMED findings), but routing to a human instead of merging, per the Phase 5 pilot plan."
            VERDICT="human-merge"
          fi

          echo "Principal review verdict for #$PR_NUMBER: $VERDICT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          gh pr edit "$PR_NUMBER" --remove-label status:needs-review || true
          # Also clear whichever outcome label a PREVIOUS review round on
          # this same PR left behind (e.g. a re-review after an
          # update-from-base) — live-tested miss: PR #187 briefly carried
          # both status:approved-auto-merge and status:needs-human-merge
          # at once, since only the new outcome was ever added, never the
          # stale opposite one removed.
          if [ "$VERDICT" = "auto-merge" ]; then
            gh pr edit "$PR_NUMBER" --remove-label status:needs-human-merge || true
            gh pr edit "$PR_NUMBER" --add-label status:approved-auto-merge
          else
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge || true
            gh pr edit "$PR_NUMBER" --add-label status:needs-human-merge
          fi

          if [ "$AGENT_CRASHED" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body "Note: the review agent's run itself reported a failure (likely exhausted its turn budget or hit an API error — see the [workflow run]($RUN_URL)), but verdict \`$VERDICT\` was recovered from $CRASH_VERDICT_SOURCE, so this PR is being routed on that verdict rather than discarded to \`status:needs-info\`. Worth a closer look given the crash."
          fi

      - name: Auto-merge if approved
        if: steps.guard.outputs.skip != 'true' && steps.verdict.outputs.verdict == 'auto-merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr_number }}"

          echo "Waiting for CI to go green on #$PR_NUMBER (up to 20 minutes)..."
          # Fail-safe by construction: only declare success when every
          # check is in a known-good terminal state. Any state this
          # doesn't recognize (CANCELLED, TIMED_OUT, ACTION_REQUIRED,
          # STALE, an empty check list, or anything GitHub adds later)
          # falls through to "pending" and eventually the 20-minute
          # timeout below, rather than being silently treated as success.
          #
          # The polled check list always includes this exact job's own
          # check run ("review", on the "Principal Review Agent"
          # workflow) — this step is running *inside* it. That check
          # can't turn SUCCESS until the job finishes, and the job can't
          # finish (successfully) until this step does, so requiring it
          # to be green before proceeding is a structural deadlock: the
          # loop would spin for the full 20 minutes on every run,
          # regardless of how fast the real CI is (confirmed live on PR
          # #213 and PR #216 — see issue #218). Filter it out by workflow
          # name, not job id ("review"), so this keeps working even if
          # the job is ever renamed. The other real checks (iOS build,
          # JVM tests, QA/dev-agent skip states) are sufficient signal
          # on their own.
          for _ in $(seq 1 40); do
            STATE=$(gh pr checks "$PR_NUMBER" --json state,workflow -q '
              [.[] | select(.workflow != "Principal Review Agent")] as $checks |
              if ($checks | length) == 0 then "pending"
              elif any($checks[]; .state == "PENDING" or .state == "IN_PROGRESS" or .state == "QUEUED" or .state == "REQUESTED" or .state == "WAITING") then "pending"
              elif any($checks[]; .state == "FAILURE" or .state == "ERROR") then "failed"
              elif all($checks[]; .state == "SUCCESS" or .state == "NEUTRAL" or .state == "SKIPPED") then "success"
              else "pending" end' 2>/dev/null || echo "pending")
            echo "CI state: $STATE"
            [ "$STATE" = "success" ] && break
            if [ "$STATE" = "failed" ]; then
              gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
              gh pr comment "$PR_NUMBER" --body "CI failed after principal review approved auto-merge — routed to a human instead of merging on red CI."
              exit 0
            fi
            sleep 30
          done

          if [ "$STATE" != "success" ]; then
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "CI didn't finish within 20 minutes of auto-merge approval — routed to a human instead of waiting indefinitely."
            exit 0
          fi

          # Re-check both kill switches immediately before merging, not
          # just once at the top of this step — the pipeline could have
          # been paused, or a human could have parked this specific PR,
          # at any point during the up-to-20-minute wait above.
          if [ "${{ vars.AGENTS_PAUSED }}" = "true" ]; then
            echo "AGENTS_PAUSED became true during this run — stopping short of merge." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "Pipeline was paused (AGENTS_PAUSED) after approval but before merge — routed to a human instead of auto-merging."
            exit 0
          fi
          if [ "${{ vars.AUTO_MERGE_DISABLED }}" = "true" ]; then
            echo "AUTO_MERGE_DISABLED became true during this run — stopping short of merge." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "Auto-merge was disabled (AUTO_MERGE_DISABLED) after approval but before merge — routed to a human instead of auto-merging."
            exit 0
          fi
          CURRENT_PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          if echo ",$CURRENT_PR_LABELS," | grep -q ",status:blocked,"; then
            echo "status:blocked was added during this run — stopping short of merge." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "status:blocked was applied after approval but before merge — routed to a human instead of auto-merging."
            exit 0
          fi

          # Merge, self-healing against a live pipeline: `dev` can advance
          # between "approved" and "merge" — other PRs from this same
          # pipeline landing concurrently. That's not a real failure, just
          # a lost race, but `gh pr merge` fails on it exactly like it
          # would on a genuine conflict ("head branch is not up to date
          # with base branch"). Live-hit manually on PR #239 (issue #246):
          # the branch went BEHIND twice within ~15 minutes from ordinary
          # pipeline throughput, requiring a manual re-sync each time —
          # this loop does that same re-sync automatically via GitHub's
          # own server-side "Update branch" endpoint instead of falling
          # straight through to status:needs-human-merge.
          MAX_MERGE_ATTEMPTS=5
          MERGED=false
          for attempt in $(seq 1 $MAX_MERGE_ATTEMPTS); do
            # Resolve BEHIND/UNKNOWN before even trying to merge — bounded
            # wait (up to 2 minutes), not indefinite, so a mergeability
            # check that's stuck for some other reason still falls
            # through to the real gh pr merge call below and reports its
            # own actual error instead of spinning forever in here.
            for _ in $(seq 1 12); do
              # Guarded against transient `gh pr view` failures (API
              # error/timeout/rate-limit) — under `set -euo pipefail`, an
              # unguarded command substitution here would kill the whole
              # step before ever reaching the DIRTY/needs-human-merge
              # fallback below, leaving the PR silently stuck on
              # status:approved-auto-merge with no comment. Falling into
              # UNKNOWN routes it through the existing bounded
              # wait-and-recheck branch instead of crashing.
              MERGE_STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q .mergeStateStatus 2>/dev/null || echo "UNKNOWN")
              case "$MERGE_STATE" in
                BEHIND)
                  echo "Branch is behind dev (attempt $attempt/$MAX_MERGE_ATTEMPTS) — requesting GitHub's server-side update-branch." >&2
                  gh api -X PUT "repos/${{ github.repository }}/pulls/$PR_NUMBER/update-branch" >/dev/null 2>&1 || true
                  sleep 10
                  ;;
                UNKNOWN)
                  # GitHub hasn't finished computing mergeability yet
                  # (common right after a push) — not a failure, just not
                  # ready.
                  sleep 5
                  ;;
                *)
                  break
                  ;;
              esac
            done
            echo "Merge attempt $attempt/$MAX_MERGE_ATTEMPTS — mergeStateStatus=$MERGE_STATE"

            if [ "$MERGE_STATE" = "DIRTY" ]; then
              echo "Real merge conflict (mergeStateStatus=DIRTY) — not retryable, routing to a human." >&2
              break
            fi

            if gh pr merge "$PR_NUMBER" --squash --delete-branch=false; then
              MERGED=true
              break
            fi
            echo "gh pr merge failed on attempt $attempt/$MAX_MERGE_ATTEMPTS (mergeStateStatus was $MERGE_STATE) — see the log above for the exact error; will retry if attempts remain." >&2
          done

          if [ "$MERGED" != "true" ]; then
            echo "Giving up after $MAX_MERGE_ATTEMPTS merge attempts (last mergeStateStatus=$MERGE_STATE)." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "Auto-merge failed after $MAX_MERGE_ATTEMPTS attempts (including self-healing retries for a stale branch via GitHub's update-branch API — see the workflow run log for the exact error) — routed to a human instead of leaving this stuck on status:approved-auto-merge."
            exit 0
          fi
          echo "Merged #$PR_NUMBER."

          # Best-effort audit log (Phase 4 guardrail) — wrapped so a
          # failure here doesn't fail the run: the merge itself already
          # succeeded, which is what actually matters.
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q .title | sed 's/|/\\|/g')
            ISSUE_NUMBER=$(.github/scripts/resolve_linked_issue.sh "$PR_NUMBER" 2>/dev/null || echo "")
            # Read the merge commit GitHub actually recorded for THIS PR,
            # not the current tip of dev after a fetch — another
            # principal-review run for a different PR isn't serialized
            # against this one (concurrency groups are per-PR) and could
            # land its own merge on dev in between, which would make
            # "tip of dev" record the wrong commit for this log entry.
            MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit -q .mergeCommit.oid)
            git fetch origin dev
            git checkout -B dev origin/dev
            printf '| %s | [#%s](%s/%s/pull/%s) | %s | %s | [%s](%s/%s/commit/%s) |\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$PR_NUMBER" "${{ github.server_url }}" "${{ github.repository }}" "$PR_NUMBER" \
              "$PR_TITLE" \
              "${ISSUE_NUMBER:+#$ISSUE_NUMBER}" \
              "${MERGE_SHA:0:7}" "${{ github.server_url }}" "${{ github.repository }}" "$MERGE_SHA" \
              >> docs/auto-merge-log.md
            git add docs/auto-merge-log.md
            git commit -m "chore(auto-merge-log): record PR #$PR_NUMBER"
            git push origin dev
          } || echo "Auto-merge log update failed (non-fatal — the merge itself succeeded) — see the log above for details." >&2
