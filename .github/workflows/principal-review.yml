name: Principal Review Agent

# Phase 3 of docs/agent-team-pipeline.md. Runs the last automated gate on a
# QA-passed PR (labeled status:needs-review), then either auto-merges it or
# hands it to a human — see .claude/agents/principal-review-agent.md for
# the actual review logic; this workflow only wires triggers, guardrails,
# and the auto-merge/human-merge split around it.
#
# Plain GITHUB_TOKEN throughout, unlike dev-agent.yml/qa-agent.yml: neither
# outcome here needs to trigger a further workflow run (auto-merge happens
# inline in this same job; human-merge is terminal until a person acts).
#
# History worth recording (both found live, by real principal-review runs
# on PR #187, which correctly diagnosed each and routed to
# status:needs-human-merge rather than guess):
# 1. This briefly used the pipeline App token for the review step,
#    reasoning GITHUB_TOKEN (github-actions[bot]) would collide with the
#    PR's own author identity. Right at the time, wrong once PR #184
#    changed dev-agent.yml's PR-creation to also use the App token — PRs
#    are now authored as the App, so the App token collided with the PR
#    author instead ("viewerDidAuthor: true" on `gh pr review --approve`).
#    Reverted to GITHUB_TOKEN, which is the one actually distinct from the
#    PR author now.
# 2. Even with the right identity, `gh pr review --approve` still fails —
#    this repo's Actions settings block GITHUB_TOKEN from approving PRs
#    outright ("GitHub Actions is not permitted to approve pull requests"),
#    independent of identity, and the same setting #184 worked around for
#    PR creation. There's no branch protection requiring a formal approval
#    here, so the fix is simpler than another token dance: post findings
#    via `gh pr comment`/`--request-changes` (both unaffected) instead of
#    `--approve`, and let the verdict file (not GitHub's review state)
#    drive the actual merge decision, as it already did.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (manual test trigger)"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  # count_active_agent_runs.sh (Phase 4 concurrency cap) calls
  # `gh run list`, which needs this — without it every trigger fails at
  # the guard step with a 403, not just a soft cap miss.
  actions: read

concurrency:
  group: principal-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    # No author_association check on the PR here, deliberately — every PR
    # in this pipeline is opened by the dev agent via GITHUB_TOKEN, whose
    # author_association is not "COLLABORATOR", so that check would make
    # this trigger never fire for any pipeline-produced PR. Trust rests on
    # GitHub's own enforcement of who can add a label (requires
    # triage/write access) plus the same-repo check below. See the
    # matching comment in dev-agent.yml.
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'status:needs-review' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target and check for status:blocked
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          if echo ",$PR_LABELS," | grep -q ",status:blocked,"; then
            echo "PR #$PR_NUMBER carries status:blocked — a human parked this, skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE_NUMBER=$(.github/scripts/resolve_linked_issue.sh "$PR_NUMBER")
          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null) || {
              echo "Could not read issue #$ISSUE_NUMBER (deleted/transferred/inaccessible?) — treating as unblocked." >&2
              ISSUE_LABELS=""
            }
            if echo ",$ISSUE_LABELS," | grep -q ",status:blocked,"; then
              echo "Issue #$ISSUE_NUMBER carries status:blocked — a human parked this, skipping." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # Deliberately non-fatal here, unlike dev-agent.yml/qa-agent.yml
            # (which stop entirely on this) — by the time a PR reaches
            # status:needs-review it's already passed QA, so an unresolved
            # link at this last gate more likely means the body was edited
            # than that this PR is illegitimate. Still logged, so a
            # skipped issue-blocked check is visible in the run log rather
            # than silent.
            echo "Could not resolve the originating issue from PR #$PR_NUMBER's body — proceeding without the issue-level status:blocked check." >&2
          fi

          # Global concurrency cap (Phase 4 guardrail) — see the matching
          # comment in dev-agent.yml for why this is separate from the
          # per-item concurrency group above.
          read -r ACTIVE MAX <<< "$(.github/scripts/count_active_agent_runs.sh "${{ github.run_id }}" "${{ vars.MAX_CONCURRENT_AGENT_RUNS }}")"
          if [ "$ACTIVE" -ge "$MAX" ]; then
            echo "At capacity ($ACTIVE/$MAX active pipeline runs) — skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --body "Pipeline is at capacity ($ACTIVE/$MAX active runs) — skipping this review run. Re-apply status:needs-review once activity settles, or re-trigger manually via workflow_dispatch."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out PR branch
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout "${{ steps.guard.outputs.pr_number }}"

      - name: Run principal review agent
        if: steps.guard.outputs.skip != 'true'
        id: agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action refuses to run at all when triggered by a
          # non-human actor by default (its own anti-recursion guard) —
          # confirmed live: "Workflow initiated by non-human actor:
          # libravault-pipeline-bot (type: Bot)." The trigger here IS the
          # pipeline App applying status:needs-review, so without this
          # Phase 3 could never run. Scoped to our own bot by name, not '*'.
          allowed_bots: libravault-pipeline-bot
          # This — not the GH_TOKEN env var above — is what actually
          # controls the identity claude-code-action uses for git/gh
          # operations when claude_code_oauth_token is set: it defaults to
          # Claude's own claude[bot] App regardless of GH_TOKEN. Forced to
          # GITHUB_TOKEN explicitly, matching dev-agent.yml/qa-agent.yml —
          # see the file header comment for why GITHUB_TOKEN (not the App
          # token) is what's actually distinct from the PR's author here.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read .claude/agents/principal-review-agent.md in full — it is
            your complete operating persona for this run. Review PR
            #${{ steps.guard.outputs.pr_number }} in this repository (the
            branch is already checked out; use `gh pr view --json` /
            `gh pr diff` to read the PR itself). Post your findings with
            `gh pr comment` for auto-merge, or `gh pr review --request-changes`
            for human-merge, per the persona — do NOT use
            `gh pr review --approve`; this repo's Actions settings block
            GITHUB_TOKEN from approving PRs outright, and there's no
            branch protection requiring a formal approval anyway. Do not
            apply status:approved-auto-merge or status:needs-human-merge
            yourself — the workflow applies whichever one matches your
            verdict, based on the verdict file you write below.

            As your very last action, write a single line to the file
            `principal-verdict.txt` in the repo root: exactly one of
            `auto-merge` or `human-merge`. Always write this file, even if
            something went wrong earlier — default to `human-merge` if
            you're not fully confident.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash"
            --max-turns 40

      - name: Advance PR based on review verdict
        if: steps.guard.outputs.skip != 'true'
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr_number }}"

          VERDICT="human-merge"
          if [ -f principal-verdict.txt ]; then
            VERDICT=$(tr -d '[:space:]' < principal-verdict.txt | tr '[:upper:]' '[:lower:]')
            rm -f principal-verdict.txt
          else
            echo "Agent didn't write principal-verdict.txt — defaulting to human-merge." >&2
          fi
          if [ "$VERDICT" != "auto-merge" ] && [ "$VERDICT" != "human-merge" ]; then
            echo "Unrecognized verdict '$VERDICT' — treating as human-merge." >&2
            VERDICT="human-merge"
          fi

          # Phase 5 dry-run switch: pilot the full pipeline (including this
          # agent's real judgment) on real issues without ever letting
          # anything actually auto-merge. See docs/agent-team-pipeline.md's
          # rollout plan.
          if [ "$VERDICT" = "auto-merge" ] && [ "${{ vars.AUTO_MERGE_DISABLED }}" = "true" ]; then
            echo "AUTO_MERGE_DISABLED is set — would have auto-merged, routing to human-merge instead (dry run)." >&2
            gh pr comment "$PR_NUMBER" --body "Auto-merge is disabled repo-wide (AUTO_MERGE_DISABLED, dry-run/pilot mode) — this PR's actual verdict was \`auto-merge\` (risk:low, no CONFIRMED findings), but routing to a human instead of merging, per the Phase 5 pilot plan."
            VERDICT="human-merge"
          fi

          echo "Principal review verdict for #$PR_NUMBER: $VERDICT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          gh pr edit "$PR_NUMBER" --remove-label status:needs-review || true
          # Also clear whichever outcome label a PREVIOUS review round on
          # this same PR left behind (e.g. a re-review after an
          # update-from-base) — live-tested miss: PR #187 briefly carried
          # both status:approved-auto-merge and status:needs-human-merge
          # at once, since only the new outcome was ever added, never the
          # stale opposite one removed.
          if [ "$VERDICT" = "auto-merge" ]; then
            gh pr edit "$PR_NUMBER" --remove-label status:needs-human-merge || true
            gh pr edit "$PR_NUMBER" --add-label status:approved-auto-merge
          else
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge || true
            gh pr edit "$PR_NUMBER" --add-label status:needs-human-merge
          fi

      - name: Auto-merge if approved
        if: steps.guard.outputs.skip != 'true' && steps.verdict.outputs.verdict == 'auto-merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.guard.outputs.pr_number }}"

          echo "Waiting for CI to go green on #$PR_NUMBER (up to 20 minutes)..."
          # Fail-safe by construction: only declare success when every
          # check is in a known-good terminal state. Any state this
          # doesn't recognize (CANCELLED, TIMED_OUT, ACTION_REQUIRED,
          # STALE, an empty check list, or anything GitHub adds later)
          # falls through to "pending" and eventually the 20-minute
          # timeout below, rather than being silently treated as success.
          for _ in $(seq 1 40); do
            STATE=$(gh pr checks "$PR_NUMBER" --json state -q '
              if length == 0 then "pending"
              elif any(.[]; .state == "PENDING" or .state == "IN_PROGRESS" or .state == "QUEUED" or .state == "REQUESTED" or .state == "WAITING") then "pending"
              elif any(.[]; .state == "FAILURE" or .state == "ERROR") then "failed"
              elif all(.[]; .state == "SUCCESS" or .state == "NEUTRAL" or .state == "SKIPPED") then "success"
              else "pending" end' 2>/dev/null || echo "pending")
            echo "CI state: $STATE"
            [ "$STATE" = "success" ] && break
            if [ "$STATE" = "failed" ]; then
              gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
              gh pr comment "$PR_NUMBER" --body "CI failed after principal review approved auto-merge — routed to a human instead of merging on red CI."
              exit 0
            fi
            sleep 30
          done

          if [ "$STATE" != "success" ]; then
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "CI didn't finish within 20 minutes of auto-merge approval — routed to a human instead of waiting indefinitely."
            exit 0
          fi

          # Re-check both kill switches immediately before merging, not
          # just once at the top of this step — the pipeline could have
          # been paused, or a human could have parked this specific PR,
          # at any point during the up-to-20-minute wait above.
          if [ "${{ vars.AGENTS_PAUSED }}" = "true" ]; then
            echo "AGENTS_PAUSED became true during this run — stopping short of merge." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "Pipeline was paused (AGENTS_PAUSED) after approval but before merge — routed to a human instead of auto-merging."
            exit 0
          fi
          if [ "${{ vars.AUTO_MERGE_DISABLED }}" = "true" ]; then
            echo "AUTO_MERGE_DISABLED became true during this run — stopping short of merge." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "Auto-merge was disabled (AUTO_MERGE_DISABLED) after approval but before merge — routed to a human instead of auto-merging."
            exit 0
          fi
          CURRENT_PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          if echo ",$CURRENT_PR_LABELS," | grep -q ",status:blocked,"; then
            echo "status:blocked was added during this run — stopping short of merge." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "status:blocked was applied after approval but before merge — routed to a human instead of auto-merging."
            exit 0
          fi

          if ! gh pr merge "$PR_NUMBER" --squash --delete-branch=false; then
            echo "gh pr merge failed (conflict, branch protection, or stale approval) — see the log above for the exact error." >&2
            gh pr edit "$PR_NUMBER" --remove-label status:approved-auto-merge --add-label status:needs-human-merge
            gh pr comment "$PR_NUMBER" --body "Auto-merge failed (see the workflow run log for the exact error) — routed to a human instead of leaving this stuck on status:approved-auto-merge."
            exit 0
          fi
          echo "Merged #$PR_NUMBER."

          # Best-effort audit log (Phase 4 guardrail) — wrapped so a
          # failure here doesn't fail the run: the merge itself already
          # succeeded, which is what actually matters.
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q .title | sed 's/|/\\|/g')
            ISSUE_NUMBER=$(.github/scripts/resolve_linked_issue.sh "$PR_NUMBER" 2>/dev/null || echo "")
            # Read the merge commit GitHub actually recorded for THIS PR,
            # not the current tip of dev after a fetch — another
            # principal-review run for a different PR isn't serialized
            # against this one (concurrency groups are per-PR) and could
            # land its own merge on dev in between, which would make
            # "tip of dev" record the wrong commit for this log entry.
            MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit -q .mergeCommit.oid)
            git fetch origin dev
            git checkout -B dev origin/dev
            printf '| %s | [#%s](%s/%s/pull/%s) | %s | %s | [%s](%s/%s/commit/%s) |\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$PR_NUMBER" "${{ github.server_url }}" "${{ github.repository }}" "$PR_NUMBER" \
              "$PR_TITLE" \
              "${ISSUE_NUMBER:+#$ISSUE_NUMBER}" \
              "${MERGE_SHA:0:7}" "${{ github.server_url }}" "${{ github.repository }}" "$MERGE_SHA" \
              >> docs/auto-merge-log.md
            git add docs/auto-merge-log.md
            git commit -m "chore(auto-merge-log): record PR #$PR_NUMBER"
            git push origin dev
          } || echo "Auto-merge log update failed (non-fatal — the merge itself succeeded) — see the log above for details." >&2
