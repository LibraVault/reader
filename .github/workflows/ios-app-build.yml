name: iOS App Build & Test

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - dev
      - feat/v3-ios-port
  pull_request:
    branches:
      - dev
      - feat/v3-ios-port

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build & Test iOS (Simulator)
    runs-on: macos-26
    timeout-minutes: 30

    env:
      XCODEPROJ: ios/LibraVaultApp/LibraVault/LibraVault.xcodeproj
      SCHEME: LibraVault
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # Pocket TTS's native frameworks + bundled voice model (~230MB combined)
      # aren't committed to git - see SHERPA_ONNX_SETUP.md. Cached across runs
      # since the pinned versions (sherpa-onnx, onnxruntime, the voice model)
      # rarely change.
      - name: Cache Pocket TTS iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            third-party/sherpa-onnx/ios
            ios/LibraVaultApp/LibraVault/LibraVault/PocketTTSModel
          key: pocket-tts-ios-${{ hashFiles('third-party/sherpa-onnx/setup-ios.sh') }}

      - name: Fetch Pocket TTS iOS dependencies
        run: ./third-party/sherpa-onnx/setup-ios.sh

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  build-android-app:
    name: Build Android App
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Core Modules
        run: |
          ./gradlew :core:domain:assembleDebug \
                    :core:tts:assembleDebug \
                    :core:logger:assembleDebug \
                    :core:storage:assembleDebug \
                    :core:licensing:assembleDebug -q

      - name: Run Unit Tests
        run: |
          ./gradlew :core:domain:test \
                    :core:tts:test \
                    :core:logger:test -q

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: build/reports/
          retention-days: 7
          if-no-files-found: ignore

  report-status:
    name: Report Build Status
    runs-on: ubuntu-24.04
    needs: [build-ios-simulator, build-android-app]
    if: always()
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const iosResult = '${{ needs.build-ios-simulator.result }}';
            const androidResult = '${{ needs.build-android-app.result }}';
            const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const overall = (iosResult === 'success' && androidResult === 'success') ? 'PASSED' : 'FAILED';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📱 iOS Build Status: ${overall}

              ${icon(iosResult)} **iOS Simulator Build & Tests** - ${iosResult}
              ${icon(androidResult)} **Android Core Modules** - ${androidResult}

              [View run details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })
