name: iOS App Build & Test

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - dev
      - feat/v3-ios-port
  pull_request:
    branches:
      - dev
      - feat/v3-ios-port
    # ready_for_review added on top of the (otherwise implicit)
    # opened/synchronize/reopened defaults — needed because dev-agent now
    # opens its PRs as --draft and pushes several commits before marking
    # one ready (see .claude/agents/dev-agent.md's "Open the PR early, as
    # a checkpoint" section); without this, the *first* real CI signal
    # for a draft-opened PR would only arrive on whatever push happens to
    # land after `gh pr ready`, if any ever does.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap (~10s) path filter so a docs-only PR (README, docs/**, issue
  # templates, ...) doesn't pay for a ~10-15min iOS simulator build or an
  # Android core-modules build it can't possibly affect — PR #414 was a
  # single-commit, non-draft, docs-only PR that still ran both full builds,
  # which is what prompted this. Runs unconditionally (no draft/event-type
  # guard) so it's always available as a `needs` dependency without the
  # guard cascading into a skip for jobs that shouldn't be skipped — see
  # each job below.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      # paths-filter diffs via the GitHub API on `pull_request` events (no
      # checkout needed) but falls back to local git history on `push`
      # events — with no checkout at all, that fails with "not a git
      # repository" on every push to dev/main. fetch-depth: 0 (full
      # history) rather than a shallow depth because paths-filter's
      # default base for push is the commit before the push
      # (github.event.before), which can be arbitrarily far back for a
      # multi-commit push. See issue #514.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'third-party/sherpa-onnx/**'
              - '.github/workflows/ios-app-build.yml'
            android:
              - 'app/**'
              - 'core/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'third-party/sherpa-onnx/**'
              - '.github/workflows/ios-app-build.yml'

  build-ios-simulator:
    name: Build & Test iOS (Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    needs: changes
    # Skip for draft PRs — see the `pull_request.types` comment above.
    # iOS build minutes are this pipeline's scarcest CI resource; running
    # a full ~10-15min simulator build+test on every intermediate commit
    # of a still-in-progress draft is pure waste (cancel-in-progress
    # avoids pileup, but each superseded run still spins up a runner and
    # does real work first). Also skip when the PR's diff doesn't touch
    # `ios` per the `changes` job above (a docs-only PR, say) — nothing in
    # this job could possibly turn up a different result. `push` events
    # have no `pull_request` context and no path filter applied to them at
    # all, so they're always allowed through unconditionally, same as before.
    #
    # `|| needs.changes.result != 'success'` (issue #416): this job's name
    # is itself a required status check in branch protection — if
    # `changes` errors, its outputs are never set,
    # `needs.changes.outputs.ios == 'true'` reads false either way, and
    # without this clause the job would land on 'skipped', which GitHub
    # treats as a passing required check. Run anyway in that case so the
    # guard step below can fail it explicitly instead of silently passing.
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
        (needs.changes.outputs.ios == 'true' || needs.changes.result != 'success'))

    env:
      XCODEPROJ: ios/LibraVaultApp/LibraVault/LibraVault.xcodeproj
      SCHEME: LibraVault
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Fail if the changes/paths-filter job itself didn't succeed
        # See the `if:` comment above — this only ever runs when
        # `changes` errored (a legitimate ios-untouched skip never
        # reaches this job at all), so it's always a hard failure.
        if: needs.changes.result != 'success'
        run: |
          echo "The 'changes' (paths-filter) job did not succeed (result: ${{ needs.changes.result }}) — failing closed instead of trusting its (unset) outputs. See issue #416." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # Pocket TTS's native frameworks + bundled voice model (~230MB combined)
      # aren't committed to git - see SHERPA_ONNX_SETUP.md. Cached across runs
      # since the pinned versions (sherpa-onnx, onnxruntime, the voice model)
      # rarely change.
      - name: Cache Pocket TTS iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            third-party/sherpa-onnx/ios
            ios/LibraVaultApp/LibraVault/LibraVault/PocketTTSModel
          key: pocket-tts-ios-${{ hashFiles('third-party/sherpa-onnx/setup-ios.sh') }}

      - name: Fetch Pocket TTS iOS dependencies
        run: ./third-party/sherpa-onnx/setup-ios.sh

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Boot the simulator up front and wait for it, rather than letting xcodebuild
      # race a cold first boot while it is also installing the test runner. That race
      # was one of the ways this step used to stall until the job timeout.
      - name: Boot Simulator
        run: |
          xcrun simctl boot "iPhone 17" 2>/dev/null || true
          xcrun simctl bootstatus "iPhone 17"

      # -only-testing:LibraVaultTests is the point of this step. It previously ran the
      # whole scheme — despite the name — which meant the XCUITest target ran here too
      # and its simulator flakiness failed the job that gates merges, even though the
      # unit target passed every time. UI tests now live in their own job below.
      #
      # -parallel-testing-enabled NO stops Xcode cloning the simulator ("Clone 1 of
      # iPhone 17", "Clone 2 of ...") — on a shared macOS runner those clones starve
      # each other and produce DTServiceHub launch failures and 100s+ test durations.
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:LibraVaultTests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/unit-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # iOS had no coverage measurement at all before this (docs/TEST_COVERAGE_PRD.md
      # Phase 1). Reporting only — nothing here fails the job, because the first
      # honest numbers need to be seen before anyone can argue about a threshold.
      #
      # Vendored code is excluded. SherpaOnnx.swift alone is 2,283 LOC of
      # generated bridge with no tests and no intention of any, and the
      # ThirdParty/Argon2 C sources add another ~1,360 executable lines that
      # our test suite is not responsible for — they are upstream's, vendored
      # verbatim (see ThirdParty/Argon2/VENDORING.md). Leaving either in
      # measures how much of somebody else's code we happen to execute, which
      # is not a number anyone should act on.
      - name: Coverage summary
        if: always()
        run: |
          set -o pipefail
          BUNDLE="$RUNNER_TEMP/unit-tests.xcresult"
          if [ ! -d "$BUNDLE" ]; then
            echo "No xcresult bundle — tests did not produce one." >&2
            exit 0
          fi
          xcrun xccov view --report --json "$BUNDLE" > "$RUNNER_TEMP/coverage.json"
          python3 - "$RUNNER_TEMP/coverage.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          # Vendored/generated, plus the ThirdParty/Argon2 C sources (*.c/*.h).
          EXCLUDE = ("SherpaOnnx.swift", "UITestFixtures.swift", ".c", ".h")
          report = json.load(open(sys.argv[1]))
          files = [f for t in report.get("targets", [])
                     for f in t.get("files", [])
                     if not f["name"].endswith(EXCLUDE)]
          cov = sum(f["coveredLines"] for f in files)
          tot = sum(f["executableLines"] for f in files)
          pct = 100.0 * cov / tot if tot else 0.0
          print("## iOS line coverage\n")
          print(f"**Overall: {pct:.1f}%** ({cov:,} / {tot:,} executable lines, "
                f"{len(files)} files)")
          print("\n_Excludes vendored and generated sources: SherpaOnnx.swift, "
                "UITestFixtures.swift, and the ThirdParty/Argon2 C sources._\n")
          print("| File | Covered | Total | Coverage |")
          print("|---|---:|---:|---:|")
          for f in sorted(files, key=lambda f: f["lineCoverage"]):
              if f["executableLines"]:
                  print(f"| `{f['name']}` | {f['coveredLines']:,} | "
                        f"{f['executableLines']:,} | {100*f['lineCoverage']:.1f}% |")
          PY

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage-report
          path: ${{ runner.temp }}/coverage.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/unit-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # Separated from the gating job above deliberately. These tests depend on simulator
  # app launch, which on GitHub's macOS runners fails often enough to be useless as a
  # merge gate (see the "iOS Simulator CI job gives no signal" issue) — but the answer
  # is a distinct red check you can look at, NOT `continue-on-error` inside the main
  # job, which is how a real breakage got masked here once before.
  #
  # Keep this job out of report-status's `needs` so its result stays informational.
  # If it becomes reliable, make it a required check in branch protection.
  build-ios-ui-tests:
    name: iOS UI Tests (informational)
    runs-on: macos-26
    timeout-minutes: 45
    needs: changes
    # See build-ios-simulator's identical guard for why (draft + path filter).
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.ios == 'true')

    env:
      XCODEPROJ: ios/LibraVaultApp/LibraVault/LibraVault.xcodeproj
      SCHEME: LibraVault
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Cache Pocket TTS iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            third-party/sherpa-onnx/ios
            ios/LibraVaultApp/LibraVault/LibraVault/PocketTTSModel
          key: pocket-tts-ios-${{ hashFiles('third-party/sherpa-onnx/setup-ios.sh') }}

      - name: Fetch Pocket TTS iOS dependencies
        run: ./third-party/sherpa-onnx/setup-ios.sh

      - name: Boot Simulator
        run: |
          xcrun simctl boot "iPhone 17" 2>/dev/null || true
          xcrun simctl bootstatus "iPhone 17"

      # -retry-tests-on-failure re-runs only the individual tests that failed, so a
      # one-off launch failure doesn't redden the whole target, while a test that is
      # genuinely broken still fails after its retries.
      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:LibraVaultUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: ${{ runner.temp }}/ui-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  build-android-app:
    name: Build Android App
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: changes
    # See build-ios-simulator's identical guard for why (draft + path filter,
    # `android` output instead of `ios`, plus the `|| needs.changes.result
    # != 'success'` fail-closed clause for issue #416 — this job's name is
    # also a required status check).
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
        (needs.changes.outputs.android == 'true' || needs.changes.result != 'success'))
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Fail if the changes/paths-filter job itself didn't succeed
        # See build-ios-simulator's identical guard step for why.
        if: needs.changes.result != 'success'
        run: |
          echo "The 'changes' (paths-filter) job did not succeed (result: ${{ needs.changes.result }}) — failing closed instead of trusting its (unset) outputs. See issue #416." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Core Modules
        run: |
          ./gradlew :core:domain:assembleDebug \
                    :core:tts:assembleDebug \
                    :core:logger:assembleDebug \
                    :core:storage:assembleDebug -q

      - name: Run Unit Tests
        run: |
          ./gradlew :core:domain:test \
                    :core:tts:test \
                    :core:logger:test -q

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: build/reports/
          retention-days: 7
          if-no-files-found: ignore

  report-status:
    name: Report Build Status
    runs-on: ubuntu-24.04
    needs: [changes, build-ios-simulator, build-android-app]
    # always() so this still runs (and can fail the check) when the two
    # jobs above genuinely fail, not just when they succeed — but ANDed
    # with the same draft guard those jobs use, so a draft-skipped run
    # doesn't report a false "FAILED" (needs.*.result == 'skipped' would
    # otherwise trip the "Fail if either build failed" step below) or post
    # a misleading build-status comment for work that was never run.
    #
    # `changes` is listed in `needs:` here (not just transitively through
    # build-ios-simulator/build-android-app) so this job's own steps can
    # read `needs.changes.result` directly — see issue #416: if `changes`
    # itself errors (not "ran and found nothing", but actually failed),
    # its outputs are never set, `needs.changes.outputs.ios == 'true'`
    # reads false either way, and both build jobs land on 'skipped' —
    # indistinguishable, to the "Fail if either build failed" step below,
    # from a legitimate "this diff doesn't touch iOS/Android" skip. That
    # would let a required check report green with no build having run at
    # all. The failure step below checks `needs.changes.result` explicitly
    # to close that gap.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const iosResult = '${{ needs.build-ios-simulator.result }}';
            const androidResult = '${{ needs.build-android-app.result }}';

            // Both skipped means the `changes` job found nothing in the diff
            // that could affect either build (a docs-only PR, say) — nothing
            // ran, so there's nothing to report. Stay quiet instead of
            // posting a comment that just says "PASSED" for work that never
            // happened.
            if (iosResult === 'skipped' && androidResult === 'skipped') {
              return;
            }

            const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            // 'skipped' counts as passing here too — the `changes` job already
            // decided that build wasn't relevant to this diff, same as a
            // draft-PR skip always has.
            const passed = (r) => r === 'success' || r === 'skipped';
            const overall = (passed(iosResult) && passed(androidResult)) ? 'PASSED' : 'FAILED';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📱 iOS Build Status: ${overall}

              ${icon(iosResult)} **iOS Simulator Build & Unit Tests** - ${iosResult}
              ${icon(androidResult)} **Android Core Modules** - ${androidResult}

              _iOS UI tests run in a separate, informational job and are not reflected above — check "iOS UI Tests (informational)" for those._

              [View run details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })

      # The comment step above can post "iOS Build Status: FAILED" while
      # this job itself still exits 0 (github-script doesn't fail the job
      # on its own) — this job was `if: always()`, no step here ever
      # exited non-zero, so a real build failure never blocked a PR that
      # required this check. Fail explicitly instead of relying on the
      # comment being read. See issue #245.
      #
      # 'skipped' is explicitly excluded from the failure condition here —
      # a build can now be 'skipped' for a real, path-filter-verified
      # reason (see the `changes` job) rather than only ever meaning
      # "draft PR, everything below skipped identically too". Only an
      # actual non-success, non-skipped result (failure, cancelled, ...)
      # should fail this check.
      #
      # `changes` itself must have actually succeeded, though (issue
      # #416) — a 'skipped' build result is only trustworthy as "not
      # relevant to this diff" when the job that made that call ran
      # cleanly. `changes` has no `if:` guard of its own, so it always
      # runs (never legitimately 'skipped'); if it errored instead, fail
      # closed rather than let two path-filter-derived skips read as a
      # pass.
      - name: Fail if either build failed
        if: |
          needs.changes.result != 'success' ||
          (needs.build-ios-simulator.result != 'success' && needs.build-ios-simulator.result != 'skipped') ||
          (needs.build-android-app.result != 'success' && needs.build-android-app.result != 'skipped')
        run: |
          echo "changes: ${{ needs.changes.result }}" >&2
          echo "build-ios-simulator: ${{ needs.build-ios-simulator.result }}" >&2
          echo "build-android-app: ${{ needs.build-android-app.result }}" >&2
          exit 1
