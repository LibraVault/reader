name: Dev Agent

# Phase 1 of docs/agent-team-pipeline.md. Triages a filed issue and, if the
# dev-agent persona (.claude/agents/dev-agent.md) can scope it confidently,
# implements a fix/feature and opens a PR. Also re-invoked when the qa agent
# sends a PR back with status:in-progress (see that persona's "When QA
# sends work back" section). See the persona file for what it actually
# does — this workflow only wires triggers, guardrails, and the
# deterministic risk/needs-qa backstops around it.

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage/implement (manual test trigger)"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  # claude-code-action requests an OIDC ID token as part of its own
  # auth/telemetry setup. Without this, actions/core's OidcClient can't
  # find ACTIONS_ID_TOKEN_REQUEST_URL in the environment and the "Run dev
  # agent" step fails after 3 retries with "Could not fetch an OIDC
  # token" — confirmed via a real failed run (issue #158).
  id-token: write
  # count_active_agent_runs.sh (Phase 4 concurrency cap) calls
  # `gh run list`, which needs this — without it every trigger fails at
  # the guard step with a 403, not just a soft cap miss.
  actions: read

concurrency:
  # Known gap, accepted rather than engineered around: a triage run (keyed
  # by issue number) and a later revise run for a PR against that same
  # issue (keyed by PR number) use different concurrency groups, since
  # concurrency.group is fixed from raw event context before any step
  # runs — it can't call the script that resolves a PR back to its issue.
  # In practice this only matters if a human manually re-triggers triage
  # (e.g. re-applying status:ready-for-dev) while a revise run for the
  # same issue's PR is already in flight; AGENTS_PAUSED / status:blocked
  # are the intended manual override if that's ever actually hit.
  group: ${{ github.event_name == 'pull_request' && format('dev-agent-pr-{0}', github.event.pull_request.number) || format('dev-agent-issue-{0}', github.event.issue.number || github.event.inputs.issue_number) }}
  cancel-in-progress: false

jobs:
  triage-and-implement:
    # SECURITY-CRITICAL gate, not just a convenience filter: this repo is
    # public, so `issues: opened` fires for literally anyone who opens an
    # issue, with no permission required, and `pull_request: labeled` fires
    # for PRs from forks too. Without the checks below, an untrusted
    # issue/PR would be handed to an agent holding contents:write and a
    # Bash tool. workflow_dispatch is exempt because GitHub itself already
    # requires write access to trigger it manually, so it's inherently
    # trusted.
    #
    # The issues-trigger case checks the ISSUE author's association
    # (a human filing an issue). The pull_request-trigger case deliberately
    # does NOT check the PR author's association — every PR in this
    # pipeline is opened by the dev agent itself via GITHUB_TOKEN, whose
    # author_association is NOT "COLLABORATOR" (that check would make this
    # trigger never fire for any PR the pipeline itself produces). Trust
    # here instead rests on GitHub's own enforcement of who can add a label
    # at all (requires triage/write access) plus the same-repo check below.
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issues' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
          (
            github.event.action == 'opened' ||
            (github.event.action == 'labeled' && github.event.label.name == 'status:ready-for-dev')
          )
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'status:in-progress' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target, mode, and check for status:blocked
        id: guard
        env:
          # Mostly read-only lookups plus label reads, and a capacity-
          # exceeded comment if the concurrency cap below is hit — the
          # safe default token is enough for both. Nothing in this step
          # needs to trigger a further workflow run.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            ISSUE_NUMBER=$(.github/scripts/resolve_linked_issue.sh "$PR_NUMBER")
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "Could not resolve the originating issue from PR #$PR_NUMBER's body (expects e.g. 'Closes #N' on its own line) — stopping." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            MODE="revise"
            echo "mode=revise" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

            PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
            if echo ",$PR_LABELS," | grep -q ",status:blocked,"; then
              echo "PR #$PR_NUMBER carries status:blocked — a human parked this, skipping." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            ISSUE_NUMBER="${{ github.event.issue.number || github.event.inputs.issue_number }}"
            MODE="triage"
            echo "mode=triage" >> "$GITHUB_OUTPUT"
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          # Guarded rather than left to fail under set -e: in revise mode,
          # ISSUE_NUMBER came from regex-parsing free text in the PR body,
          # so a deleted/transferred issue or a stale reference shouldn't
          # hard-crash this step — just treat it as unblocked and proceed.
          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null) || {
            echo "Could not read issue #$ISSUE_NUMBER (deleted/transferred/inaccessible?) — treating as unblocked." >&2
            LABELS=""
          }
          echo "Issue #$ISSUE_NUMBER labels: $LABELS"
          if echo ",$LABELS," | grep -q ",status:blocked,"; then
            echo "status:blocked is set — a human parked this, skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Triage-only re-trigger guard. Found live: issue #195 got two
          # independent triage runs (#196 and #197, two competing PRs for
          # the same issue) — not because the concurrency group above
          # failed (it correctly serialized them, one queued behind the
          # other, never in parallel — confirmed from the run log), but
          # because the dev agent's own status:ready-for-dev /
          # status:in-progress self-labeling during the FIRST run
          # re-matches this workflow's `labeled` trigger condition. Once
          # unblocked, the second run had nothing telling it triage
          # already happened, so it triaged the same issue again from
          # scratch.
          #
          # Deliberately checks for an existing OPEN PR rather than a
          # status:* label: a label-based check would permanently lock the
          # issue out of re-triage once status:in-progress lands, with no
          # automated way to clear it — nothing ever removes that label
          # from the ISSUE (only from the PR), so if that PR is later
          # closed without merging, a human re-applying status:ready-for-dev
          # to restart the work would be silently skipped forever. An
          # open-PR check is self-healing: once the PR is closed, this
          # search naturally comes up empty and re-triage is allowed again
          # — no manual cleanup step needed. Same search predicate as the
          # "Force-classify risk" step's fallback further down, so both
          # checks agree on what "has a PR" means.
          #
          # Safe against the concurrency group above hiding an in-flight
          # (not-yet-created) PR from run 2: with cancel-in-progress:false
          # and a shared group, run 2's guard step cannot start until run
          # 1's entire job — including any PR it creates — has finished.
          if [ "$MODE" = "triage" ]; then
            if ! EXISTING_PR=$(.github/scripts/find_linked_pr.sh "$ISSUE_NUMBER"); then
              # Fail closed, not open: a transient gh/API failure here
              # must not be treated as "no PR exists yet" — that's exactly
              # the assumption that would let this run redo triage and
              # open a duplicate. Worst case of skipping is a delayed
              # triage, recoverable by any later trigger; worst case of
              # proceeding on a false negative is the bug this PR fixes.
              echo "find_linked_pr.sh failed for issue #$ISSUE_NUMBER — can't confirm it's safe to triage, skipping rather than risking a duplicate PR." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            EXISTING_PR=""
          fi
          if [ -n "$EXISTING_PR" ]; then
            echo "Issue #$ISSUE_NUMBER already has an open PR (#$EXISTING_PR) referencing it — a dev-agent run already produced one, skipping re-triage." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Global concurrency cap (Phase 4 guardrail) — distinct from the
          # per-item concurrency group above, which only stops two runs
          # touching the SAME issue/PR at once. This bounds total pipeline
          # activity across every issue/PR at once (Claude subscription
          # usage burst, CI runner contention, concurrent PRs risking
          # merge races). See docs/agent-team-pipeline.md's rollout plan.
          read -r ACTIVE MAX <<< "$(.github/scripts/count_active_agent_runs.sh "${{ github.run_id }}" "${{ vars.MAX_CONCURRENT_AGENT_RUNS }}")"
          if [ "$ACTIVE" -ge "$MAX" ]; then
            echo "At capacity ($ACTIVE/$MAX active pipeline runs) — skipping." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            if [ -n "${PR_NUMBER:-}" ]; then
              gh pr comment "$PR_NUMBER" --body "Pipeline is at capacity ($ACTIVE/$MAX active runs) — skipping this run. Re-apply the triggering label once activity settles, or re-trigger manually via workflow_dispatch."
            else
              gh issue comment "$ISSUE_NUMBER" --body "Pipeline is at capacity ($ACTIVE/$MAX active runs) — skipping this run. Re-apply status:ready-for-dev once activity settles, or re-trigger manually via workflow_dispatch."
            fi
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out PR branch (revise mode only)
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.mode == 'revise'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Deterministic, unlike qa-agent.yml/principal-review.yml this
        # mirrors — don't rely solely on the agent remembering to run
        # `gh pr checkout` from its prompt; actions/checkout@v4 otherwise
        # leaves the runner in detached HEAD on the PR's merge ref. Also
        # clears any dev-agent-pr-number.txt that happens to already be
        # committed on this branch (e.g. leftover from an earlier round)
        # so the next step never reads stale scratch state.
        run: |
          gh pr checkout "${{ steps.guard.outputs.pr_number }}"
          rm -f dev-agent-pr-number.txt

      - name: Mint pipeline App token
        # Moved ahead of "Run dev agent" (rather than only after it, as
        # qa-agent.yml/principal-review.yml do) — the agent itself needs
        # this available as APP_GH_TOKEN. Discovered via a live run
        # (issue #182): with only GITHUB_TOKEN available, `gh pr create`
        # fails outright with "GitHub Actions is not permitted to create
        # or approve pull requests" — a repo/org setting, a different
        # limit than GITHUB_TOKEN's inability to trigger further workflow
        # runs. Fixed by routing PR creation specifically through the App
        # token rather than loosening that repo setting, consistent with
        # this pipeline's least-privilege default elsewhere.
        if: steps.guard.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Run dev agent
        if: steps.guard.outputs.skip != 'true'
        id: agent
        env:
          # Deliberately the default GITHUB_TOKEN as the primary $GH_TOKEN,
          # not the pipeline App token — this step self-applies
          # status:ready-for-dev/status:in-progress to the SAME issue this
          # run is already processing. Using a token capable of triggering
          # further runs for THOSE calls would fire a duplicate
          # dev-agent.yml invocation for an issue already mid-run (the
          # issues:labeled trigger matches status:ready-for-dev).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Separate var, used ONLY for `gh pr create` per the prompt
          # below — GITHUB_TOKEN can't create PRs at all in this repo (see
          # the App-token step's comment above), and PR creation itself
          # doesn't trigger any workflow this pipeline cares about (ours
          # all trigger on labeled, not opened), so there's no self-loop
          # risk in using the elevated token for this one specific call.
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: anthropics/claude-code-action@v1
        with:
          # Uses the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`,
          # tied to a Claude subscription) rather than a pay-per-token
          # anthropic_api_key. Deliberate: no separate API billing to set
          # up, at the cost of drawing on that subscription's own usage
          # limits. See docs/agent-team-pipeline.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action refuses to run at all when triggered by a
          # non-human actor by default (its own anti-recursion guard) —
          # confirmed live via qa-agent.yml hitting this exact error:
          # "Workflow initiated by non-human actor: libravault-pipeline-bot
          # (type: Bot)." The revise-mode pull_request:labeled trigger here
          # IS the pipeline App applying status:in-progress, so without
          # this the QA loop-back could never run. Harmless for the
          # issues-triggered path (human actor there already passes).
          # Scoped to our own bot by name, not '*'.
          allowed_bots: libravault-pipeline-bot
          # This — not the GH_TOKEN env var above — is what actually
          # controls the identity claude-code-action uses for git/gh
          # operations: with claude_code_oauth_token set, it defaults to
          # Claude's own claude[bot] App regardless of GH_TOKEN (confirmed
          # empirically: PR #162 shows author app/claude despite this step
          # already setting GH_TOKEN to GITHUB_TOKEN before this fix).
          # claude[bot]'s installation token is a real GitHub App token,
          # not the restricted auto-issued GITHUB_TOKEN — its cross-trigger
          # behavior isn't guaranteed the same "can't trigger further runs"
          # protection, so force GITHUB_TOKEN explicitly here to keep the
          # self-retrigger-avoidance reasoning above actually true.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to false, which hides the agent's actual turn-by-turn
          # transcript from the workflow log. Turned on permanently after
          # diagnosing a real live failure this way (issues #4, #96): the
          # agent spawned an async Explore subagent via the Agent tool —
          # NOT in --allowedTools below, but available anyway (a
          # documented Claude Agent SDK gap: disallowedTools/allowedTools
          # aren't enforced for Task-tool subagent spawning —
          # anthropics/claude-agent-sdk-typescript#189) — then correctly
          # said "I'll be notified when it completes" and stopped, exactly
          # like normal interactive Claude Code usage. There is no such
          # notification mechanism in a CI run: the job just ends, the
          # subagent's work is orphaned, and nothing ever resumes. See the
          # explicit prohibition in the prompt below, which is the actual
          # fix — a tool-level restriction can't be relied on given the
          # SDK gap above.
          show_full_output: true
          prompt: |
            Read .claude/agents/dev-agent.md in full — it is your complete
            operating persona for this run, including what "triage" and
            "implementation" mean and when to stop instead of proceeding.
            Do NOT apply status:needs-qa yourself even though the persona
            mentions it — the workflow applies that label automatically in
            a later step, using a credential that can actually trigger the
            QA workflow (yours can't). Just make sure the PR is complete
            and CI-passing (or you've explained why it isn't) before you
            finish.

            Do not use anything that depends on a completion notification
            arriving later — there is no such mechanism in this CI run, so
            it never arrives and your work is simply abandoned:
            - No subagent delegation (the Agent tool, any "Explore"/"Task"
              subagent type).
            - No backgrounded Bash commands (run_in_background) that you
              then wait to be notified about — including long ones like
              the test suite. Run every command in the foreground and wait
              for its real output before continuing, even if it takes
              several minutes; that's normal and expected here, not a
              problem to work around.
            Investigate and implement everything yourself, directly, with
            your own Read/Grep/Glob/Bash/Edit/Write calls in this same
            turn sequence, waiting synchronously for each one's actual
            result before moving on.

            ${{ steps.guard.outputs.mode == 'revise' && format('You are being RE-INVOKED: QA sent PR #{0} back with status:in-progress against issue #{1}. Read the persona''s "When QA sends work back" section. The PR''s branch is already checked out in the working directory — read the QA agent''s latest PR comment for the specific gaps it found, and fix only those. Do not rescope the whole change and do not open a new PR; push commits to this same branch.', steps.guard.outputs.pr_number, steps.guard.outputs.issue_number) || format('Triage and, if scoped confidently, implement issue #{0} in this repository (use `gh issue view` to read it).', steps.guard.outputs.issue_number) }}

            Use `gh issue comment`, `gh issue edit --add-label` / `--remove-label`
            for issue interaction, `gh pr comment` for PR interaction, and
            normal git for branching and committing. To open a *new* PR
            (only in triage mode — in revise mode, push commits to the
            existing PR's branch instead), the default token can't create
            PRs at all in this repo, so run it as:
            `GH_TOKEN="$APP_GH_TOKEN" gh pr create --base dev ...` — that
            env var is already set for you. Everything else (comments,
            labels, git push) uses the default token as normal; only the
            `gh pr create` call itself needs the override. You are running
            non-interactively in CI — there is no human to ask a follow-up
            question. If the persona says to stop and ask, do that by
            commenting and applying status:needs-info; do not wait for a
            reply.

            As your very last action, write a single line to the file
            `dev-agent-pr-number.txt` in the repo root: the PR number (new
            or revised) if one is open, or the word `none` if you stopped
            without one. The workflow reads this file to know what to do
            next, so always write it, even if something went wrong earlier.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash,Edit,Write,WebSearch"
            --max-turns 40

      - name: Force-classify risk and advance to QA
        # !cancelled() rather than the implicit success()-only default: if
        # "Run dev agent" fails/errors (max-turns exhausted, crash) rather
        # than being cancelled, this step must still run — otherwise a
        # revise-mode failure leaves the PR stuck on status:in-progress
        # forever with status:needs-qa never reapplied and no visible
        # signal beyond a red X nobody's watching. (The App token itself
        # is minted earlier now, before "Run dev agent" — see that step's
        # comment — so steps.app-token.outputs.token is already available
        # here regardless of how "Run dev agent" went.)
        if: steps.guard.outputs.skip != 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only for the one call that must cross into qa-agent.yml.
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.guard.outputs.issue_number }}"

          PR_NUMBER=""
          if [ "${{ steps.guard.outputs.mode }}" = "revise" ]; then
            # Already known and authoritative — this run exists
            # specifically because this PR was labeled status:in-progress.
            # Don't re-derive it from the scratch file or a search, which
            # exist only for triage mode (no PR is known yet there until
            # the agent creates one).
            PR_NUMBER="${{ steps.guard.outputs.pr_number }}"

            # The agent step itself failed/crashed (max-turns exhausted,
            # error) — don't advance a PR we can't trust is actually fixed
            # into QA. Route to a human instead of silently proceeding, and
            # unlike the old design, this branch now actually gets a
            # chance to run at all thanks to !cancelled() above.
            if [ "${{ steps.agent.outcome }}" = "failure" ]; then
              echo "Dev agent run failed for PR #$PR_NUMBER — routing to status:needs-info instead of advancing to QA." >&2
              gh pr edit "$PR_NUMBER" --remove-label status:in-progress || true
              gh pr edit "$PR_NUMBER" --add-label status:needs-info
              gh pr comment "$PR_NUMBER" --body "The dev agent's run failed (crashed or exhausted its turn budget) while revising this PR — routed to a human instead of silently leaving it on status:in-progress or advancing an unfinished fix to QA. See the workflow run log for what happened."
              exit 0
            fi
          fi

          if [ -z "$PR_NUMBER" ] && [ -f dev-agent-pr-number.txt ]; then
            CONTENT=$(tr -d '[:space:]' < dev-agent-pr-number.txt)
            if [ "$CONTENT" != "none" ] && [ -n "$CONTENT" ]; then
              PR_NUMBER="$CONTENT"
            fi
            rm -f dev-agent-pr-number.txt
          fi

          # Fallback if the agent didn't write the file for some reason:
          # find_linked_pr.sh already retries for gh's search-index lag and
          # verifies each candidate with the same precise match
          # resolve_linked_issue.sh uses, so this can't drift narrower (or
          # looser) than the guard step's own use of it. Failure here
          # degrades to "not found" rather than hard-failing the step —
          # unlike the guard step's fail-closed stance, there's no
          # duplicate-PR risk on this path, just a PR that misses its
          # automatic risk-classification/needs-qa advance, which a human
          # would still notice.
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(.github/scripts/find_linked_pr.sh "$ISSUE_NUMBER") || {
              echo "find_linked_pr.sh failed while looking up issue #$ISSUE_NUMBER's PR — treating as not found." >&2
              PR_NUMBER=""
            }
          fi

          if [ -z "$PR_NUMBER" ]; then
            # Live-tested gap (issue #210, found re-running the Phase 5
            # pilot after fixing #207): a triage-mode run can self-apply
            # status:ready-for-dev/status:in-progress (real signs it
            # started legitimate work), then crash mid-implementation
            # before opening a PR. steps.agent.outcome == 'failure' below
            # already catches this for REVISE mode; it wasn't checked here
            # for triage mode, so the label-presence check right after
            # this would have wrongly read those same in-progress labels
            # as "legitimately stopped at triage" — same issue left stuck
            # forever, just with a red X on the workflow run instead of a
            # deceptively green one. Check the crash first, before
            # thinking about what labels are present at all.
            if [ "${{ steps.agent.outcome }}" = "failure" ]; then
              echo "Dev agent run failed for issue #$ISSUE_NUMBER — routing to status:needs-info." >&2
              # Clear BOTH labels a legitimately-started triage run could
              # have self-applied before crashing (see step 5 of the
              # persona's Triage section) — not just status:in-progress.
              # A crash between self-applying status:ready-for-dev and
              # ever reaching status:in-progress (e.g. a mid-triage tool
              # error, before implementation starts) previously left
              # status:ready-for-dev in place alongside the new
              # status:needs-info, so re-triggering the pipeline just by
              # removing status:needs-info (its usual "human resolved
              # this" signal) would silently re-fire triage on an issue a
              # human hasn't actually looked at yet (issue #236).
              gh issue edit "$ISSUE_NUMBER" --remove-label status:in-progress || true
              gh issue edit "$ISSUE_NUMBER" --remove-label status:ready-for-dev || true
              gh issue edit "$ISSUE_NUMBER" --add-label status:needs-info
              gh issue comment "$ISSUE_NUMBER" --body "The dev agent's run failed (crashed or exhausted its turn budget) partway through triage/implementation, before opening a PR — routed to a human instead of silently leaving this on status:in-progress or status:ready-for-dev. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
              exit 0
            fi

            # No PR is legitimate at triage — but only if the agent
            # actually followed its persona's mandated fallback (apply
            # status:ready-for-dev to proceed, or status:needs-info to
            # stop and ask). Live-tested gap (issue #207, found during
            # the Phase 5 pilot): a run can complete with outcome=success
            # — no crash, nothing for the check above to catch — while
            # silently taking no action at all: no PR, no label, no
            # comment. That reports as a clean green run with the issue
            # left completely untouched and no human-visible signal
            # anything happened. Distinguish the two by checking for
            # evidence of ANY expected outcome label.
            CURRENT_ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            if echo ",$CURRENT_ISSUE_LABELS," | grep -qE ",status:(ready-for-dev|in-progress|needs-info),"; then
              echo "No PR found referencing issue #$ISSUE_NUMBER, but it carries an expected status label — dev agent legitimately stopped at triage. Nothing to classify."
            else
              echo "Dev agent run completed without error but took no visible action on issue #$ISSUE_NUMBER (no PR, no expected status label) — treating as a malfunction, not a legitimate triage stop." >&2
              gh issue edit "$ISSUE_NUMBER" --add-label status:needs-info
              gh issue comment "$ISSUE_NUMBER" --body "The dev agent's run completed without error, but took no visible action on this issue — no PR opened, no status label applied, no comment explaining why it stopped. Routed to status:needs-info for a human to look at directly; see the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (issue #207)."
            fi
            exit 0
          fi
          echo "Classifying risk for PR #$PR_NUMBER"

          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
          git fetch origin dev "$HEAD_REF"

          pip install --quiet pyyaml
          python3 .github/scripts/classify_pr_risk.py \
            "origin/dev" "origin/$HEAD_REF" --apply-label "$PR_NUMBER"

          # status:needs-qa must be applied with the App token, not
          # GITHUB_TOKEN — see docs/agent-team-pipeline.md's
          # "Cross-workflow triggering" section for why. Idempotent: if
          # it's already present (shouldn't be, but just in case), skip
          # rather than no-op-adding it, since a no-op add fires no event.
          # Clear status:in-progress in case this is a revise-mode run —
          # a fresh triage run never has it, so this is a harmless no-op
          # there.
          gh pr edit "$PR_NUMBER" --remove-label status:in-progress || true

          CURRENT_LABELS=$(GH_TOKEN="$GH_TOKEN" gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          if echo ",$CURRENT_LABELS," | grep -q ",status:needs-qa,"; then
            echo "status:needs-qa already present on #$PR_NUMBER — leaving as-is."
          else
            GH_TOKEN="$APP_GH_TOKEN" gh pr edit "$PR_NUMBER" --add-label status:needs-qa
            echo "Applied status:needs-qa to #$PR_NUMBER."
          fi
